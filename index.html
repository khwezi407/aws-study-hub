function getTopConfusions(n){return Object.entries(confusions).map(([k,v])=>({...v,key:k})).sort((a,b)=>b.count-a.count).slice(0,n);}
function renderWeaknessDrill(){
  const top=getTopConfusions(5);
  if(!top.length) return `<div class="card-sm"><p class="muted">No confusion patterns yet. Answer some questions and your common mistakes will appear here.</p></div>`;
  return `<div class="card-sm" style="margin-bottom:1rem"><h2>🔁 Your Top Confusion Pairs</h2>
    ${top.map((c,i)=>`<div class="confusion-pair" style="margin-bottom:.45rem">
      <div><div class="confusion-services">${i+1}. ${c.aLabel} → ${c.bLabel}</div><div class="confusion-count">Mixed up ${c.count} time${c.count!==1?'s':''}</div></div>
      <div style="display:flex;gap:.35rem"><button class="btn btn-secondary btn-sm" onclick="startConfusionDrill('${c.key.replace(/'/g,"\\'")}')">Drill</button><button class="btn btn-secondary btn-sm" onclick="showCompare('${c.key.replace(/'/g,"\\'")}')">Compare</button></div>
    </div>`).join('')}
  </div>`;
}
function renderFlashcards(){
  const unseen=window.QUESTIONS.filter(q=>!progress[q.id]||progress[q.id].attempts===0);
  const pool=shuffle(unseen.length>0?unseen:window.QUESTIONS).slice(0,10);
  const poolIds=pool.map(q=>q.id);
  return `
  <div style="margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
    <div>
      <div style="font-size:.82rem;color:var(--muted)"><strong style="color:var(--blue2)">${pool.length} cards</strong> · ${unseen.length>0?`${unseen.length} unseen questions`:'Full deck — all questions attempted'}</div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="renderAndReplace('practice-content',renderFlashcards)">🔀 New Shuffle</button>
  </div>
  <div id="flashcard-container" data-idx="0" data-pool='${JSON.stringify(poolIds)}'>
    ${renderFlashcardItem(pool[0],0,pool.length)}
    <div class="fc3-nav">
      <button class="btn btn-secondary btn-sm" id="fc-prev" disabled onclick="fcNav(-1)">← Prev</button>
      <span style="font-size:.82rem;color:var(--muted);min-width:3rem;text-align:center" id="fc-counter">1 / ${pool.length}</span>
      <button class="btn btn-secondary btn-sm" id="fc-next" onclick="fcNav(1)">Next →</button>
      <button class="btn btn-primary btn-sm" id="fc-flip" onclick="flipCard3d()">🔄 Flip</button>
    </div>
    <div class="fc3-dots" id="fc-dots">
      ${pool.map((_,i)=>`<div class="fc3-dot${i===0?' active':''}" onclick="fcJump(${i})" title="Card ${i+1}"></div>`).join('')}
    </div>
  </div>`;
}

function renderFlashcardItem(q,idx,total){
  if(!q) return '';
  const correctOpts=q.options.filter(o=>q.correct.some(c=>o.startsWith(c+'.')));
  const rationale=getRationale(q);
  const story=getFlashcardStory(q);
  return `<div class="flashcard-3d" id="flashcard" onclick="flipCard3d()">
    <div class="flashcard-3d-inner">
      <div class="fc3-face fc3-front">
        <div class="fc3-domain">${q.domain}</div>
        <div class="fc3-question">${q.stem}</div>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-bottom:.8rem">
          ${q.options.map(o=>`<div style="font-size:.72rem;color:var(--muted);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:.2rem .55rem">${o}</div>`).join('')}
        </div>
        <div class="fc3-hint">👆 Tap to reveal answer</div>
      </div>
      <div class="fc3-face fc3-back">
        <div class="fc3-answer-label">✅ Correct Answer</div>
        <div class="fc3-answer">${correctOpts.join(' · ')}</div>
        ${rationale?`<div class="fc3-rationale">${rationale}</div>`:''}
        ${story?`<div class="fc3-story"><div class="fc3-story-label">🎬 Remember it</div>${story}</div>`:''}
      </div>
    </div>
  </div>`;
}

function flipCard3d(){
  const el=document.getElementById('flashcard');
  if(!el) return;
  el.classList.toggle('flipped');
  // Flash pulse on the visible face
  const inner=el.querySelector('.flashcard-3d-inner');
  if(inner){
    inner.style.filter='brightness(1.25)';
    setTimeout(()=>{inner.style.filter='';},140);
  }
}

/* ─── Storyline memory hooks keyed by tag/keyword in the question ─── */
function getFlashcardStory(q){
  const text=(q.stem+' '+(q.tags||[]).join(' ')+' '+q.domain).toLowerCase();
  const stories=[
    // Security
    {keys:['cloudtrail'],s:'🕵️ The CEO asks "WHO deleted our S3 bucket last night?" — CloudTrail is the security camera. It records every API call with a timestamp and name. If the exam says "audit", "who did", "API history" → CloudTrail.'},
    {keys:['cloudwatch'],s:'📊 Your app is running but feels slow. CloudWatch is the fitness tracker strapped to it — it watches CPU, memory, error rates in real time and screams via Alarms when something looks wrong. "Metric / alarm / dashboard" → CloudWatch.'},
    {keys:['guardduty'],s:'🛡️ Imagine a silent threat detector scanning your logs 24/7 for hackers. GuardDuty uses machine learning to spot unusual login patterns, crypto mining, and account abuse — without you lifting a finger. "Threat detection / unusual activity" → GuardDuty.'},
    {keys:['aws config'],s:'📸 Config is a time-machine for your infrastructure settings. It snapshots every resource\'s config and lets you rewind: "What did my security group look like last Tuesday?" Exam says "compliance / config history" → Config (not CloudTrail!).'},
    {keys:['shield'],s:'🧱 Your website is under a DDoS flood — thousands of bots hammering it. AWS Shield absorbs the flood. Standard is free and automatic. Advanced adds 24/7 experts + SLA. "DDoS protection" → Shield.'},
    {keys:['waf'],s:'🔎 Think of WAF as a bouncer at the door checking IDs. It inspects HTTP requests and blocks SQL injection, XSS, bad bots. It works at the application layer (Layer 7). "Block specific web requests / SQL injection" → WAF.'},
    {keys:['iam','identity and access'],s:'🔑 IAM is the keymaster. Users get keys (credentials), Roles get temporary passes, Policies are the rulebook. The golden rule: least privilege — give only the access the job needs. "Who can do what" → IAM.'},
    {keys:['kms','key management'],s:'🔐 KMS is a vault of encryption keys. You never see the master key — AWS manages it inside hardware security modules. Every time you encrypt an S3 object or EBS volume, KMS is the locksmith. "Encryption keys / CMK" → KMS.'},
    {keys:['security group'],s:'🏠 Security Groups are bouncers at the apartment door (instance level). Stateful: if you let someone IN, their response automatically gets OUT — no extra rule needed. Allow rules only, no deny.'},
    {keys:['network acl','nacl'],s:'🏢 NACLs are security at the building entrance (subnet level). Stateless: you must explicitly allow BOTH the inbound request AND the outbound response. Can allow AND deny. Exam: "subnet firewall / stateless" → NACL.'},
    // Storage
    {keys:['s3','simple storage'],s:'🪣 S3 is a giant magic locker — store any file, any size, access it via URL anywhere on Earth. 11 nines of durability = if you stored 10M objects, you\'d lose one every 10,000 years. "Object storage / static website / backup" → S3.'},
    {keys:['ebs','elastic block'],s:'💽 EBS is a hard drive that lives in AWS but plugs into your EC2 — one drive, one instance, same Availability Zone. If your EC2 crashes, your data stays on the EBS. "Block storage / attached to EC2" → EBS.'},
    {keys:['efs','elastic file'],s:'📂 EFS is a shared network drive. 10 EC2 instances can all mount it at once and read/write the same files. It auto-scales as you add data. "Shared / NFS / multiple instances" → EFS.'},
    {keys:['glacier','s3 glacier'],s:'🧊 Glacier is a cold storage vault — cheap as chips but slow to retrieve. For compliance archives where you save files "just in case" and rarely touch them. "Archive / long-term / cheap storage" → Glacier.'},
    // Compute
    {keys:['ec2','elastic compute'],s:'🖥️ EC2 is renting a computer in the cloud. You pick the CPU, RAM, OS — it\'s your machine. You manage the OS, patches, apps. "Virtual machine / server in cloud / full control" → EC2.'},
    {keys:['lambda'],s:'⚡ Lambda: code without servers. Upload a function, it sleeps until triggered (by S3 upload, API call, timer), runs in milliseconds, then disappears. You pay only for the milliseconds it runs. "Serverless / event-driven / no server management" → Lambda.'},
    {keys:['elastic beanstalk'],s:'🌱 Elastic Beanstalk is the lazy developer\'s rocket ship. Upload your code (Node, Python, Java, etc.), and AWS automatically provisions EC2, load balancer, auto-scaling, monitoring. You still own the resources. "Deploy app without managing infra" → Beanstalk.'},
    {keys:['fargate'],s:'📦 Fargate = serverless containers. You write Docker images, Fargate runs them — no EC2 to manage, no cluster maintenance. It scales automatically. "Run containers without managing servers" → Fargate.'},
    {keys:['auto scaling'],s:'📈 Imagine a restaurant that magically hires more waiters on Friday night and sends them home on Tuesday morning. Auto Scaling adds EC2 instances when load spikes and removes them when quiet. You pay only for what you use.'},
    // Networking
    {keys:['vpc','virtual private cloud'],s:'🏙️ VPC is your private city inside AWS. You control the streets (subnets), traffic lights (NACLs), and door locks (Security Groups). Public subnets face the internet; private subnets are hidden.'},
    {keys:['cloudfront'],s:'🚀 CloudFront is a global delivery network — it caches your content on 400+ edge locations worldwide. Users in Tokyo get your content from Tokyo, not Virginia. "CDN / low latency / cache" → CloudFront.'},
    {keys:['route 53'],s:'📡 Route 53 is AWS\'s GPS for the internet. It translates "example.com" into an IP address (DNS). It can also route traffic based on health, latency, or geolocation. "DNS / domain / routing" → Route 53.'},
    {keys:['direct connect'],s:'🔌 Direct Connect is a dedicated physical fiber cable from your office to AWS — not the public internet. Consistent bandwidth, lower latency, more security. "Dedicated / private connection / hybrid" → Direct Connect.'},
    {keys:['transit gateway'],s:'🌐 Transit Gateway is a mega hub airport. Instead of connecting 50 VPCs to each other with 1,225 wires, you connect everything to one central hub. "Connect multiple VPCs / hub and spoke" → Transit Gateway.'},
    // Databases
    {keys:['rds','relational database'],s:'🗃️ RDS is a managed SQL database (MySQL, PostgreSQL, Oracle, etc.) — AWS handles backups, patches, and failover. You just run queries. "SQL / relational / managed database" → RDS.'},
    {keys:['dynamodb'],s:'⚡ DynamoDB is AWS\'s turbocharged NoSQL table. Millisecond response no matter how much data. No schema to design. "NoSQL / key-value / single-digit millisecond / serverless scale" → DynamoDB.'},
    {keys:['aurora'],s:'🌟 Aurora is AWS\'s premium MySQL/PostgreSQL — up to 5× faster than standard MySQL, 6 copies of your data across 3 AZs, auto-healing. "High performance / MySQL compatible / fully managed" → Aurora.'},
    {keys:['elasticache'],s:'🏎️ ElastiCache puts Redis or Memcached in front of your database — a blazing in-memory cache. Instead of hitting the DB for every read, the cache answers in microseconds. "Caching / in-memory / Redis / reduce DB load" → ElastiCache.'},
    // Messaging
    {keys:['sqs','simple queue'],s:'📬 SQS is a postal mailbox between services. Service A drops a message in, Service B picks it up when ready — they never talk directly. If B crashes, messages wait safely. "Decouple / queue / async" → SQS.'},
    {keys:['sns','simple notification'],s:'📢 SNS is a megaphone. One message goes IN, it fans out to everyone subscribed (email, SMS, Lambda, SQS). "Pub/sub / fan out / broadcast / notification" → SNS.'},
    // Pricing
    {keys:['reserved instance'],s:'🏷️ Reserved Instances = buying a gym membership upfront. Pay for 1 or 3 years, save up to 72%. Best for steady, predictable workloads (like your production database that runs 24/7).'},
    {keys:['savings plan'],s:'💰 Savings Plans = committing to spend $X per hour on compute. More flexible than Reserved Instances — it applies across EC2, Lambda, and Fargate regardless of instance type. Same savings, more freedom.'},
    {keys:['spot instance'],s:'⚡ Spot Instances are AWS\'s leftover capacity, sold at up to 90% discount — but AWS can reclaim them with 2 minutes notice. Perfect for jobs that can be interrupted: batch processing, rendering, ML training.'},
    {keys:['on-demand'],s:'☕ On-Demand is pay-as-you-go — like a coffee shop. No commitment, highest price. Best for unpredictable or short-term workloads where you need to start/stop any time.'},
    // Support
    {keys:['trusted advisor'],s:'🧙 Trusted Advisor is a wise robot that scans your AWS account and says "Hey, you have an S3 bucket with no encryption" or "You\'re 95% over your service limit." Free checks for cost, security, and fault tolerance.'},
    {keys:['well-architected'],s:'🏛️ The Well-Architected Framework is AWS\'s blueprint for great cloud buildings. Six pillars: Operational Excellence, Security, Reliability, Performance, Cost, Sustainability. The exam loves asking which pillar a scenario belongs to.'},
    // Migration
    {keys:['snowball'],s:'📦 Snowball is a literal physical hard drive AWS ships to you. You fill it with terabytes of data, ship it back, AWS uploads it. When internet upload would take months → Snowball.'},
    {keys:['database migration','dms'],s:'🔄 DMS (Database Migration Service) moves your database to AWS with minimal downtime. It continuously syncs changes so your old DB and new DB stay in sync until cutover day.'},
    // General cloud
    {keys:['high availability'],s:'🏗️ High Availability means your app keeps working even if one data center has a fire. Spread across multiple AZs (Availability Zones) so if one goes dark, another takes over seamlessly.'},
    {keys:['fault toleran'],s:'🔁 Fault Tolerance means zero impact when something fails — not just surviving, but not even noticing. Requires redundant components that take over instantly. More expensive than HA but no downtime at all.'},
    {keys:['elasticity'],s:'🎈 Elasticity is AWS\'s superpower: scale UP automatically when demand spikes (Black Friday), scale DOWN when quiet (Tuesday 3am). You pay only for what you need, right when you need it.'},
    {keys:['shared responsibility'],s:'🤝 Think of AWS as a landlord. AWS owns the building (physical hardware, hypervisor, global network). YOU own what\'s inside your apartment (OS, apps, data, IAM config). "Who is responsible for X?" — if it\'s the building → AWS; if it\'s the apartment → You.'},
  ];
  for(const entry of stories){
    if(entry.keys.some(k=>text.includes(k))) return entry.s;
  }
  // Generic domain-level fallback
  const domainStories={
    'Security':`🔐 Security mantra: Least Privilege + Defense in Depth. Give users only what they need, layer controls at every level (IAM → SG → NACL → encryption), and always assume breach.`,
    'Cloud Technology and Services':`☁️ AWS services follow a pattern: "managed" means AWS handles the undifferentiated heavy lifting (patches, backups, scaling) so you focus on your application logic.`,
    'Cloud Concepts':`🌍 Core cloud value props: Trade capital expense for operational expense, benefit from massive economies of scale, stop guessing capacity, increase speed & agility, go global in minutes.`,
    'Billing, Pricing and Support':`💳 AWS billing trick: spot when a question is about estimating future cost (Pricing Calculator) vs analyzing current spend (Cost Explorer) vs setting alerts (Budgets).`,
  };
  return domainStories[q.domain]||'';
}

function fcNav(dir){
  const c=document.getElementById('flashcard-container');
  if(!c) return;
  const pool=JSON.parse(c.dataset.pool);
  let idx=parseInt(c.dataset.idx)+dir;
  if(idx<0||idx>=pool.length) return;
  c.dataset.idx=idx;
  const q=getQ(pool[idx]);
  const fc=document.getElementById('flashcard');
  if(fc){
    fc.style.transition='opacity .18s ease,transform .18s cubic-bezier(.4,0,.2,1)';
    fc.style.opacity='0';
    fc.style.transform=`translateX(${dir>0?'30px':'-30px'})`;
    setTimeout(()=>{
      fc.outerHTML=renderFlashcardItem(q,idx,pool.length);
      const newFc=document.getElementById('flashcard');
      if(newFc){
        newFc.style.opacity='0';
        newFc.style.transform=`translateX(${dir>0?'-20px':'20px'})`;
        requestAnimationFrame(()=>{
          newFc.style.transition='opacity .28s ease,transform .28s cubic-bezier(.4,0,.2,1)';
          newFc.style.opacity='1';
          newFc.style.transform='translateX(0)';
        });
      }
      // Update nav controls after DOM is updated
      const counter=document.getElementById('fc-counter');
      const prev=document.getElementById('fc-prev');
      const next=document.getElementById('fc-next');
      if(counter) counter.textContent=`${idx+1} / ${pool.length}`;
      if(prev) prev.disabled=idx===0;
      if(next) next.disabled=idx===pool.length-1;
      document.querySelectorAll('.fc3-dot').forEach((d,i)=>{
        d.classList.toggle('active',i===idx);
        if(i<idx) d.classList.add('seen'); else d.classList.remove('seen');
      });
    },180);
  }
}

function attachQuizListeners(){
  const{questions,idx}=quizState,q=questions[idx],isMulti=q.type==='multi';
  const opts=document.querySelectorAll('.opt-btn'),submitBtn=document.getElementById('submit-multi');
  if(isMulti){
    opts.forEach(btn=>{btn.addEventListener('click',()=>{btn.classList.toggle('selected');const any=document.querySelectorAll('.opt-btn.selected').length>0;if(submitBtn){submitBtn.style.display='';submitBtn.disabled=!any;}});});
    if(submitBtn) submitBtn.addEventListener('click',()=>submitQuizAnswer(Array.from(document.querySelectorAll('.opt-btn.selected')).map(b=>b.dataset.opt)));
  } else {opts.forEach(btn=>{btn.addEventListener('click',()=>submitQuizAnswer([btn.dataset.opt]));});}
}
function submitQuizAnswer(chosen){
  const{questions,idx}=quizState,q=questions[idx];
  const isCorrect=arraysEqual(chosen.sort(),q.correct.slice().sort());
  recordAnswer(q.id,chosen,isCorrect);
  quizState.results.push({qid:q.id,correct:isCorrect,chosen});
  document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;const letter=b.dataset.opt;
    if(q.correct.includes(letter)) b.classList.add('reveal-correct');
    if(chosen.includes(letter)&&!q.correct.includes(letter)) b.classList.add('incorrect');
    if(chosen.includes(letter)&&q.correct.includes(letter)) b.classList.add('correct');
  });
  const submitBtn=document.getElementById('submit-multi');if(submitBtn) submitBtn.disabled=true;
  if(isCorrect){const card=document.getElementById('quiz-card');if(card){const r=card.getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top);showXPFloat(10,r.left+r.width/2-20,r.top-10);}}
  const area=document.getElementById('rationale-area');
  if(area){
    const rationale=getRationale(q),wrongRationale=getWrongRationale(q);
    const tip=getInterviewTip(q);

    // ── Keyword chips from q.tags ──────────────────────────────
    const tagChips=(q.tags||[]).map(t=>`<span class="exp-tag">${t}</span>`).join('');

    // ── Correct option(s) with service definition lookup ──────
    const correctOptItems=q.options.filter(o=>q.correct.some(c=>o.startsWith(c+'.'))).map(o=>{
      const text=o.replace(/^[A-E]\.\s*/,'');
      let svcDef=null;
      for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){svcDef=SVC[key];break;}}
      return `<div class="exp-correct-item">
        <span class="exp-correct-letter">${o.charAt(0)}</span>
        <div>
          <div class="exp-correct-text">${text}</div>
          ${svcDef?`<div class="exp-svc-def">📖 ${svcDef}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // ── Wrong options with service definition + why wrong ─────
    const wrongOptItems=q.options.filter(o=>!q.correct.some(c=>o.startsWith(c+'.'))).map(o=>{
      const letter=o.charAt(0);const text=o.replace(/^[A-E]\.\s*/,'');
      const exp=wrongRationale[letter]||'';
      let svcDef=null;
      for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){svcDef=SVC[key];break;}}
      return `<div class="exp-wrong-item">
        <span class="exp-wrong-letter">${letter}</span>
        <div>
          <div class="exp-wrong-text">${text}</div>
          ${svcDef?`<div class="exp-svc-def">📖 ${svcDef}</div>`:''}
          ${exp?`<div class="exp-why-wrong">✗ ${exp}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // ── Feynman challenge (after correct) ─────────────────────
    const feynmanPrompt=isCorrect?`<div class="exp-feynman">
      <span class="exp-feynman-label">🧠 Feynman Check</span>
      Close your eyes. Can you explain <em>why</em> this answer is correct in one plain sentence — as if teaching someone who has never heard of AWS?
    </div>`:'';

    // ── Mental model fix (after wrong) ────────────────────────
    const mentalModelFix=!isCorrect?(()=>{
      const correctText=q.options.find(o=>q.correct.some(c=>o.startsWith(c+'.'))).replace(/^[A-E]\.\s*/,'');
      const chosenText=q.options.find(o=>o.startsWith(chosen[0]+'.'))||'';
      return `<div class="exp-mental-fix">
        <span class="exp-feynman-label">🔁 Mental Model Fix</span>
        You chose <strong>${chosenText.replace(/^[A-E]\.\s*/,'')}</strong> — the correct answer is <strong>${correctText}</strong>. Re-read the rationale, then say the correct answer out loud before clicking Next.
      </div>`;
    })():'';

    area.innerHTML=`<div class="exp-box ${isCorrect?'exp-correct':'exp-wrong'} animate-in">

      <!-- ── STATUS HEADER ── -->
      <div class="exp-status-row">
        <span class="exp-status-badge ${isCorrect?'exp-badge-ok':'exp-badge-err'}">${isCorrect?'✅ Correct +10 XP':'❌ Incorrect +2 XP'}</span>
        ${tagChips?`<div class="exp-tags">${tagChips}</div>`:''}
      </div>

      <!-- ── CORRECT ANSWER SECTION ── -->
      <div class="exp-section">
        <div class="exp-section-label exp-label-ok">✓ Correct Answer${q.correct.length>1?'s':''}</div>
        ${correctOptItems}
      </div>

      <!-- ── WHY IT'S CORRECT ── -->
      <div class="exp-section">
        <div class="exp-section-label">💡 Why this is correct</div>
        <div class="exp-rationale-text">${rationale}</div>
      </div>

      ${feynmanPrompt}${mentalModelFix}

      <!-- ── OTHER OPTIONS ── -->
      ${wrongOptItems?`<div class="exp-section exp-section-collapsible" id="exp-wrong-toggle" onclick="this.classList.toggle('open')">
        <div class="exp-section-label exp-label-err" style="cursor:pointer">✗ Other Options — tap to expand ▾</div>
        <div class="exp-wrong-list">${wrongOptItems}</div>
      </div>`:''}

      ${tip?`<div class="exp-interview">
        <span class="exp-feynman-label">🎤 Say it in an interview</span>
        ${tip}
      </div>`:''}

    </div>`;
  }
  const nextWrap=document.getElementById('next-wrap');
  if(nextWrap){
    if(idx+1<questions.length){nextWrap.innerHTML=`<button class="btn btn-primary" id="btn-next">Next Question →</button>`;document.getElementById('btn-next').addEventListener('click',advanceQuiz);}
    else{nextWrap.innerHTML=`<button class="btn btn-primary" id="btn-finish">View Results →</button>`;document.getElementById('btn-finish').addEventListener('click',finishQuiz);}
  }
}
function getInterviewTip(q){
  const tags=(q.tags||[]).map(t=>t.toLowerCase()).join(' '),stem=q.stem.toLowerCase();
  if(stem.includes('cloudtrail')||tags.includes('cloudtrail')) return 'Interviewers love asking "how would you investigate who deleted that resource?" — answer: CloudTrail logs every API call.';
  if(stem.includes('shared responsibility')||tags.includes('shared responsibility')) return 'Key line: "AWS is responsible for the cloud; I am responsible for what I put IN the cloud."';
  if(stem.includes('iam role')||tags.includes('iam role')) return 'If asked about securing an EC2 app, always say you use an IAM Role — never hard-code access keys.';
  if(stem.includes('high availab')||tags.includes('high availability')) return '"How would you make this highly available?" — multiple AZs, Load Balancer, Auto Scaling, RDS Multi-AZ.';
  if(stem.includes('sqs')||stem.includes('sns')) return '"What is the difference between SQS and SNS?" SQS = one-to-one queue. SNS = one-to-many broadcast.';
  return null;
}

function startMockTimer(){
  if(mockState.timerInterval) clearInterval(mockState.timerInterval);
  updateTimerDisplay();
  mockState.timerInterval=setInterval(()=>{mockState.remainingSeconds--;updateTimerDisplay();if(mockState.remainingSeconds<=0){clearInterval(mockState.timerInterval);finishMockExam(true);}},1000);
}
function updateTimerDisplay(){
  const el=document.getElementById('mock-timer');if(!el) return;
  const s=mockState.remainingSeconds,m=Math.floor(s/60),sec=s%60;
  el.textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  if(s<=15*60) el.classList.add('warning'); else el.classList.remove('warning');
}
function attachMockListeners(){
  const{questions,idx,answers,flags}=mockState,q=questions[idx],isMulti=q.type==='multi';
  document.querySelectorAll('#mock-options .opt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const letter=btn.dataset.opt;let chosen=answers[idx]||[];
      if(isMulti) chosen=chosen.includes(letter)?chosen.filter(c=>c!==letter):[...chosen,letter]; else chosen=[letter];
      mockState.answers[idx]=chosen;
      document.querySelectorAll('#mock-options .opt-btn').forEach(b=>b.classList.toggle('selected',chosen.includes(b.dataset.opt)));
      const bar=document.querySelector('.progress-fill');if(bar) bar.style.width=`${Math.round(Object.keys(mockState.answers).length/questions.length*100)}%`;
    });
  });
  document.getElementById('btn-flag')?.addEventListener('click',()=>{mockState.flags[idx]=!mockState.flags[idx];renderMockExam();attachMockListeners();});
  document.getElementById('btn-prev')?.addEventListener('click',()=>{if(mockState.idx>0){mockState.idx--;renderMockExam();attachMockListeners();}});
  document.getElementById('btn-next-mock')?.addEventListener('click',()=>{if(mockState.idx<mockState.questions.length-1){mockState.idx++;renderMockExam();attachMockListeners();}});
  document.getElementById('btn-toggle-nav')?.addEventListener('click',()=>{
    const grid=document.getElementById('mock-nav-grid');if(!grid) return;
    if(grid.style.display==='none'){grid.style.display='block';grid.innerHTML=`<div class="q-grid">${questions.map((_,i)=>`<button class="q-dot ${i===idx?'current':flags[i]?'flagged':answers[i]?'answered':''}" onclick="jumpMockQ(${i})">${i+1}</button>`).join('')}</div>`;}
    else grid.style.display='none';
  });
  document.getElementById('btn-submit-mock')?.addEventListener('click',()=>{
    const u=mockState.questions.length-Object.keys(mockState.answers).length;
    if(u>0&&!confirm(`${u} question${u!==1?'s':''} unanswered. Submit anyway?`)) return;
    clearInterval(mockState.timerInterval);finishMockExam(false);
  });
}
function jumpMockQ(i){mockState.idx=i;renderMockExam();attachMockListeners();}
function finishMockExam(timedOut){
  if(mockState.timerInterval) clearInterval(mockState.timerInterval);
  const{questions,answers,totalSeconds,remainingSeconds}=mockState;
  const duration=totalSeconds-remainingSeconds;let correct=0;
  const domainResults={};DOMAINS.forEach(d=>domainResults[d]={correct:0,total:0});
  questions.forEach((q,i)=>{const chosen=answers[i]||[];const isCorrect=chosen.length>0&&arraysEqual(chosen.slice().sort(),q.correct.slice().sort());if(isCorrect) correct++;domainResults[q.domain].total++;if(isCorrect) domainResults[q.domain].correct++;recordAnswer(q.id,chosen,isCorrect);});
  const pct=Math.round(correct/questions.length*100);
  const result={mode:'mock',date:Date.now(),score:pct,correct,total:questions.length,duration,domainScores:{}};
  DOMAINS.forEach(d=>result.domainScores[d]=domainResults[d].total?Math.round(domainResults[d].correct/domainResults[d].total*100):0);
  history.push(result);saveAll();
  if(pct>=90) confettiBurst(window.innerWidth/2,200);
  renderMockReview(questions,answers,domainResults,pct,correct,duration,timedOut);
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function arraysEqual(a,b){if(a.length!==b.length) return false;for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;return true;}

function getTodayPlan(){

  return window.STUDY_PLAN.days.find(d=>d.date===today)||null;
}
function getCurrentPhase(){
  if(!window.STUDY_PLAN) return null;
  const today=new Date().toISOString().split('T')[0];
  return window.STUDY_PLAN.phases.find(p=>today>=p.startDate&&today<=p.endDate)||null;
}
function getDaysUntil(dateStr){
  return Math.max(0,Math.ceil((new Date(dateStr)-new Date())/(1000*60*60*24)));
}

//  WEEKLY FLASHCARDS — RENDER FUNCTIONS
// ═══════════════════════════════════════════════════════════════
let currentDeck=0;
let currentCard=0;
let cardFlipped=false;

function renderWeeklyFlashcards(){
  if(!window.FLASHCARD_DECKS||!window.FLASHCARD_DECKS.length){
    return `<div class="section-header"><h1>🃏 Week Flashcards</h1></div><div class="glass-card"><p class="muted">Flashcard decks not loaded. Make sure flashcards.js is in the folder.</p></div>`;
  }
  if(window._startDeck!==undefined){currentDeck=window._startDeck;window._startDeck=undefined;}
  currentCard=0;cardFlipped=false;
  const deck=window.FLASHCARD_DECKS[currentDeck];
  return `
  <div class="section-header">
    <h1>🃏 Week-by-Week Flashcards</h1>
    <span style="font-size:.8rem;color:var(--muted)">${window.FLASHCARD_DECKS.reduce((s,d)=>s+d.cards.length,0)} total cards across all weeks</span>
  </div>

  <!-- DECK SELECTOR -->
  <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem">
    ${window.FLASHCARD_DECKS.map((d,i)=>`
    <button class="wfc-tab${i===currentDeck?' active':''}" onclick="switchDeck(${i})" style="${i===currentDeck?`border-color:${d.color}60;color:${d.color};background:${d.color}18;box-shadow:0 0 14px ${d.color}25`:''}">
      <span class="wfc-tab-icon">${d.emoji}</span>W${d.week}
    </button>`).join('')}
  </div>

  <!-- CURRENT DECK INFO -->
  <div class="glass-card" style="border-color:${deck.color}30;margin-bottom:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div style="display:flex;align-items:center;gap:.6rem">
        <span style="font-size:1.5rem">${deck.emoji}</span>
        <div>
          <div style="font-weight:800;font-size:.95rem">${deck.title}</div>
          <div style="font-size:.72rem;color:var(--muted)">${deck.cards.length} cards</div>
        </div>
      </div>
      <div style="display:flex;gap:.4rem">
        <button class="btn btn-secondary btn-sm" onclick="shuffleDeck()">🔀 Shuffle</button>
        <button class="btn btn-primary btn-sm" onclick="startAutoFlash()">▶ Auto-Play</button>
      </div>
    </div>
    <div class="sc-progress-wrap" style="margin-top:.7rem;height:5px">
      <div id="wfc-progress-bar" class="sc-progress-fill" style="background:${deck.color};box-shadow:0 0 8px ${deck.color}50;width:${((currentCard+1)/deck.cards.length*100).toFixed(0)}%;height:5px;border-radius:999px;transition:width .4s"></div>
    </div>
    <div style="font-size:.68rem;color:var(--muted);margin-top:.3rem" id="wfc-card-label">Card ${currentCard+1} of ${deck.cards.length}</div>
  </div>

  <!-- FLASHCARD -->
  <div id="wfc-container">
    ${renderWeekCard(deck,currentCard)}
  </div>

  <!-- NAVIGATION -->
  <div style="display:flex;align-items:center;justify-content:center;gap:.75rem;margin-top:1rem;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" id="wfc-prev" onclick="wfcNav(-1)" ${currentCard===0?'disabled':''}>← Prev</button>
    <span id="wfc-nav-counter" style="font-size:.85rem;color:var(--muted);font-weight:600">${currentCard+1} / ${deck.cards.length}</span>
    <button class="btn btn-secondary btn-sm" id="wfc-next" onclick="wfcNav(1)" ${currentCard===deck.cards.length-1?'disabled':''}>Next →</button>
    <button class="btn btn-primary btn-sm" onclick="toggleWFC()">🔄 Flip</button>
  </div>

  <!-- ALL CARDS OVERVIEW -->
  <div style="margin-top:1.5rem">
    <div style="font-size:.8rem;font-weight:700;margin-bottom:.6rem;color:var(--muted)">All cards in this deck — click to jump</div>
    <div style="display:flex;flex-wrap:wrap;gap:.35rem">
      ${deck.cards.map((c,i)=>`
      <button onclick="jumpWFC(${i})" style="padding:.25rem .55rem;border-radius:8px;font-size:.65rem;font-weight:700;cursor:pointer;background:${i===currentCard?deck.color+'30':'rgba(255,255,255,0.04)'};border:1px solid ${i===currentCard?deck.color+'60':'rgba(255,255,255,0.08)'};color:${i===currentCard?deck.color:'var(--muted)'}">
        ${i+1}
      </button>`).join('')}
    </div>
  </div>`;
}

function renderWeekCard(deck,idx){
  const card=deck.cards[idx];
  const story=getWFCStory(card);
  return `
  <div class="flashcard-3d" id="wfc-card" onclick="toggleWFC()">
    <div class="flashcard-3d-inner" id="wfc-inner">
      <div class="fc3-face fc3-front" style="border-color:${deck.color}35">
        <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,${deck.color},transparent);border-radius:22px 22px 0 0"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;height:60px;background:radial-gradient(ellipse at 50% 100%,${deck.color}18,transparent);border-radius:0 0 22px 22px;pointer-events:none"></div>
        <div style="font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:${deck.color};margin-bottom:.75rem;padding:.2rem .7rem;border-radius:999px;background:${deck.color}15;border:1px solid ${deck.color}30">${deck.emoji} ${deck.title} · Card ${idx+1}</div>
        <div style="font-size:1.02rem;font-weight:700;line-height:1.65;color:var(--text);margin-bottom:.8rem;max-width:90%">${card.q}</div>
        <div class="fc3-hint">👆 Tap card to reveal answer</div>
      </div>
      <div class="fc3-face fc3-back" style="border-color:${deck.color}25;overflow-y:auto">
        <div style="position:absolute;bottom:0;left:0;right:0;height:60px;background:radial-gradient(ellipse at 50% 100%,${deck.color}12,transparent);border-radius:0 0 22px 22px;pointer-events:none"></div>
        <div class="fc3-answer-label" style="color:${deck.color}">✅ Answer</div>
        <div style="font-size:.92rem;font-weight:700;line-height:1.75;color:var(--text);margin-bottom:.75rem;max-width:92%;white-space:pre-line">${card.a}</div>
        ${card.tip?`<div style="padding:.55rem .85rem;background:rgba(255,153,0,0.08);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;font-size:.78rem;line-height:1.6;width:100%;text-align:left;flex-shrink:0">
          <span style="font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:800;display:block;margin-bottom:.2rem">⚡ Exam Tip</span>
          ${card.tip}
        </div>`:''}
        ${story?`<div class="fc3-story" style="flex-shrink:0"><div class="fc3-story-label">🎬 Remember it</div>${story}</div>`:''}
      </div>
    </div>
  </div>`;
}

function getWFCStory(card){
  if(!card) return '';
  const text=(card.q+' '+(card.a||'')).toLowerCase();
  // reuse same story engine
  const fakeQ={stem:card.q,tags:[],domain:''};
  return getFlashcardStory(fakeQ);
}

function toggleWFC(){
  cardFlipped=!cardFlipped;
  const inner=document.getElementById('wfc-inner');
  const card=document.getElementById('wfc-card');
  if(card){
    card.classList.toggle('flipped',cardFlipped);
    if(inner){
      inner.style.filter='brightness(1.2)';
      setTimeout(()=>{inner.style.filter='';},140);
    }
  }
}
function wfcNav(dir){
  const deck=window.FLASHCARD_DECKS[currentDeck];
  currentCard=Math.max(0,Math.min(deck.cards.length-1,currentCard+dir));
  cardFlipped=false;
  // Only swap the card — never re-render the whole page (that resets currentCard to 0)
  const container=document.getElementById('wfc-container');
  if(container) container.innerHTML=renderWeekCard(deck,currentCard);
  // Update prev/next buttons and counter
  const prev=document.getElementById('wfc-prev');
  const next=document.getElementById('wfc-next');
  const counter=document.querySelector('#wfc-nav-counter');
  if(prev) prev.disabled=currentCard===0;
  if(next) next.disabled=currentCard===deck.cards.length-1;
  if(counter) counter.textContent=`${currentCard+1} / ${deck.cards.length}`;
  // Update progress bar
  const bar=document.getElementById('wfc-progress-bar');
  if(bar) bar.style.width=`${((currentCard+1)/deck.cards.length*100).toFixed(0)}%`;
  const cardLabel=document.getElementById('wfc-card-label');
  if(cardLabel) cardLabel.textContent=`Card ${currentCard+1} of ${deck.cards.length}`;
}
function jumpWFC(idx){
  const deck=window.FLASHCARD_DECKS[currentDeck];
  currentCard=idx;cardFlipped=false;
  const container=document.getElementById('wfc-container');
  if(container) container.innerHTML=renderWeekCard(deck,currentCard);
  const prev=document.getElementById('wfc-prev');
  const next=document.getElementById('wfc-next');
  const counter=document.getElementById('wfc-nav-counter');
  const bar=document.getElementById('wfc-progress-bar');
  const cardLabel=document.getElementById('wfc-card-label');
  if(prev) prev.disabled=currentCard===0;
  if(next) next.disabled=currentCard===deck.cards.length-1;
  if(counter) counter.textContent=`${currentCard+1} / ${deck.cards.length}`;
  if(bar) bar.style.width=`${((currentCard+1)/deck.cards.length*100).toFixed(0)}%`;
  if(cardLabel) cardLabel.textContent=`Card ${currentCard+1} of ${deck.cards.length}`;
}
function switchDeck(idx){
  currentDeck=idx;currentCard=0;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function shuffleDeck(){
  const deck=window.FLASHCARD_DECKS[currentDeck];
  deck.cards=shuffle(deck.cards);
  currentCard=0;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
  toast('Deck shuffled! 🔀');
}
let _autoFlashInterval=null;
function startAutoFlash(){
  if(_autoFlashInterval){clearInterval(_autoFlashInterval);_autoFlashInterval=null;toast('Auto-play stopped');return;}
  toast('Auto-play: 4s per side ▶');
  _autoFlashInterval=setInterval(()=>{
    if(!cardFlipped){toggleWFC();}
    else{
      const deck=window.FLASHCARD_DECKS[currentDeck];
      if(currentCard<deck.cards.length-1){currentCard++;cardFlipped=false;document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();}
      else{clearInterval(_autoFlashInterval);_autoFlashInterval=null;toast('Deck complete! 🎉','ok');}
    }
  },4000);
}

navigate('home');

    'Shield': {domain:'Security and Compliance',color:'#EF4444',tagline:'DDoS protection — Standard free, Advanced $3k/mo',what:'Protects against DDoS attacks. Standard is automatic and free. Advanced adds 24/7 response team.',when:['DDoS protection for CloudFront/Route 53/ELB','Layer 3 and Layer 4 attacks'],notFor:['Layer 7 web attacks like SQL injection (use WAF)'],trick:'Shield = RIOT SHIELD. Blocks volumetric attacks. WAF blocks smart attacks.'},
    'WAF': {domain:'Security and Compliance',color:'#F59E0B',tagline:'Web Application Firewall — blocks Layer 7 attacks',what:'Inspects HTTP/HTTPS requests and blocks SQL injection, XSS, and other web exploits before they reach your application.',when:['Block SQL injection on your web app','Protect APIs from malicious requests'],notFor:['DDoS (volumetric) attacks — use Shield','Network-level filtering — use NACLs'],trick:'WAF = LANGUAGE FILTER. Reads content of requests. Shield just blocks traffic floods.'},
    'KMS': {domain:'Security and Compliance',color:'#8B5CF6',tagline:'Key management — encrypt/decrypt with managed keys',what:'Creates and manages encryption keys. Integrates with S3, EBS, RDS, Lambda to encrypt data at rest.',when:['Encrypt an S3 bucket or EBS volume','Rotate encryption keys automatically'],notFor:['Storing passwords/secrets (use Secrets Manager)','Dedicated physical HSM (use CloudHSM)'],trick:'KMS = BANK VAULT for encryption keys. Keys stay in vault — services borrow them.'},
    'Secrets Manager': {domain:'Security and Compliance',color:'#10C995',tagline:'Auto-rotating secret storage for passwords and API keys',what:'Stores database passwords and API keys. Automatically rotates secrets on a schedule using Lambda.',when:['Store RDS password and auto-rotate every 30 days','Share API keys without hardcoding in source code'],notFor:['Encryption keys (use KMS)','Certificates (use ACM)'],trick:'Secrets Manager = PASSWORD MANAGER that rotates your passwords automatically.'},
    'IAM Role': {domain:'Security and Compliance',color:'#3BA8FF',tagline:'Temporary credentials — no permanent keys stored',what:'A set of permissions assumed by services, users, or cross-account principals. Provides temporary credentials that expire automatically.',when:['EC2 instance needs to read from S3','Lambda needs to write to DynamoDB','Cross-account access'],notFor:['Never put access keys directly on EC2 — use a Role'],trick:'IAM Role = VISITOR BADGE. Grants temporary access. Never put access keys on EC2.'},
    'EC2': {domain:'Cloud Technology and Services',color:'#FF9900',tagline:'Virtual servers — IaaS, you manage the OS',what:'Resizable virtual machines. You choose OS, instance type, storage. You are responsible for patching the OS and applications.',when:['Run a web server you need full control over','Migrate an on-prem server','Custom OS configuration required'],notFor:['Serverless workloads (use Lambda)','Fully managed database (use RDS)'],trick:'EC2 = RENTED COMPUTER. You pick it, you patch it. AWS supplies the hardware.'},
    'Lambda': {domain:'Cloud Technology and Services',color:'#F59E0B',tagline:'Serverless compute — event-driven, max 15 minutes',what:'Runs code in response to events (API calls, S3 uploads, DynamoDB streams). No servers to manage. Pay per 100ms of execution.',when:['Process an S3 upload trigger','Build a serverless API backend','Run scheduled jobs'],notFor:['Long-running processes > 15 min (use EC2 or Fargate)'],trick:'Lambda = VENDING MACHINE. Put in an event, get output. No machine to maintain.'},
    'S3': {domain:'Cloud Technology and Services',color:'#22C55E',tagline:'Object storage — infinite, durable, HTTP-accessible',what:'Store any file as an object in a bucket. Virtually unlimited storage, 11 nines durability. Accessed via HTTPS API.',when:['Store images, videos, backups, logs','Host a static website','Data lake for analytics'],notFor:['Block storage for EC2 (use EBS)','Shared file system (use EFS)'],trick:'S3 = GIANT FILING CABINET in the sky. Perfect for files, terrible for databases.'},
    'RDS': {domain:'Cloud Technology and Services',color:'#3BA8FF',tagline:'Managed relational DB — AWS handles patching and failover',what:'Managed MySQL, PostgreSQL, MariaDB, SQL Server, Oracle. AWS handles OS patching, backups, Multi-AZ failover.',when:['Migrate an on-prem MySQL database','Need managed SQL with automated backups'],notFor:['NoSQL (use DynamoDB)','Analytics at petabyte scale (use Redshift)'],trick:'RDS = HIRING A DBA FROM AWS. They handle the boring stuff. You just query.'},
    'DynamoDB': {domain:'Cloud Technology and Services',color:'#F59E0B',tagline:'Serverless NoSQL — single-digit ms at any scale',what:'Fully managed key-value NoSQL database. Serverless, auto-scales, provides single-digit millisecond latency at any scale.',when:['Gaming leaderboards requiring ms response','Session storage','IoT device data at massive scale'],notFor:['Complex SQL joins (use RDS)','Analytics (use Redshift or Athena)'],trick:'DynamoDB = FORMULA 1 DATABASE. Absurdly fast, only key-value direction.'},
    'SQS': {domain:'Cloud Technology and Services',color:'#8B5CF6',tagline:'Message queue — one consumer, decouples services',what:'Managed message queue. Producer sends a message; one consumer receives and deletes it. Decouples components and buffers requests.',when:['Decouple a web app from an image-processing backend','Buffer requests during traffic spikes'],notFor:['Sending to multiple subscribers (use SNS)','Real-time streams (use Kinesis)'],trick:'SQS = MAILBOX. One postman drops, one person picks up. SNS = MEGAPHONE.'},
    'SNS': {domain:'Cloud Technology and Services',color:'#EC4899',tagline:'Pub/Sub — one message fans out to many subscribers',what:'One publisher sends a message to a topic; ALL subscribers receive it simultaneously. Supports email, SMS, Lambda, SQS.',when:['Send order confirmation email + SMS simultaneously','Fan out one event to multiple services'],notFor:['Single-consumer queuing (use SQS)'],trick:'SNS = SCHOOL PA SYSTEM. Principal speaks, everyone hears.'},
    'CloudFront': {domain:'Cloud Technology and Services',color:'#3BA8FF',tagline:'CDN — caches content at 400+ edge locations',what:'Content Delivery Network. Caches copies of your content at 400+ edge locations worldwide, serving users from the nearest location.',when:['Speed up a global website','Stream video with low buffer','Protect S3 origin from direct access'],notFor:['Routing (use Route 53)','Improving non-HTTP app performance (use Global Accelerator)'],trick:'CloudFront = TELEPORTER for your content. Copies appear near users instantly.'},
    'Route 53': {domain:'Cloud Technology and Services',color:'#10C995',tagline:'Managed DNS — routing policies, health checks',what:'Highly available DNS. Translates domain names to IPs. Supports routing policies: simple, weighted, latency-based, geolocation, failover.',when:['Register and manage a domain','Route traffic to nearest region','Failover to backup if primary fails'],notFor:['CDN caching (use CloudFront)'],trick:'Route 53 = GPS + PHONEBOOK. Knows your domain and finds the best path.'},
    'Reserved Instances': {domain:'Billing, Pricing and Support',color:'#22C55E',tagline:'1 or 3-year commitment — up to 72% off',what:'Commit to a specific instance type for 1 or 3 years. Up to 72% discount over On-Demand.',when:['Steady-state workloads running 24/7','Databases, application servers with predictable load'],notFor:['Variable workloads','Short-term projects'],trick:'Reserved = GYM MEMBERSHIP. Pay upfront for the year, save big.'},
    'Spot Instances': {domain:'Billing, Pricing and Support',color:'#EF4444',tagline:'Spare capacity — up to 90% off, can be interrupted',what:'Use AWS spare capacity at up to 90% discount. AWS can reclaim with 2-minute warning. Best for fault-tolerant batch workloads.',when:['Batch data processing','ML training jobs','CI/CD pipelines that can restart'],notFor:['Databases or apps that cannot tolerate interruption'],trick:'Spot = STANDBY FLIGHT. Massive discount, but you might get bumped.'},
    'Cost Explorer': {domain:'Billing, Pricing and Support',color:'#F59E0B',tagline:'Visualise past spend — charts, filters, forecast',what:'Shows historical spending patterns by service, account, region, or tag. Forecasts future costs based on trends.',when:['Understand why my bill is high this month','Find which service costs most'],notFor:['Estimating cost BEFORE deploying (use Pricing Calculator)','Alerting on thresholds (use Budgets)'],trick:'Cost Explorer = CREDIT CARD STATEMENT with graphs. Looks backwards.'},
  };

  const svc = SERVICES[svcName];
  const panel = document.getElementById('gym-svc-panel');
  if(!panel) return;

  // If already showing this service, collapse it
  if(panel.dataset.current===svcName && panel.style.display!=='none'){
    panel.style.display='none';panel.dataset.current='';return;
  }
  panel.dataset.current=svcName;

  const col = svc ? svc.color : '#087BFF';
  panel.innerHTML = svc ? `
  <div style="border-radius:16px;border:1px solid ${col}50;background:linear-gradient(145deg,${col}0d,rgba(5,10,25,0.98));padding:1.2rem 1.4rem;position:relative;overflow:hidden;box-shadow:0 0 40px ${col}18,0 8px 40px rgba(0,0,0,0.5)">
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,${col},${col}99,transparent)"></div>
    <!-- Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.85rem;flex-wrap:wrap;gap:.5rem">
      <div>
        <div style="font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;color:${col};font-weight:800;margin-bottom:.3rem">${svc.domain}</div>
        <div style="font-size:1.1rem;font-weight:900;color:var(--text)">${svcName}</div>
        <div style="font-size:.8rem;color:var(--muted);margin-top:.1rem">${svc.tagline}</div>
      </div>
      <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="startPractice('domain','${svc.domain}',15)" style="background:linear-gradient(135deg,${col}cc,${col}88);border:none;font-size:.7rem">⚡ Practice 15 Qs →</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('gym-svc-panel').style.display='none'" style="font-size:.68rem">✕ Close</button>
      </div>
    </div>
    <!-- 3-col grid -->
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.85rem;margin-bottom:.85rem">
      <!-- What it does -->
      <div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:.8rem;border:1px solid rgba(255,255,255,0.07)">
        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:${col};font-weight:800;margin-bottom:.4rem">📌 What it does</div>
        <div style="font-size:.78rem;color:var(--muted);line-height:1.65">${svc.what}</div>
      </div>
      <!-- When to use -->
      <div style="background:rgba(16,201,149,0.04);border-radius:12px;padding:.8rem;border:1px solid rgba(16,201,149,0.1)">
        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);font-weight:800;margin-bottom:.4rem">✅ Use it when</div>
        ${svc.when.map(w=>`<div style="font-size:.74rem;color:var(--muted);padding:.18rem 0;display:flex;gap:.4rem;line-height:1.5"><span style="color:var(--ok);flex-shrink:0">•</span>${w}</div>`).join('')}
      </div>
      <!-- NOT for / exam trap -->
      <div style="background:rgba(239,68,68,0.04);border-radius:12px;padding:.8rem;border:1px solid rgba(239,68,68,0.1)">
        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--red);font-weight:800;margin-bottom:.4rem">❌ NOT for</div>
        ${svc.notFor.map(n=>`<div style="font-size:.74rem;color:var(--muted);padding:.18rem 0;display:flex;gap:.4rem;line-height:1.5"><span style="color:var(--red);flex-shrink:0">•</span>${n}</div>`).join('')}
      </div>
    </div>
    <!-- Memory hook -->
    <div style="padding:.7rem 1rem;background:rgba(233,169,47,0.07);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;display:flex;align-items:flex-start;gap:.6rem">
      <span style="font-size:1.2rem;flex-shrink:0">🧠</span>
      <div>
        <div style="font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:800;margin-bottom:.2rem">Memory Hook</div>
        <div style="font-size:.82rem;color:var(--gold3);font-weight:600;line-height:1.6">${svc.trick}</div>
      </div>
    </div>
  </div>` : `<div style="padding:.8rem;color:var(--muted);font-size:.82rem">No detail available for "${svcName}"</div>`;

  panel.style.display='block';
  // Smooth scroll to panel
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}

// ═══════════════════════════════════════════════════════════════
//  PROFILE MODAL
// ═══════════════════════════════════════════════════════════════
const AVATARS=['🚀','🧑‍💻','👩‍💻','🧠','🌟','🔥','⚡','🎯','🏆','🛸','🧑‍🚀','👾','🤖','🦊','🐉'];
let _selectedAvatar=userAvatar||'🚀';

function openProfileModal(isOnboarding=false){
  _selectedAvatar=userAvatar||'🚀';
  const existing=document.getElementById('profile-modal-overlay');
  if(existing) existing.remove();
  const overlay=document.createElement('div');
  overlay.className='pmodal-overlay';
  overlay.id='profile-modal-overlay';
  overlay.innerHTML=`
  <div class="pmodal">
    <div class="pmodal-title">${isOnboarding?'👋 Welcome to AWS Study Hub':'✏️ Edit Profile'}</div>
    <div class="pmodal-sub">${isOnboarding
      ?'Your progress, XP, and streak are saved right here in your browser. Close the tab, come back — it\'s all waiting for you.'
      :'Changes save instantly to your browser.'}</div>

    <div class="pmodal-label">Your Name</div>
    <input class="pmodal-input" id="pmodal-name" type="text" placeholder="Enter your name…"
      value="${isOnboarding?'':displayName()}" maxlength="30" autocomplete="off"
      style="margin-bottom:1.4rem">

    <div class="pmodal-label" style="margin-bottom:.5rem">Pick your avatar</div>
    <div class="avatar-grid" id="avatar-grid">
      ${AVATARS.map(a=>`<div class="avatar-opt${a===_selectedAvatar?' selected':''}" onclick="selectAvatar('${a}',this)">${a}</div>`).join('')}
    </div>

    <div style="display:flex;gap:.7rem;justify-content:flex-end">
      ${!isOnboarding?`<button class="btn btn-secondary" onclick="document.getElementById('profile-modal-overlay').remove()">Cancel</button>`:''}
      <button class="btn btn-primary" onclick="saveProfile(${isOnboarding})" style="min-width:120px">
        ${isOnboarding?'🚀 Let\'s go!':'Save'}
      </button>
    </div>
  </div>`;

  // Close on backdrop click (only for edit, not onboarding)
  if(!isOnboarding){
    overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.remove();});
  }
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('pmodal-name').focus(),80);
}

function selectAvatar(emoji, el){
  _selectedAvatar=emoji;
  document.querySelectorAll('.avatar-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
}

function saveProfile(wasOnboarding=false){
  const nameInput=document.getElementById('pmodal-name');
  const name=(nameInput?.value||'').trim();
  if(!name){nameInput.style.borderColor='rgba(239,68,68,0.6)';nameInput.focus();return;}
  userName=name;
  userAvatar=_selectedAvatar;
  save('clf_username',userName);
  save('clf_avatar',userAvatar);
  document.getElementById('profile-modal-overlay')?.remove();
  updateTopbar();
  if(wasOnboarding){
    // Now boot into the correct page
    bootToPage();
    toast(`Welcome, ${userName}! 🎉`,'ok');
  } else {
    toast('Profile saved ✓','ok');
  }
}

function bootToPage(){
  const validTabs=['home','learn','practice','mock','progress','achievements','terminology','universe','games','settings','roadmap','recommendation','weekly-flashcards','flashcards','interview prep','diagnostic'];
  const tab=validTabs.includes(_bootHash)?_bootHash:'home';
  navigate(tab);
  updateTopbar();
}

applyTheme(appTheme);

// ── Boot: show onboarding if no name yet, otherwise go to last page ──
if(!userName){
  // Render a minimal shell so the app looks alive behind the modal
  navigate('home');
  updateTopbar();
  openProfileModal(true);
} else {
  bootToPage();
  updateTopbar();
}

// Safety net: save state whenever the tab is hidden or closed (critical on mobile)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') saveAll();});
window.addEventListener('beforeunload',()=>saveAll());
window.addEventListener('pagehide',()=>saveAll());
</script>
</body>
</html>
