﻿<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Cloud Practitioner Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="questions.js"></script>
<script src="external-questions.js"></script>
<script src="flashcards.js"></script>
<script src="studyplan.js"></script>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* backgrounds */
  --bg-deep:#050817;
  --bg-mid:#08152D;
  --bg-card:rgba(10,18,42,0.82);
  --bg-card-solid:#0D2550;
  --bg-sidebar:rgba(4,8,20,0.98);

  /* accents */
  --gold:#E9A92F;
  --gold2:#FFD77A;
  --gold3:#FFF0C0;
  --blue:#087BFF;
  --blue2:#00CFFF;
  --purple:#8055F5;
  --purple2:#B08AFF;
  --green:#10C995;
  --green2:#34EDB6;
  --red:#EF4444;
  --red2:#F87171;

  /* legacy aliases kept for JS compatibility */
  --bg:#050817;
  --bg2:#08152D;
  --bg3:#0D2550;
  --card:#0D2550;
  --card2:#0a1535;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.14);
  --accent:#E9A92F;--accent2:#FFD77A;--accent3:#FFF0C0;
  --ok:#10C995;--ok2:#34EDB6;
  --err:#EF4444;--err2:#F87171;
  --flag:#8055F5;--flag2:#B08AFF;
  --info:#087BFF;--info2:#00CFFF;
  --purple:#8055F5;--purple2:#B08AFF;
  --text:#F1F5FF;--muted:rgba(241,245,255,0.5);--muted2:rgba(241,245,255,0.28);
  --cc:#087BFF;--sec:#FFD77A;--tech:#10C995;--bill:#E9A92F;

  /* shape */
  --radius:12px;--radius-lg:18px;--radius-xl:24px;

  /* glow helpers */
  --glow-gold:0 0 32px rgba(233,169,47,0.4);
  --glow-blue:0 0 32px rgba(8,123,255,0.4);
  --glow-purple:0 0 32px rgba(128,85,245,0.4);
  --glow-green:0 0 32px rgba(16,201,149,0.4);

  /* sidebar */
  --sidebar-w:218px;
}

/* ── RESETS ─────────────────────────────── */
html{font-size:15px;scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse 80% 50% at 15% 20%,rgba(8,123,255,0.09) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 75%,rgba(233,169,47,0.07) 0%,transparent 55%),
    radial-gradient(ellipse 50% 60% at 50% 50%,rgba(128,85,245,0.04) 0%,transparent 70%),
    linear-gradient(170deg,#050817 0%,#08152D 45%,#0a1a3a 70%,#050c1e 100%);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;line-height:1.6;overflow-x:hidden;
}

/* ── THEME: MIDNIGHT GREEN ──────────────── */
body[data-theme="green"]{
  --bg-deep:#020e08;
  --bg-mid:#041209;
  --bg-card:rgba(4,18,10,0.85);
  --bg-card-solid:#061510;
  --bg-sidebar:rgba(2,10,6,0.97);
  --gold:#00ff88;
  --gold2:#00e07a;
  --gold3:#4dffa8;
  --blue:#22C55E;
  --blue2:#4ade80;
  --purple:#00d4aa;
  --purple2:#34d399;
  --border:rgba(0,255,136,0.08);
  --border2:rgba(0,255,136,0.18);
  --accent:#00ff88;--accent2:#00e07a;--accent3:#4dffa8;
  --glow-gold:0 0 24px rgba(0,255,136,0.35);
  background:linear-gradient(160deg,#020e08 0%,#041a0f 100%);
}

/* ── THEME: DEEP PURPLE ─────────────────── */
body[data-theme="purple"]{
  --bg-deep:#07020e;
  --bg-mid:#0d0520;
  --bg-card:rgba(15,8,30,0.85);
  --bg-card-solid:#100828;
  --bg-sidebar:rgba(5,2,14,0.97);
  --gold:#a855f7;
  --gold2:#c084fc;
  --gold3:#d8b4fe;
  --blue:#818cf8;
  --blue2:#a5b4fc;
  --purple:#ec4899;
  --purple2:#f472b6;
  --border:rgba(168,85,247,0.1);
  --border2:rgba(168,85,247,0.2);
  --accent:#a855f7;--accent2:#c084fc;--accent3:#d8b4fe;
  --glow-gold:0 0 24px rgba(168,85,247,0.4);
  background:linear-gradient(160deg,#07020e 0%,#120530 100%);
}
button{cursor:pointer;font:inherit;border:none;background:none}
input,select{font:inherit}

/* ── SPACE CANVAS ───────────────────────── */
#space-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* ── SIDEBAR ────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);
  min-height:100vh;
  background:
    linear-gradient(180deg,rgba(3,7,20,0.99) 0%,rgba(5,10,26,0.99) 60%,rgba(4,8,22,0.99) 100%);
  border-right:1px solid rgba(8,123,255,0.18);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;height:100vh;
  overflow-y:auto;overflow-x:hidden;
  z-index:50;
  backdrop-filter:blur(28px);
  transition:width .25s ease;
  box-shadow:4px 0 60px rgba(0,0,0,0.75),inset -1px 0 0 rgba(8,123,255,0.1),2px 0 0 rgba(8,123,255,0.06);
}
/* ambient blue glow that drifts up the sidebar edge */
.sidebar::before{
  content:'';position:absolute;top:0;right:0;width:1px;height:40%;
  background:linear-gradient(180deg,transparent,rgba(8,123,255,0.5),transparent);
  animation:sidebarBeam 4s ease-in-out infinite;pointer-events:none;z-index:1;
}
@keyframes sidebarBeam{
  0%,100%{top:0;opacity:.5}
  50%{top:60%;opacity:1}
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(8,123,255,0.3);border-radius:3px}

/* logo area */
.sidebar-logo{
  display:flex;align-items:center;gap:.7rem;
  padding:1.1rem .9rem .9rem;
  border-bottom:1px solid rgba(8,123,255,0.1);
  flex-shrink:0;
  position:relative;
}
.sidebar-logo::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(233,169,47,0.3),transparent);
}
.aws-logo-wrap{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,#E9A92F,#c47800);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(233,169,47,0.5),0 4px 12px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,220,100,0.3);
  flex-shrink:0;
}
.aws-logo-wrap svg{width:28px;height:18px}
.sidebar-brand{line-height:1.25}
.sidebar-brand-name{font-size:.8rem;font-weight:800;color:var(--text);display:block}
.sidebar-brand-sub{font-size:.58rem;color:var(--gold);font-weight:600;display:block;letter-spacing:.04em}

/* nav sections */
.sidebar-section-label{
  font-size:.56rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--muted2);padding:.7rem .9rem .2rem;font-weight:700;
}
.nav-btn{
  display:flex;align-items:center;gap:.65rem;
  padding:.54rem .9rem;border-radius:var(--radius);
  color:var(--muted);font-size:.78rem;font-weight:600;
  transition:all .22s cubic-bezier(.4,0,.2,1);width:100%;position:relative;
  margin:1px 0;overflow:hidden;
}
/* shimmer sweep on hover */
.nav-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);
  transition:left .4s ease;pointer-events:none;
}
.nav-btn:hover::before{left:160%}
/* active left-edge beacon */
.nav-btn::after{
  content:'';position:absolute;left:0;top:20%;height:60%;width:3px;
  border-radius:0 3px 3px 0;
  background:var(--gold);
  box-shadow:0 0 10px rgba(233,169,47,0.9),0 0 20px rgba(233,169,47,0.4);
  opacity:0;transform:scaleY(0);
  transition:opacity .22s,transform .22s cubic-bezier(.4,0,.2,1);
}
.nav-btn.active::after{opacity:1;transform:scaleY(1)}

.nav-btn .nav-icon{
  width:34px;height:34px;text-align:center;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  transition:all .22s cubic-bezier(.4,0,.2,1);
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.nav-btn .nav-icon img{
  width:19px;height:19px;object-fit:contain;
  opacity:.65;
  transition:opacity .22s,transform .22s,filter .22s;
  filter:saturate(0.7);
}
.nav-btn:hover{
  background:rgba(8,123,255,0.09);
  color:var(--text);
}
.nav-btn:hover .nav-icon{
  background:rgba(8,123,255,0.18);
  border-color:rgba(8,123,255,0.35);
  box-shadow:0 0 14px rgba(8,123,255,0.25),0 2px 8px rgba(0,0,0,0.3);
  transform:translateY(-1px);
}
.nav-btn:hover .nav-icon img{
  opacity:1;transform:scale(1.12);filter:saturate(1.2);
}
.nav-btn.active{
  background:linear-gradient(90deg,rgba(233,169,47,0.14),rgba(233,169,47,0.04) 70%,transparent);
  color:var(--gold2);
  padding-left:.9rem;
}
.nav-btn.active .nav-icon{
  background:linear-gradient(135deg,rgba(233,169,47,0.22),rgba(233,169,47,0.08));
  border-color:rgba(233,169,47,0.4);
  box-shadow:0 0 16px rgba(233,169,47,0.3),0 2px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,220,100,0.15);
}
.nav-btn.active .nav-icon img{
  opacity:1;
  filter:saturate(1.4) drop-shadow(0 0 5px rgba(233,169,47,0.7));
}
.nav-badge{
  font-size:.5rem;font-weight:800;padding:.1rem .35rem;
  border-radius:999px;background:var(--red);color:#fff;
  letter-spacing:.03em;margin-left:.2rem;
}
.nav-badge.new{background:linear-gradient(135deg,var(--purple),var(--blue))}

/* sidebar dream card */
.sidebar-dream-card{
  margin:.6rem .6rem .8rem;
  border-radius:var(--radius-lg);
  background:linear-gradient(160deg,rgba(255,153,0,0.18),rgba(139,92,246,0.15));
  border:1px solid rgba(255,153,0,0.2);
  padding:.85rem .75rem;
  text-align:center;
  flex-shrink:0;
  position:relative;overflow:hidden;
}
.sidebar-dream-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,153,0,0.4),transparent);
}
.sidebar-dream-img{
  width:70px;height:50px;object-fit:cover;border-radius:8px;
  margin:0 auto .5rem;display:block;
  box-shadow:0 0 16px rgba(255,153,0,0.3);
}
.sidebar-dream-text{font-size:.65rem;color:var(--gold2);font-weight:700;line-height:1.4}

/* sidebar xp area */
.sidebar-xp{padding:.5rem .6rem .8rem;flex-shrink:0}
.sidebar-profile{
  display:flex;align-items:center;gap:.55rem;
  padding:.55rem .65rem;border-radius:var(--radius);
  background:rgba(255,153,0,0.07);
  border:1px solid rgba(255,153,0,0.15);
  margin-bottom:.5rem;
}
.profile-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;flex-shrink:0;
  box-shadow:0 0 10px rgba(139,92,246,0.4);
  overflow:hidden;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}

/* ── MAIN WRAPPER ───────────────────────── */
.main-wrapper{
  margin-left:var(--sidebar-w);
  flex:1;display:flex;flex-direction:column;min-height:100vh;
}

/* ── TOPBAR ─────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:flex-end;
  padding:.6rem 1.5rem;
  background:rgba(5,8,23,0.85);
  backdrop-filter:blur(28px);
  border-bottom:1px solid rgba(8,123,255,0.1);
  position:sticky;top:0;z-index:40;gap:.75rem;
  box-shadow:0 2px 24px rgba(0,0,0,0.4);
}
.topbar-user{
  display:flex;align-items:center;gap:.6rem;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:.35rem .75rem .35rem .4rem;
}
.topbar-avatar{
  width:32px;height:32px;border-radius:50%;
  overflow:hidden;border:2px solid rgba(255,153,0,0.4);
  flex-shrink:0;
}
.topbar-avatar img{width:100%;height:100%;object-fit:cover}
.topbar-name{font-size:.8rem;font-weight:700;color:var(--text)}
.topbar-level{font-size:.65rem;color:var(--gold);font-weight:600}
.topbar-xp-bar{
  width:60px;height:4px;background:rgba(255,255,255,0.1);
  border-radius:999px;overflow:hidden;margin-top:2px;
}
.topbar-xp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 6px rgba(255,153,0,0.5)}
.topbar-bell{
  position:relative;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:background .18s;
}
.topbar-bell:hover{background:rgba(255,255,255,0.1)}
.topbar-bell-badge{
  position:absolute;top:4px;right:4px;width:8px;height:8px;
  border-radius:50%;background:var(--red);border:1.5px solid var(--bg-deep);
}

/* ── MAIN CONTENT ───────────────────────── */
.main-content{
  flex:1;padding:1.1rem 1.4rem 2rem;
  max-width:1300px;width:100%;
}

/* ── BOTTOM NAV (mobile) ────────────────── */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(5,8,22,0.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  z-index:100;padding:.2rem 0 env(safe-area-inset-bottom,.2rem);
}

/* ── RESPONSIVE ─────────────────────────── */
@media(max-width:860px){
  .sidebar{display:none}
  .main-wrapper{margin-left:0}
  .bottom-nav{display:flex}
  .main-content{padding:.75rem .85rem 5.5rem}
}
@media(max-width:600px){
  /* Hero: stack vertically, full width text */
  .hero-banner{min-height:auto;display:flex;flex-direction:column}
  .hero-astronaut-img{display:none}
  .hero-content{
    max-width:100%;
    padding:1.1rem 1rem .6rem;
    flex:1;
  }
  .hero-title{font-size:1.35rem}
  .hero-target{
    position:static;
    transform:none;
    flex-direction:row;
    justify-content:flex-start;
    align-items:center;
    padding:.5rem 1rem .9rem;
    gap:.75rem;
    z-index:3;
  }
  .hero-target-ring{width:72px;height:72px;flex-shrink:0}
  .hero-target-crown{font-size:1rem}
  .hero-target-pct{font-size:1.2rem}
  .hero-target-ribbon{font-size:.58rem}
  /* Stat cards: keep 2-col grid on mobile */
  .stat-cards-row{grid-template-columns:repeat(2,1fr)!important;gap:.6rem}
  .sc-big{font-size:1.9rem}
  /* Domain rings: slightly smaller on mobile */
  .domain-ring-svg-wrap{width:65px;height:65px}
  /* Bottom nav larger tap targets */
  .bottom-nav .nav-btn{padding:.5rem .2rem}
}
.bottom-nav .nav-btn{
  flex:1;flex-direction:column;justify-content:center;
  gap:2px;padding:.4rem .2rem;font-size:.6rem;border-radius:0;
  color:var(--muted);border-left:none;
}
.bottom-nav .nav-btn .nav-icon{font-size:1.2rem;width:auto}
.bottom-nav .nav-btn.active{color:var(--gold);background:transparent;border-left:none;padding-left:.2rem}

/* ═══════════════════════════════════════════
   HERO BANNER
═══════════════════════════════════════════ */
.hero-banner{
  position:relative;overflow:hidden;
  border-radius:var(--radius-xl);
  margin-bottom:1rem;
  min-height:220px;
  background:linear-gradient(130deg,
    #03091c 0%,
    #050f2e 30%,
    #07152e 60%,
    #040c20 100%);
  border:1px solid rgba(8,123,255,0.22);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.5),
    0 8px 60px rgba(0,0,0,0.65),
    0 0 80px rgba(8,123,255,0.1),
    0 0 150px rgba(233,169,47,0.06),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 60px rgba(8,123,255,0.03);
}
.hero-banner::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(8,123,255,0.5) 25%,
    rgba(0,207,255,0.8) 45%,
    rgba(233,169,47,0.8) 65%,
    rgba(255,215,122,0.5) 85%,
    transparent 100%);
  box-shadow:0 0 16px rgba(8,123,255,0.3);
  z-index:5;
}
.hero-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  opacity:0.22;
  mix-blend-mode:luminosity;
}
.hero-astronaut-img{
  position:absolute;right:18%;top:0;bottom:0;
  height:100%;width:auto;max-width:380px;
  object-fit:cover;object-position:top center;
  mask-image:linear-gradient(to right,transparent 0%,black 15%,black 85%,transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0%,black 15%,black 85%,transparent 100%);
  pointer-events:none;
  animation:heroFloat 5s ease-in-out infinite;
}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* hero content */
.hero-content{
  position:relative;z-index:3;
  padding:1.6rem 1.8rem;
  max-width:52%;
}
.hero-eyebrow{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--blue2);font-weight:800;margin-bottom:.35rem;
}
.hero-title{
  font-size:1.7rem;font-weight:900;line-height:1.15;
  letter-spacing:-.025em;margin-bottom:.3rem;color:#fff;
}
.hero-title .gold{
  background:linear-gradient(90deg,var(--gold),var(--gold3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;display:block;
}
.hero-sub{font-size:.78rem;color:rgba(255,255,255,0.65);margin-bottom:.9rem}
.hero-pills{display:flex;gap:.5rem;flex-wrap:wrap}
.hero-pill{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.28rem .75rem;border-radius:999px;font-size:.7rem;font-weight:700;
  background:rgba(255,255,255,0.08);color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
}
.hero-pill .pill-icon{font-size:.8rem}
.hero-pill.gold-pill{background:rgba(255,153,0,0.15);color:var(--gold2);border-color:rgba(255,153,0,0.3)}

/* target score ring (far right) */
.hero-target{
  position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;
  z-index:4;
}
.hero-target-ring{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,153,0,0.15) 0%,rgba(255,153,0,0.05) 50%,transparent 70%);
  border:3px solid rgba(255,153,0,0.6);
  box-shadow:0 0 30px rgba(255,153,0,0.4),0 0 60px rgba(255,153,0,0.15),inset 0 0 20px rgba(255,153,0,0.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:ringPulse 2.5s ease-in-out infinite;
}
@keyframes ringPulse{0%,100%{box-shadow:0 0 30px rgba(255,153,0,0.4),0 0 60px rgba(255,153,0,0.15)}50%{box-shadow:0 0 50px rgba(255,153,0,0.6),0 0 100px rgba(255,153,0,0.25)}}
.hero-target-crown{font-size:1.3rem;line-height:1;margin-bottom:.1rem}
.hero-target-pct{font-size:1.6rem;font-weight:900;color:var(--gold);line-height:1}
.hero-target-label{font-size:.6rem;color:rgba(255,255,255,0.7);font-weight:600}
.hero-target-ribbon{
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  color:#0a0a0a;font-size:.62rem;font-weight:900;
  padding:.22rem .7rem;border-radius:999px;
  box-shadow:0 0 12px rgba(255,153,0,0.5);
  letter-spacing:.03em;
}

/* ═══════════════════════════════════════════
   STAT CARDS ROW
═══════════════════════════════════════════ */
.stat-cards-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.85rem;margin-bottom:1rem;
}
@media(max-width:1050px){.stat-cards-row{grid-template-columns:repeat(2,1fr)}}
/* Keep 2-col grid on mobile — handled in the 600px block above */

.stat-card{
  background:var(--bg-card);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:1.1rem 1.2rem;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
  border:1px solid;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,currentColor,transparent);
  opacity:.25;
}
.stat-card:hover{transform:translateY(-5px)}
.stat-card.sc-streak{
  border-color:rgba(255,153,0,0.3);
  box-shadow:0 0 30px rgba(255,153,0,0.1),0 4px 24px rgba(0,0,0,0.5),inset 0 0 40px rgba(255,153,0,0.03);
  background:linear-gradient(150deg,rgba(10,18,42,0.98),rgba(5,10,28,0.99));
}
.stat-card.sc-streak:hover{box-shadow:0 10px 40px rgba(255,153,0,0.2),0 0 60px rgba(255,153,0,0.08)}
.stat-card.sc-xp{
  border-color:rgba(255,176,32,0.3);
  box-shadow:0 0 30px rgba(255,176,32,0.08),0 4px 24px rgba(0,0,0,0.5),inset 0 0 40px rgba(255,176,32,0.03);
  background:linear-gradient(150deg,rgba(10,18,42,0.98),rgba(5,10,28,0.99));
}
.stat-card.sc-xp:hover{box-shadow:0 10px 40px rgba(255,176,32,0.2),0 0 60px rgba(255,176,32,0.08)}
.stat-card.sc-readiness{
  border-color:rgba(34,197,94,0.3);
  box-shadow:0 0 30px rgba(34,197,94,0.1),0 4px 24px rgba(0,0,0,0.5),inset 0 0 40px rgba(34,197,94,0.03);
  background:linear-gradient(150deg,rgba(8,18,38,0.98),rgba(5,12,26,0.99));
}
.stat-card.sc-readiness:hover{box-shadow:0 10px 40px rgba(34,197,94,0.2),0 0 60px rgba(34,197,94,0.08)}
.stat-card.sc-practice{
  border-color:rgba(139,92,246,0.3);
  box-shadow:0 0 30px rgba(139,92,246,0.08),0 4px 24px rgba(0,0,0,0.5),inset 0 0 40px rgba(139,92,246,0.03);
  background:linear-gradient(150deg,rgba(10,8,30,0.98),rgba(6,5,20,0.99));
}
.stat-card.sc-practice:hover{box-shadow:0 10px 40px rgba(139,92,246,0.2),0 0 60px rgba(139,92,246,0.08)}

.sc-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.sc-icon-wrap{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  flex-shrink:0;
}
.sc-icon-wrap.gold-wrap{background:rgba(255,153,0,0.15);border:1px solid rgba(255,153,0,0.3)}
.sc-icon-wrap.amber-wrap{background:rgba(255,176,32,0.15);border:1px solid rgba(255,176,32,0.3)}
.sc-icon-wrap.green-wrap{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3)}
.sc-icon-wrap.purple-wrap{background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.3)}
.sc-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.sc-big{font-size:2.4rem;font-weight:900;line-height:1;letter-spacing:-.04em;margin-bottom:.15rem}
.sc-big.gold-text{color:var(--gold2)}
.sc-big.green-text{color:var(--green)}
.sc-big.purple-text{color:var(--purple2)}
.sc-sub{font-size:.72rem;color:var(--muted);font-weight:600}
.sc-sub.gold-sub{color:var(--gold)}
.sc-sub.green-sub{color:var(--green)}
.sc-fire{display:inline-block;animation:flamePulse 1.2s ease-in-out infinite}
.sc-progress-wrap{
  background:rgba(255,255,255,0.08);border-radius:999px;
  height:5px;overflow:hidden;margin-top:.6rem;
}
.sc-progress-fill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.sc-progress-fill.gold-fill{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px rgba(255,153,0,0.5)}
.sc-progress-fill.green-fill{background:linear-gradient(90deg,var(--green),var(--green2));box-shadow:0 0 8px rgba(34,197,94,0.5)}
.sc-progress-fill.purple-fill{background:linear-gradient(90deg,var(--purple),var(--purple2));box-shadow:0 0 8px rgba(139,92,246,0.5)}
.sc-mini-chart{display:flex;align-items:flex-end;gap:3px;height:30px;margin-top:.5rem}
.sc-bar{border-radius:3px 3px 0 0;min-width:6px;transition:height .5s ease}
.sc-readiness-wrap{display:flex;align-items:center;gap:.8rem}
.sc-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.sc-ring-wrap svg{transform:rotate(-90deg)}
.sc-ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.1rem;font-weight:900}
.sc-trend{font-size:.7rem;color:var(--green);font-weight:700;display:flex;align-items:center;gap:.2rem}

/* ═══════════════════════════════════════════
   DOMAINS + GALAXY ROW
═══════════════════════════════════════════ */
.mid-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.85rem;margin-bottom:1rem;
}
@media(max-width:800px){.mid-row{grid-template-columns:1fr}}

.glass-card{
  background:linear-gradient(150deg,rgba(8,18,46,0.96),rgba(5,12,30,0.98));
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:1.1rem 1.25rem;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.07);
  transition:transform .22s cubic-bezier(.4,0,.2,1),box-shadow .22s;
  box-shadow:0 4px 36px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
}
.glass-card:hover{transform:translateY(-3px);box-shadow:0 14px 50px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.07)}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
}
.glass-card.gold-card{
  border-color:rgba(233,169,47,0.2);
  box-shadow:0 4px 36px rgba(0,0,0,0.5),0 0 40px rgba(233,169,47,0.07),inset 0 1px 0 rgba(255,220,100,0.08);
}
.glass-card.gold-card:hover{box-shadow:0 14px 50px rgba(0,0,0,0.6),0 0 60px rgba(233,169,47,0.1)}
.glass-card.blue-card{
  border-color:rgba(8,123,255,0.2);
  box-shadow:0 4px 36px rgba(0,0,0,0.5),0 0 40px rgba(8,123,255,0.07),inset 0 1px 0 rgba(80,180,255,0.07);
}
.glass-card.blue-card:hover{box-shadow:0 14px 50px rgba(0,0,0,0.6),0 0 60px rgba(8,123,255,0.12)}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1rem;
}
.card-header-left{display:flex;align-items:center;gap:.5rem}
.card-header-icon{font-size:1.1rem}
.card-header-title{font-size:.9rem;font-weight:800;color:var(--text)}
.card-header-sub{font-size:.65rem;color:var(--muted);margin-top:1px}
.card-header-link{
  font-size:.7rem;color:var(--gold);font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:.25rem;
  padding:.3rem .6rem;border-radius:999px;
  border:1px solid rgba(255,153,0,0.25);
  background:rgba(255,153,0,0.08);
  transition:all .18s;white-space:nowrap;
}
.card-header-link:hover{background:rgba(255,153,0,0.15);box-shadow:0 0 12px rgba(255,153,0,0.2)}

/* domain rings */
.domain-rings-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;
}
@media(max-width:500px){.domain-rings-grid{grid-template-columns:repeat(2,1fr)}}
.domain-ring-item{
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;padding:.5rem .3rem .4rem;
  border-radius:var(--radius-lg);transition:background .18s;
}
.domain-ring-item:hover{background:rgba(255,255,255,0.04)}
.domain-ring-svg-wrap{position:relative;width:80px;height:80px;margin:0 auto .5rem}
.domain-ring-svg-wrap svg{transform:rotate(-90deg)}
.domain-ring-inner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.domain-ring-emoji{font-size:.95rem;line-height:1}
.domain-ring-pct{font-size:.85rem;font-weight:900;line-height:1}
.domain-ring-label{font-size:.58rem;color:var(--muted);font-weight:600;text-align:center;line-height:1.3}
.domain-ring-weight{font-size:.56rem;color:var(--muted2);text-align:center;margin-top:1px}

/* galaxy */
.galaxy-wrap{
  position:relative;
  height:260px;
  overflow:hidden;
  border-radius:14px;
}
@media(max-width:600px){.galaxy-wrap{height:220px}}

.galaxy-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;border-radius:12px;opacity:.18;
}

/* Orbital rings */
.gx-ring{
  position:absolute;top:50%;left:50%;
  border-radius:50%;
  border:1px solid rgba(59,168,255,0.18);
  pointer-events:none;
  transform:translate(-50%,-50%);
  animation:gxRingSpin linear infinite;
}
.gx-ring.r1{width:140px;height:52px;animation-duration:18s;border-color:rgba(59,168,255,0.22)}
.gx-ring.r2{width:240px;height:88px;animation-duration:28s;animation-direction:reverse;border-color:rgba(255,153,0,0.18)}
.gx-ring.r3{width:320px;height:118px;animation-duration:40s;border-color:rgba(139,92,246,0.14)}
@keyframes gxRingSpin{from{transform:translate(-50%,-50%) rotateX(72deg) rotate(0deg)}to{transform:translate(-50%,-50%) rotateX(72deg) rotate(360deg)}}

/* Centre globe */
.gx-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#1a3a6a 0%,#071228 55%,#030a18 100%);
  border:2px solid rgba(255,153,0,0.55);
  box-shadow:
    0 0 0 6px rgba(255,153,0,0.07),
    0 0 30px rgba(255,153,0,0.4),
    0 0 70px rgba(59,168,255,0.15),
    inset 0 0 20px rgba(255,153,0,0.08);
  cursor:pointer;
  animation:gxGlobePulse 3s ease-in-out infinite;
  transition:transform .2s;
}
.gx-center:hover{transform:translate(-50%,-50%) scale(1.1)}
@keyframes gxGlobePulse{
  0%,100%{box-shadow:0 0 0 6px rgba(255,153,0,0.07),0 0 30px rgba(255,153,0,0.4),0 0 70px rgba(59,168,255,0.15),inset 0 0 20px rgba(255,153,0,0.08)}
  50%{box-shadow:0 0 0 10px rgba(255,153,0,0.05),0 0 50px rgba(255,153,0,0.6),0 0 100px rgba(59,168,255,0.2),inset 0 0 30px rgba(255,153,0,0.12)}
}
.gx-center-logo{
  font-size:.9rem;font-weight:900;color:#fff;letter-spacing:.04em;line-height:1;
}
.gx-center-arc{
  display:block;width:36px;height:4px;
  border-bottom:3px solid #FF9900;
  border-radius:0 0 50% 50%;
  margin-top:1px;
  box-shadow:0 2px 8px rgba(255,153,0,0.6);
}
.gx-center-label{font-size:.42rem;color:rgba(255,255,255,0.5);letter-spacing:.08em;margin-top:2px;text-transform:uppercase}

/* Orbital nodes */
.gx-node{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;z-index:8;
  transition:transform .2s;
}
.gx-node:hover{transform:translate(-50%,-50%) scale(1.18)}
.gx-node-icon-wrap{
  position:relative;
  width:46px;height:46px;
}
@media(max-width:600px){.gx-node-icon-wrap{width:38px;height:38px}}
.gx-node-bg{
  width:100%;height:100%;border-radius:14px;
  background:rgba(5,12,30,0.88);
  backdrop-filter:blur(8px);
  border:1.5px solid;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  transition:all .2s;
  position:relative;overflow:hidden;
}
.gx-node-bg::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
}
.gx-node:hover .gx-node-bg{filter:brightness(1.3)}

/* Progress arc around node */
.gx-node-ring{
  position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;
  border-radius:17px;
  pointer-events:none;
}

.gx-node-label{
  font-size:.6rem;font-weight:800;
  color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,1),0 0 12px rgba(0,0,0,0.9);
  white-space:nowrap;
  background:rgba(0,0,0,0.6);
  padding:.08rem .35rem;
  border-radius:4px;
  backdrop-filter:blur(4px);
}
.gx-node-pct{
  font-size:.52rem;font-weight:800;
  opacity:.85;
  margin-top:-2px;
}

/* Connection lines SVG */
.gx-lines{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:2;
}

/* Floating particles */
.gx-particle{
  position:absolute;border-radius:50%;pointer-events:none;z-index:1;
  animation:gxParticleFloat linear infinite;
  opacity:0;
}
@keyframes gxParticleFloat{
  0%{opacity:0;transform:translateY(0) scale(0)}
  15%{opacity:1}
  85%{opacity:.6}
  100%{opacity:0;transform:translateY(-40px) scale(1.5)}
}

/* Node entry animation */
@keyframes gxNodeIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.gx-node{animation:gxNodeIn .5s cubic-bezier(.34,1.56,.64,1) both}

/* ═══════════════════════════════════════════
   BOTTOM ROW (3 cards)
═══════════════════════════════════════════ */
.bottom-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:.85rem;margin-bottom:1rem;
}
@media(max-width:900px){.bottom-row{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.bottom-row{grid-template-columns:1fr}}
@media(max-width:1100px) and (min-width:600px){.bottom-row{grid-template-columns:1fr 1fr}}

/* mission card */
.mission-card{
  background:var(--bg-card);backdrop-filter:blur(16px);
  border-radius:20px;padding:1.1rem 1.2rem;
  border:1px solid rgba(255,153,0,0.2);
  box-shadow:0 0 24px rgba(255,153,0,0.08);
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.mission-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(255,153,0,0.18)}
.mission-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,153,0,0.3),transparent)}
.mission-img{
  width:80px;height:60px;object-fit:cover;border-radius:10px;
  float:right;margin:0 0 .5rem .75rem;
  box-shadow:0 0 16px rgba(255,153,0,0.3);
}
.mission-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:800;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.mission-title{font-size:.88rem;font-weight:800;color:var(--text);margin-bottom:.3rem;line-height:1.3}
.mission-desc{font-size:.75rem;color:var(--muted);line-height:1.5;margin-bottom:.6rem}
.mission-time{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:.68rem;color:var(--muted);font-weight:600;
  background:rgba(255,255,255,0.06);border-radius:999px;
  padding:.2rem .55rem;border:1px solid rgba(255,255,255,0.08);
  margin-bottom:.75rem;
}

/* achievements card */
.achievements-card{
  background:var(--bg-card);backdrop-filter:blur(16px);
  border-radius:20px;padding:1.1rem 1.2rem;
  border:1px solid rgba(255,153,0,0.15);
  box-shadow:0 0 24px rgba(255,153,0,0.06);
  position:relative;overflow:hidden;
  transition:transform .2s;
}
.achievements-card:hover{transform:translateY(-3px)}
.achievements-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,153,0,0.2),transparent)}
.ach-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}
.ach-badge{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:68px;cursor:pointer;transition:transform .2s}
.ach-badge:hover{transform:translateY(-3px)}
.ach-icon{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  position:relative;
}
.ach-icon::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid;opacity:.4}
.ach-icon.gold{background:radial-gradient(circle,rgba(255,153,0,0.3),rgba(180,80,0,0.1));border:2px solid rgba(255,153,0,0.5);box-shadow:0 0 20px rgba(255,153,0,0.3)}
.ach-icon.gold::after{border-color:rgba(255,153,0,0.3)}
.ach-icon.purple{background:radial-gradient(circle,rgba(139,92,246,0.35),rgba(100,30,200,0.1));border:2px solid rgba(139,92,246,0.5);box-shadow:0 0 20px rgba(139,92,246,0.3)}
.ach-icon.purple::after{border-color:rgba(139,92,246,0.3)}
.ach-icon.blue{background:radial-gradient(circle,rgba(59,168,255,0.3),rgba(30,100,200,0.1));border:2px solid rgba(59,168,255,0.5);box-shadow:0 0 20px rgba(59,168,255,0.3)}
.ach-icon.blue::after{border-color:rgba(59,168,255,0.3)}
.ach-icon.green{background:radial-gradient(circle,rgba(34,197,94,0.3),rgba(20,120,60,0.1));border:2px solid rgba(34,197,94,0.5);box-shadow:0 0 20px rgba(34,197,94,0.3)}
.ach-icon.green::after{border-color:rgba(34,197,94,0.3)}
.ach-icon.locked{filter:grayscale(1);opacity:.3;background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.1)}
.ach-icon.locked::after{border-color:transparent}
.ach-label{font-size:.58rem;color:var(--muted);text-align:center;font-weight:600;line-height:1.2}

/* next challenge card */
.challenge-card{
  background:linear-gradient(135deg,#2d1b69 0%,#1e1b4b 50%,#0f0a2a 100%);
  backdrop-filter:blur(16px);border-radius:20px;padding:1.1rem 1.2rem;
  border:1px solid rgba(139,92,246,0.3);
  box-shadow:0 0 24px rgba(139,92,246,0.15);
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.challenge-card:hover{transform:translateY(-3px);box-shadow:0 8px 40px rgba(139,92,246,0.3)}
.challenge-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,0.4),transparent)}
.challenge-trophy-img{
  position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:100px;height:100px;object-fit:contain;
  opacity:.85;filter:drop-shadow(0 0 20px rgba(255,153,0,0.4));
  animation:trophyGlow 2.5s ease-in-out infinite;
}
@keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 15px rgba(255,153,0,0.3))}50%{filter:drop-shadow(0 0 30px rgba(255,153,0,0.6))}}
.challenge-content{position:relative;z-index:2;max-width:65%}
.challenge-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--purple2);font-weight:800;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.challenge-title{font-size:.9rem;font-weight:800;color:var(--text);margin-bottom:.25rem}
.challenge-sub{font-size:.74rem;color:rgba(255,255,255,0.6);margin-bottom:.7rem;line-height:1.45}

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.55rem 1.2rem;border-radius:var(--radius);
  font-weight:700;font-size:.82rem;cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;border:none;
}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);transition:left .4s ease;pointer-events:none}
.btn:hover::before{left:150%}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,transparent 50%);pointer-events:none}
.btn-primary{
  background:linear-gradient(135deg,#E9A92F,#c47800,#E9A92F);
  background-size:200% 100%;
  color:#050817;

═══════════════════════════════════════════ */
.practice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}

.domain-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.15rem;position:relative;overflow:hidden;transition:all .2s cubic-bezier(.4,0,.2,1)}

.domain-card-name{font-weight:800;font-size:.88rem;line-height:1.3}
.domain-pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.62rem;font-weight:800;letter-spacing:.04em;margin-top:.2rem}
.domain-card-pct{font-size:1.4rem;font-weight:900;line-height:1}
.domain-card-attempted{font-size:.72rem;color:var(--muted);margin-bottom:.6rem}
.domain-progress{background:rgba(255,255,255,0.07);border-radius:999px;height:5px;overflow:hidden;margin-bottom:.75rem}

.domain-card-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;position:relative;overflow:hidden}

.card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:all .2s}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;position:relative;overflow:hidden}
.card-sm::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent)}
.card-accent{border-color:rgba(255,153,0,0.25);background:rgba(255,153,0,0.04)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.85rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}

.stat-num{font-size:2rem;font-weight:900;line-height:1;letter-spacing:-.03em}

.badge{display:inline-block;padding:.15rem .58rem;border-radius:999px;font-size:.66rem;font-weight:800;letter-spacing:.04em}
.badge-cc{background:rgba(59,168,255,0.12);color:var(--cc);border:1px solid rgba(59,168,255,0.2)}
.badge-sec{background:rgba(255,153,0,0.12);color:var(--sec);border:1px solid rgba(255,153,0,0.2)}
.badge-tech{background:rgba(34,197,94,0.12);color:var(--tech);border:1px solid rgba(34,197,94,0.2)}
.badge-bill{background:rgba(255,153,0,0.12);color:var(--bill);border:1px solid rgba(255,153,0,0.2)}
.badge-unverified{background:rgba(167,139,250,0.08);color:var(--flag);font-size:.6rem;border:1px solid rgba(167,139,250,0.18)}
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.4rem}

.options-list{display:flex;flex-direction:column;gap:.55rem}

.opt-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent)}
.opt-btn:hover:not(:disabled){border-color:rgba(255,153,0,0.4);background:rgba(255,153,0,0.06);transform:translateX(4px);box-shadow:-3px 0 0 rgba(255,153,0,0.3)}
.opt-btn.selected{border-color:var(--gold);background:rgba(255,153,0,0.08);color:var(--gold2)}
.opt-btn.correct{border-color:var(--ok)!important;background:rgba(34,197,94,0.1)!important;color:var(--ok2)!important;box-shadow:0 0 16px rgba(34,197,94,0.15)!important}
.opt-btn.incorrect{border-color:var(--red)!important;background:rgba(239,68,68,0.1)!important;color:var(--red2)!important;animation:shake .4s ease}

.wrong-opts{margin-top:.7rem;display:flex;flex-direction:column;gap:.35rem}

.rec-day-title{font-size:.9rem;font-weight:800;color:var(--text);padding:0 1rem .2rem}
.rec-day-why{font-size:.76rem;color:var(--muted);padding:0 1rem .6rem;line-height:1.5}

.rec-blocks{padding:.5rem 1rem;display:flex;flex-direction:column;gap:.3rem;border-top:1px solid rgba(255,255,255,0.05)}
.rec-block{display:flex;align-items:flex-start;gap:.6rem;padding:.3rem 0}
.rec-block-break{opacity:.55}
.rec-block-min{
  font-size:.62rem;font-weight:900;color:var(--gold);
  background:rgba(233,169,47,0.1);border:1px solid rgba(233,169,47,0.2);
  padding:.12rem .4rem;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:1px;
}
.rec-block-min-break{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--muted)}
.rec-block-task{font-size:.8rem;color:var(--muted);line-height:1.6}

.rec-keywords{
  display:flex;flex-wrap:wrap;gap:.3rem;
  padding:.5rem 1rem .6rem;border-top:1px solid rgba(255,255,255,0.05);
}
.rec-kw{
  font-size:.62rem;font-weight:700;padding:.13rem .42rem;
  border-radius:5px;background:rgba(8,123,255,0.1);
  color:#7bbfff;border:1px solid rgba(8,123,255,0.18);
}
.rec-day-goal{
  margin:.4rem 1rem .8rem;padding:.5rem .75rem;
  background:rgba(16,201,149,0.07);border:1px solid rgba(16,201,149,0.15);
  border-radius:var(--radius);font-size:.78rem;color:var(--ok2);line-height:1.5;
}
.progress-wrap{background:rgba(255,255,255,0.06);border-radius:999px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px rgba(255,153,0,0.35)}
.progress-fill.ok{background:linear-gradient(90deg,var(--ok),var(--ok2));box-shadow:0 0 8px rgba(34,197,94,0.3)}
.progress-fill.err{background:linear-gradient(90deg,var(--red),var(--red2))}
.timer{font-size:1.2rem;font-weight:900;font-variant-numeric:tabular-nums;padding:.35rem .8rem;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);letter-spacing:.05em}
.timer.warning{color:var(--red);border-color:rgba(239,68,68,0.4);animation:pulse 1s infinite;box-shadow:0 0 16px rgba(239,68,68,0.15)}
.service-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.service-card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 40px rgba(0,0,0,0.5);border-color:var(--border2)}
.service-card:hover .service-story{max-height:200px;opacity:1}
.service-story{max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease}
.service-card.expanded .service-story{max-height:200px;opacity:1}
.service-emoji{font-size:1.8rem;display:block;margin-bottom:.4rem;transition:transform .2s}
.service-name{font-weight:800;font-size:.84rem;margin-bottom:.2rem}
.service-hook{font-size:.7rem;color:var(--muted);line-height:1.4}
.q-grid{display:flex;flex-wrap:wrap;gap:3px;max-height:120px;overflow-y:auto}
.q-dot{width:28px;height:28px;border-radius:7px;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted);border:1.5px solid var(--border);cursor:pointer;transition:all .12s}
.q-dot.answered{background:rgba(59,168,255,0.08);border-color:var(--info);color:var(--info)}
.q-dot.flagged{background:rgba(139,92,246,0.08);border-color:var(--flag);color:var(--flag)}
.q-dot.current{border-color:var(--gold);color:var(--gold);background:rgba(255,153,0,0.1);box-shadow:0 0 8px rgba(255,153,0,0.25)}
.q-dot:hover{transform:scale(1.12)}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;margin-bottom:.65rem;transition:transform .15s}
.review-item:hover{transform:translateX(3px)}
.review-item.rv-correct{border-left:3px solid var(--ok)}
.review-item.rv-wrong{border-left:3px solid var(--red)}
.review-item.rv-skipped{border-left:3px solid var(--muted2)}
.flashcard{perspective:1000px;cursor:pointer;user-select:none}
.flashcard-inner{position:relative;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;min-height:180px}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-lg);padding:1.4rem;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;min-height:180px}
.flashcard-front{background:linear-gradient(135deg,rgba(59,168,255,0.06),rgba(255,255,255,0.02));border-color:rgba(59,168,255,0.14)}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(255,255,255,0.02));border-color:rgba(34,197,94,0.22)}
.confusion-pair{background:var(--card);border-radius:var(--radius);padding:.7rem 1rem;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;transition:border-color .15s}
.confusion-pair:hover{border-color:var(--border2)}
.confusion-services{font-weight:700;font-size:.85rem}
.confusion-count{font-size:.7rem;color:var(--muted)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.compare-col{background:var(--card);border-radius:var(--radius);padding:.9rem;border:1px solid var(--border)}
.compare-col h3{font-size:.85rem;margin-bottom:.45rem}
.compare-col ul{padding-left:1.1rem;font-size:.82rem;color:var(--muted);line-height:1.9}
.kw-row{display:flex;align-items:flex-start;gap:.55rem;padding:.45rem .55rem;border-radius:7px;transition:background .15s}
.kw-row:hover{background:rgba(255,255,255,0.025)}
.kw-code{background:rgba(255,153,0,0.09);border:1px solid rgba(255,153,0,0.18);padding:.18rem .45rem;border-radius:5px;font-size:.68rem;color:var(--gold2);flex-shrink:0;font-family:monospace;max-width:195px;word-break:break-word}
.kw-answer{font-size:.82rem;font-weight:700;color:var(--ok2)}
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(5,8,22,0.97);backdrop-filter:blur(20px);color:var(--text);padding:.55rem 1.2rem;border-radius:999px;font-size:.82rem;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap;border:1px solid var(--border2);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.toast-ok{border-color:rgba(34,197,94,0.3)}
.toast.toast-err{border-color:rgba(239,68,68,0.3)}
.xp-float{position:fixed;font-size:.88rem;font-weight:900;color:var(--ok);pointer-events:none;z-index:999;animation:floatUp .9s ease forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(1.4)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotateZ(0deg);opacity:1}100%{transform:translateY(80px) rotateZ(360deg);opacity:0}}
.confetti-piece{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:999;animation:confettiFall .7s ease-out forwards}

/* ═══ RING ANIMATION ══════════════════════ */
@keyframes ringDraw{from{stroke-dasharray:0 999}to{stroke-dasharray:var(--dash) var(--circ)}}
.ring-animate circle.fill{animation:ringDraw 1s cubic-bezier(.4,0,.2,1) .2s both}

/* ═══ SHARED ANIMATIONS ═══════════════════ */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideOpt{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes galaxyPulse{0%,100%{box-shadow:0 0 30px rgba(255,153,0,0.3),0 0 60px rgba(255,153,0,0.1)}50%{box-shadow:0 0 50px rgba(255,153,0,0.5),0 0 100px rgba(255,153,0,0.15)}}
@keyframes trophySpin{0%{transform:translateY(-50%) rotate(0deg)}100%{transform:translateY(-50%) rotate(360deg)}}
@keyframes orbitSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes scoreIn{0%{opacity:0;transform:scale(.5) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes starTwinkle{0%,100%{opacity:0.3}50%{opacity:1}}
.animate-in{animation:slideUp .35s ease both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:700;margin-bottom:.7rem;letter-spacing:-.01em}
h3{font-size:.9rem;font-weight:600;margin-bottom:.45rem}
.label{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted);font-size:.82rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;flex-wrap:wrap;gap:.4rem}
/* mission item */
.mission-item{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.82rem}
.mission-item:last-child{border-bottom:none}
.mission-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;cursor:pointer;transition:all .2s}
.mission-check.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* challenge card */
.challenge-card-inner{background:linear-gradient(135deg,#2d1b69,#1e1b4b,#0f0a2a);border:1px solid rgba(139,92,246,0.3);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;position:relative;overflow:hidden}
.challenge-card-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,0.3),transparent)}
.challenge-glow{position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-size:4rem;opacity:.3;animation:trophySpin 6s linear infinite}

/* ═══════════════════════════════════════════
   LAYOUT TOGGLE — PREMIUM
═══════════════════════════════════════════ */
.layout-toggle{
  display:flex;align-items:center;gap:.25rem;
  background:rgba(5,10,28,0.85);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:.25rem;
  margin-bottom:1rem;
  width:fit-content;
  box-shadow:0 4px 20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
}
.layout-btn{
  padding:.35rem 1rem;border-radius:999px;
  font-size:.72rem;font-weight:800;color:var(--muted);
  transition:all .22s cubic-bezier(.4,0,.2,1);cursor:pointer;
  display:flex;align-items:center;gap:.35rem;
  border:none;background:none;letter-spacing:.01em;
}
.layout-btn.active{
  background:linear-gradient(135deg,rgba(233,169,47,0.3),rgba(233,169,47,0.12));
  color:var(--gold2);
  box-shadow:0 0 16px rgba(233,169,47,0.3),inset 0 1px 0 rgba(255,220,100,0.2);
  border:1px solid rgba(233,169,47,0.25);
}
.layout-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.07)}

/* ═══════════════════════════════════════════
   THEME TOGGLE
═══════════════════════════════════════════ */
.theme-toggle{
  display:flex;align-items:center;gap:.35rem;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:.25rem;
  margin-bottom:0;width:fit-content;
}
.theme-btn{
  padding:.28rem .7rem;border-radius:999px;
  font-size:.68rem;font-weight:700;color:var(--muted);
  transition:all .18s;cursor:pointer;
  display:flex;align-items:center;gap:.3rem;
  border:none;background:none;
}
.theme-btn.active{
  background:rgba(255,255,255,0.1);
  color:var(--text);
  box-shadow:0 0 8px rgba(255,255,255,0.1);
}
.theme-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.06)}
/* Top controls bar holding both toggles */
.home-controls{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;
}

/* ═══════════════════════════════════════════
   COMMAND CENTER — PREMIUM AWS CONTROL ROOM
═══════════════════════════════════════════ */

/* Animated keyframes for CC */
@keyframes ccBeaconPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ccScanLine{0%{transform:translateY(-100%);opacity:0}10%{opacity:0.4}90%{opacity:0.4}100%{transform:translateY(500%);opacity:0}}
@keyframes ccNumberCount{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccGlassShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes ccRingGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(233,169,47,0.5))}50%{filter:drop-shadow(0 0 16px rgba(233,169,47,0.9))}}
@keyframes ccMetricFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ccParticleOrbit{from{transform:rotate(0deg) translateX(60px)}to{transform:rotate(360deg) translateX(60px)}}
@keyframes ccHeaderBeam{0%{opacity:0;transform:scaleX(0)}30%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes ccGridPulse{0%,100%{opacity:0.03}50%{opacity:0.07}}
@keyframes ccCountdownTick{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ── CC WRAPPER (adds grid background overlay) ── */
.cc-wrapper{position:relative}
.cc-wrapper::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background-image:
    linear-gradient(rgba(8,123,255,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(8,123,255,0.035) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
  animation:ccGridPulse 6s ease-in-out infinite;
}

/* ── CC HEADER ── */
.cc-header{
  position:relative;overflow:hidden;
  border-radius:var(--radius-xl);
  margin-bottom:.85rem;
  padding:0;
  background:linear-gradient(130deg,
    #03091c 0%,
    #050e2a 25%,
    #06142e 50%,
    #03091a 75%,
    #020710 100%);
  border:1px solid rgba(8,123,255,0.28);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 8px 60px rgba(0,0,0,0.7),
    0 0 80px rgba(8,123,255,0.1),
    0 0 160px rgba(233,169,47,0.05),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 0 60px rgba(8,123,255,0.04);
}
/* Top spectral line */
.cc-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;z-index:10;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(8,123,255,0.6) 20%,
    rgba(0,207,255,0.9) 40%,
    rgba(233,169,47,0.9) 60%,
    rgba(255,215,122,0.6) 80%,
    transparent 100%);
  box-shadow:0 0 20px rgba(8,123,255,0.4),0 0 40px rgba(233,169,47,0.2);
}
/* Scan line animation */
.cc-header::after{
  content:'';position:absolute;top:0;left:0;right:0;height:60px;
  background:linear-gradient(180deg,rgba(8,123,255,0.06) 0%,transparent 100%);
  pointer-events:none;z-index:1;
  animation:ccScanLine 8s ease-in-out infinite;
}
/* Grid content inside header */
.cc-header-inner{
  padding:1.4rem 1.75rem;position:relative;z-index:2;
}
.cc-header-grid{
  display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center;
}
@media(max-width:700px){.cc-header-grid{grid-template-columns:1fr}}
.cc-header-eyebrow{
  font-size:.56rem;text-transform:uppercase;letter-spacing:.22em;
  color:var(--blue2);font-weight:900;margin-bottom:.5rem;
  display:flex;align-items:center;gap:.5rem;
}
.cc-header-eyebrow::before{
  content:'';width:24px;height:1px;
  background:linear-gradient(90deg,transparent,var(--blue2));display:inline-block;
}
.cc-header-eyebrow::after{
  content:'';flex:1;max-width:80px;height:1px;
  background:linear-gradient(90deg,var(--blue2),transparent);display:inline-block;
}
.cc-beacon{
  width:6px;height:6px;border-radius:50%;background:var(--green2);
  box-shadow:0 0 10px var(--green2);
  animation:ccBeaconPulse 2s ease-in-out infinite;
  display:inline-block;flex-shrink:0;
}
.cc-header-title{
  font-size:1.75rem;font-weight:900;line-height:1.08;letter-spacing:-.03em;color:#fff;
  margin-bottom:.25rem;text-shadow:0 2px 20px rgba(8,123,255,0.3);
}
.cc-header-title .cc-gold{
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold2) 50%,var(--gold) 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:ccGlassShimmer 4s linear infinite;
  display:block;
}
.cc-header-sub{
  font-size:.78rem;color:rgba(255,255,255,0.45);margin-bottom:1.1rem;
  display:flex;align-items:center;gap:.6rem;
}
.cc-header-sub .cc-dot-sep{
  width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.25);
  display:inline-block;
}
.cc-header-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* RIGHT SIDE: countdown + ring cluster */
.cc-header-right{
  display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;
}
/* Premium countdown block */
.cc-countdown-compact{
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(145deg,rgba(233,169,47,0.1),rgba(180,100,0,0.08));
  border:1px solid rgba(233,169,47,0.3);
  border-radius:18px;padding:1rem 1.5rem;
  min-width:150px;position:relative;overflow:hidden;
  box-shadow:
    0 0 30px rgba(233,169,47,0.1),
    0 4px 24px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,220,100,0.15),
    inset 0 0 30px rgba(233,169,47,0.04);
}
.cc-countdown-compact::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(233,169,47,0.7),transparent);
}
.cc-countdown-compact-eyebrow{
  font-size:.5rem;text-transform:uppercase;letter-spacing:.18em;
  color:rgba(233,169,47,0.6);font-weight:800;margin-bottom:.4rem;
}
.cc-countdown-compact-days{
  font-size:2.8rem;font-weight:900;color:var(--gold);line-height:1;
  letter-spacing:-.05em;text-shadow:0 0 30px rgba(233,169,47,0.5);
  animation:ccCountdownTick 2s ease-in-out infinite;
}
.cc-countdown-compact-label{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--gold2);font-weight:800;margin-top:.2rem;
}
.cc-countdown-compact-date{
  font-size:.62rem;color:rgba(255,255,255,0.35);margin-top:.5rem;font-weight:600;
  background:rgba(0,0,0,0.3);border-radius:999px;padding:.15rem .5rem;
  border:1px solid rgba(255,255,255,0.08);
}
/* CC readiness ring */
.cc-target-ring{
  position:relative;width:96px;height:96px;flex-shrink:0;
}
.cc-target-ring svg{filter:drop-shadow(0 0 12px rgba(233,169,47,0.3))}
.cc-target-ring-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;text-align:center;
}

/* ── CC INTEL CARDS (metric row of 4) ── */
.cc-intel{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:.75rem;margin-bottom:.85rem;
}
@media(max-width:950px){.cc-intel{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.cc-intel{grid-template-columns:1fr}}

.cc-intel-card{
  background:linear-gradient(150deg,
    rgba(8,16,40,0.98) 0%,
    rgba(5,10,26,0.99) 60%,
    rgba(3,7,18,1) 100%);
  border-radius:18px;padding:1rem 1.1rem;
  border:1px solid rgba(255,255,255,0.08);
  position:relative;overflow:hidden;

.cc-actions{

}

   PREMIUM 3D STAT CARD WAVES
═══════════════════════════════════════════ */

}

   PREMIUM KEY TERMS CARDS
═══════════════════════════════════════════ */
.kt-grid{
  display:grid;

  gap:.85rem;margin-bottom:1.2rem;
}

}

   PREMIUM 3D FLASHCARDS
═══════════════════════════════════════════ */
.flashcard-3d{
  perspective:1200px;
  cursor:pointer;
  user-select:none;
  margin-bottom:1rem;
  min-height:200px;
}
.flashcard-3d-inner{
  position:relative;
  transition:transform .65s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
  min-height:200px;
  border-radius:22px;
}
.flashcard-3d.flipped .flashcard-3d-inner{transform:rotateY(180deg)}
.fc3-face{
  position:absolute;width:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:22px;
  padding:1.6rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;min-height:200px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.06);
  overflow:hidden;
}
.fc3-face::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
}
.fc3-front{
  background:linear-gradient(145deg,#0a1535,#070e28,#050c1e);
  border:1px solid rgba(59,168,255,0.2);
}
.fc3-front::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:80px;
  background:radial-gradient(ellipse at 50% 100%,rgba(59,168,255,0.1),transparent);
  pointer-events:none;
}
.fc3-back{
  background:linear-gradient(145deg,#071a12,#040e0a,#030d08);
  border:1px solid rgba(34,197,94,0.25);
  transform:rotateY(180deg);
}
.fc3-back::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:80px;
  background:radial-gradient(ellipse at 50% 100%,rgba(34,197,94,0.12),transparent);
  pointer-events:none;
}
.fc3-domain{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;
  font-weight:800;margin-bottom:.8rem;
  padding:.2rem .7rem;border-radius:999px;
  background:rgba(59,168,255,0.1);border:1px solid rgba(59,168,255,0.2);
  color:var(--blue2);
}
.fc3-question{
  font-size:1rem;font-weight:700;line-height:1.65;color:var(--text);
  margin-bottom:.8rem;
}
.fc3-hint{
  font-size:.7rem;color:var(--muted);
  display:flex;align-items:center;gap:.3rem;
  animation:fc3Pulse 2s ease-in-out infinite;
}
@keyframes fc3Pulse{0%,100%{opacity:.5}50%{opacity:1}}
.fc3-answer-label{
  font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--green2);font-weight:800;margin-bottom:.6rem;
  display:flex;align-items:center;gap:.3rem;
}
.fc3-answer{
  font-size:.95rem;font-weight:800;color:var(--green2);

}
.fc3-rationale{
  font-size:.78rem;color:rgba(255,255,255,0.6);
  line-height:1.65;
  background:rgba(34,197,94,0.06);
  border:1px solid rgba(34,197,94,0.1);
  border-radius:10px;padding:.6rem .8rem;
  width:100%;text-align:left;
}
/* Nav row */
.fc3-nav{
  display:flex;align-items:center;justify-content:center;

}
/* Progress dots */
.fc3-dots{

}
.fc3-dot{

}

<script>
// ═══════════════════════════════════════════════════════════════
//  SPACE CANVAS — deep nebula, waves + stars
// ═══════════════════════════════════════════════════════════════
(function(){
  const c=document.getElementById('space-canvas');
  const ctx=c.getContext('2d');
  let stars=[],wave1t=0,wave2t=0,wave3t=0;

  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;initStars();}

  function initStars(){
    stars=[];
    // Deep background stars (small, dim)
    for(let i=0;i<180;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*.9+.1,a:Math.random()*.4+.05,twinkle:Math.random()*Math.PI*2,speed:Math.random()*.012+.003,layer:0});
    }
    // Mid stars
    for(let i=0;i<60;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.4,a:Math.random()*.6+.1,twinkle:Math.random()*Math.PI*2,speed:Math.random()*.02+.006,layer:1});
    }
    // Foreground bright stars
    for(let i=0;i<15;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+1,a:Math.random()*.9+.3,twinkle:Math.random()*Math.PI*2,speed:Math.random()*.03+.01,layer:2});
    }
  }

  window.addEventListener('resize',resize);resize();

  function drawWave(y,amp,freq,speed,t,r,g,b,alpha){
    ctx.beginPath();
    ctx.moveTo(0,c.height);
    for(let x=0;x<=c.width;x+=4){
      const y1=y+Math.sin((x*freq)+t)*amp+Math.sin((x*freq*.7)+t*1.3)*amp*.4;
      ctx.lineTo(x,y1);
    }
    ctx.lineTo(c.width,c.height);
    ctx.closePath();
    const grad=ctx.createLinearGradient(0,y-amp,0,c.height);
    grad.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grad;
    ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);

    // Layered nebula glows
    const n1=ctx.createRadialGradient(c.width*.12,c.height*.2,0,c.width*.12,c.height*.2,c.width*.38);
    n1.addColorStop(0,'rgba(8,123,255,0.07)');n1.addColorStop(.5,'rgba(8,123,255,0.03)');n1.addColorStop(1,'transparent');
    ctx.fillStyle=n1;ctx.fillRect(0,0,c.width,c.height);

    const n2=ctx.createRadialGradient(c.width*.88,c.height*.72,0,c.width*.88,c.height*.72,c.width*.32);
    n2.addColorStop(0,'rgba(233,169,47,0.06)');n2.addColorStop(.6,'rgba(233,169,47,0.02)');n2.addColorStop(1,'transparent');
    ctx.fillStyle=n2;ctx.fillRect(0,0,c.width,c.height);

    const n3=ctx.createRadialGradient(c.width*.5,c.height*.5,0,c.width*.5,c.height*.5,c.width*.28);
    n3.addColorStop(0,'rgba(128,85,245,0.04)');n3.addColorStop(1,'transparent');
    ctx.fillStyle=n3;ctx.fillRect(0,0,c.width,c.height);

    const n4=ctx.createRadialGradient(c.width*.7,c.height*.15,0,c.width*.7,c.height*.15,c.width*.25);
    n4.addColorStop(0,'rgba(0,207,255,0.04)');n4.addColorStop(1,'transparent');
    ctx.fillStyle=n4;ctx.fillRect(0,0,c.width,c.height);

    // Animated depth waves — 3 layers, different speeds
    wave1t+=0.004;
    wave2t+=0.007;
    wave3t+=0.0025;
    // Deep wave (blue, slowest)
    drawWave(c.height*.72,c.height*.04,0.008,1,wave3t,8,80,180,0.06);
    // Mid wave (blue-purple)
    drawWave(c.height*.8,c.height*.035,0.011,1,wave2t,0,100,220,0.055);
    // Foreground wave (gold tint)
    drawWave(c.height*.88,c.height*.025,0.014,1,wave1t,180,120,30,0.04);

    // Stars
    stars.forEach(s=>{
      s.twinkle+=s.speed;
      const a=s.a*(0.5+0.5*Math.sin(s.twinkle));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      if(s.layer===2){
        // Bright stars get a subtle glow
        const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
        sg.addColorStop(0,`rgba(200,220,255,${a})`);
        sg.addColorStop(1,'transparent');
        ctx.fillStyle=sg;
        ctx.arc(s.x,s.y,s.r*4,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      }
      ctx.fillStyle=`rgba(241,245,255,${a})`;ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

for failure','assume every component will fail and design to survive it'],['horizontal scal|scale out','adding more instances of the same size'],['high availability|minimal downtime|continue.*during.*failure','deploy across multiple AZs so if one fails, another continues'],['free tier.*12 month|750.*hour.*EC2','12-Month Free Tier: 750 hrs/mo t2.micro EC2, 5GB S3'],['always free|1 million.*Lambda','Always Free: Lambda 1M requests/mo, DynamoDB 25GB — never expires']];

function genRationale(q){
  if(q.rationale&&q.rationale.length>10) return q.rationale;
  const stemLc=q.stem.toLowerCase();
  const correctOpts=q.options.filter(o=>q.correct.some(c=>o.startsWith(c+'.')));
  for(const [pattern,answer] of EXAM_PATTERNS){if(stemLc.match(pattern)) return answer+'. This matches the key concept tested.';}
  const correctSvcs=[];
  for(const opt of correctOpts){const text=opt.replace(/^[A-E]\.\s*/,'');for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){correctSvcs.push({name:key,desc:SVC[key]});break;}}}
  if(correctSvcs.length>0) return correctSvcs.map(s=>`${s.name} is ${s.desc}`).join('. ')+'.';
  return `The correct answer is ${correctOpts.map(o=>o.replace(/^[A-E]\.\s*/,'')).join(', ')}. This best matches the question requirement.`;
}
function genWrongRationale(q){
  if(q.wrongRationale&&Object.keys(q.wrongRationale).length>0) return q.wrongRationale;
  const result={};
  q.options.filter(o=>!q.correct.some(c=>o.startsWith(c+'.'))).forEach(opt=>{
    const letter=opt.charAt(0);const text=opt.replace(/^[A-E]\.\s*/,'');
    let desc=null;for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){desc=`${key} is ${SVC[key]}`;break;}}
    result[letter]=desc?desc+'. It does not match what the question asks for.':text+' does not address the specific requirement.';
  });
  return result;
}
function getRationale(q){return genRationale(q);}
function getWrongRationale(q){return genWrongRationale(q);}

function getQ(id){return window.QUESTIONS.find(q=>q.id===id);}
function domainAccuracy(domain){
  const qs=window.QUESTIONS.filter(q=>q.domain===domain);
  let c=0,t=0;qs.forEach(q=>{const p=progress[q.id];if(p&&p.attempts>0){t+=p.attempts;c+=p.correct;}});
  return t===0?null:Math.round(c/t*100);
}
function overallAccuracy(){let c=0,t=0;Object.values(progress).forEach(p=>{if(p.attempts>0){t+=p.attempts;c+=p.correct;}});return t===0?null:Math.round(c/t*100);}
function dueItems(){
  const now=Date.now();
  return window.QUESTIONS.filter(q=>{const p=progress[q.id];if(!p)return true;if(p.interval===INTERVALS.length-1&&p.correct>0)return false;return now>=p.nextDue;});
}
function recordAnswer(qid,chosen,correct){
  if(!progress[qid]) progress[qid]={interval:0,nextDue:0,correct:0,attempts:0};
  const p=progress[qid];p.attempts++;const now=Date.now();
  if(correct){p.correct++;const idx=Math.min((p.interval||0)+1,INTERVALS.length-1);p.interval=idx;p.nextDue=now+INTERVALS[idx]*86400000;addXP(10);}
  else{
    p.interval=0;p.nextDue=now+INTERVALS[0]*86400000;addXP(2);
    const q=getQ(qid);
    if(q&&chosen.length===1&&q.correct.length===1){
      const cl=q.options.find(o=>o.startsWith(chosen[0]+'.'))?.replace(/^[A-D]\.\s*/,'')||chosen[0];
      const rl=q.options.find(o=>o.startsWith(q.correct[0]+'.'))?.replace(/^[A-D]\.\s*/,'')||q.correct[0];
      const ck=`${cl}|${rl}`;
      if(!confusions[ck]) confusions[ck]={count:0,lastSeen:0,aLabel:cl,bLabel:rl};
      confusions[ck].count++;confusions[ck].lastSeen=now;
    }
  }
  save('clf_progress',progress); // immediate save of the most critical data
  saveAll();
}

function ringHTML(pct,color,size=80,stroke=8){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const dash=(pct/100)*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"
      style="filter:drop-shadow(0 0 6px ${color});transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

  const mockBest=mockScores.length>0?Math.max(...mockScores.map(m=>m.score)):null;
  const mockAvg=mockScores.length>0?Math.round(mockScores.slice(-5).reduce((s,m)=>s+m.score,0)/Math.min(mockScores.length,5)):0;
  const totalQs=window.QUESTIONS.length;
  const dueCount=dueItems().length;
  const today=new Date().toDateString();
  if(missions.date!==today){missions={date:today,done:[]};save('clf_missions',missions);}
  const xpInLevel=xp%200;
  const level=Math.floor(xp/200)+1;

  // Score history data — last 7 mock scores or simulated ramp
  const sparkData=mockScores.length>=2
    ? mockScores.slice(-7).map(m=>m.score)
    : [0,0,0,0,score?Math.round(score*.4):0,score?Math.round(score*.7):0,score];
  const sparkMax=Math.max(...sparkData,10);
  const sparkMin=Math.min(...sparkData.filter(v=>v>0),0);
  const sparkH=70,sparkW=240;

  // Build smooth SVG path (using cubic bezier segments)
  function smoothPath(pts,w,h){
    const xs=pts.map((_,i)=>i/(pts.length-1)*w);
    const ys=pts.map(v=>h-((v-sparkMin)/(sparkMax-sparkMin||1))*h);
    if(pts.length<2) return '';
    let d=`M${xs[0]},${ys[0]}`;
    for(let i=0;i<xs.length-1;i++){
      const cpx=(xs[i]+xs[i+1])/2;
      d+=` C${cpx},${ys[i]} ${cpx},${ys[i+1]} ${xs[i+1]},${ys[i+1]}`;
    }
    return d;
  }
  const linePath=smoothPath(sparkData,sparkW,sparkH);
  const areaPath=linePath.replace(`M${0},${sparkH-((sparkData[0]-sparkMin)/(sparkMax-sparkMin||1))*sparkH}`,`M0,${sparkH}`)
    +` L${sparkW},${sparkH} Z`;
  // compute point coordinates for dots
  const sparkXs=sparkData.map((_,i)=>i/(sparkData.length-1)*sparkW);
  const sparkYs=sparkData.map(v=>sparkH-((v-sparkMin)/(sparkMax-sparkMin||1))*sparkH);

  const isOnTrack=score>=70;

            <span class="cc-dot-sep"></span>

//  GALAXY — animated orbital AWS service hub
// ═══════════════════════════════════════════════════════════════
function renderGalaxy(){
  const nodes=[
    {id:'security',img:'aws_learning_galaxy_individual_icons/03-cloud-security.png',label:'Security',  color:'#10C995', domain:'Security and Compliance',       bx:83, by:30, delay:.12},
    {id:'compute', img:'aws_learning_galaxy_individual_icons/01-microchip.png',    label:'Compute',   color:'#087BFF', domain:'Cloud Technology and Services', bx:50, by:12, delay:.05},
    {id:'storage', img:'aws_learning_galaxy_individual_icons/02-cloud-server.png', label:'Storage',   color:'#E9A92F', domain:'Cloud Technology and Services', bx:83, by:65, delay:.19},
    {id:'database',img:'aws_learning_galaxy_individual_icons/06-database.png',     label:'Databases', color:'#B08AFF', domain:'Cloud Technology and Services', bx:50, by:83, delay:.26},
    {id:'network', img:'aws_learning_galaxy_individual_icons/07-network.png',      label:'Networking',color:'#F472B6', domain:'Cloud Concepts',                bx:17, by:65, delay:.33},
    {id:'billing', img:'aws_learning_galaxy_individual_icons/09-analytics.png',    label:'Billing',   color:'#FB923C', domain:'Billing, Pricing and Support',  bx:17, by:30, delay:.40}
  ];

  const gxProgress=galaxyProgress;
  const nodePct=n=>{const d=domainAccuracy(n.domain);return d||gxProgress[n.id]||0;};

  const lines=nodes.map(n=>{
    const pct=nodePct(n);
    const len=Math.sqrt(Math.pow(n.bx-50,2)+Math.pow(n.by-50,2));
    const total=len*2.2;
    const drawn=Math.round(total*(pct/100));
    return `<line x1="50%" y1="50%" x2="${n.bx}%" y2="${n.by}%"
      stroke="${n.color}" stroke-width="0.9" opacity="0.3"
      stroke-dasharray="${drawn} ${Math.round(total)}"
      style="transition:stroke-dasharray 1.4s ease .3s"/>`;
  }).join('');

  const particles=[
    {x:30,y:25,s:3,dur:4.2,d:0,c:'#3BA8FF'},{x:70,y:20,s:2,dur:3.8,d:1.1,c:'#FF9900'},
    {x:85,y:55,s:2.5,dur:5,d:.7,c:'#22C55E'},{x:15,y:60,s:2,dur:4.5,d:2,c:'#A78BFA'},
    {x:55,y:76,s:3,dur:3.5,d:1.5,c:'#F472B6'},{x:40,y:15,s:2,dur:4.8,d:.3,c:'#FB923C'},
  ];

  return `
  <div class="gx-ring r1"></div>
  <div class="gx-ring r2"></div>
  <div class="gx-ring r3"></div>

  <svg class="gx-lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>

  ${particles.map(p=>`<div class="gx-particle" style="left:${p.x}%;top:${p.y}%;width:${p.s}px;height:${p.s}px;background:${p.c};box-shadow:0 0 ${p.s*3}px ${p.c};animation-duration:${p.dur}s;animation-delay:${p.d}s"></div>`).join('')}

  <div class="gx-center" onclick="navigate('universe')" title="Explore AWS Universe">
    <div class="gx-center-logo">aws</div>
    <span class="gx-center-arc"></span>
    <div class="gx-center-label">Cloud Hub</div>
  </div>

  ${nodes.map(n=>{
    const pct=nodePct(n);
    const perim=188;
    const dash=Math.round((pct/100)*perim);
    return `<div class="gx-node" style="left:${n.bx}%;top:${n.by}%;animation-delay:${n.delay}s"
      onclick="startPractice('domain','${n.domain}',10)" title="${n.label} · ${pct}% mastered">
      <div class="gx-node-icon-wrap">
        <div class="gx-node-bg" style="border-color:${n.color}70;box-shadow:0 0 16px ${n.color}40,0 4px 20px rgba(0,0,0,0.5);background:linear-gradient(145deg,${n.color}22,rgba(5,12,30,0.95))"><img src="${n.img}" alt="${n.label}" style="width:68%;height:68%;object-fit:contain;filter:drop-shadow(0 0 8px ${n.color}cc)" onerror="this.style.display='none'"></div>
        <svg style="position:absolute;top:-3px;left:-3px;width:calc(100% + 6px);height:calc(100% + 6px);overflow:visible;pointer-events:none" viewBox="0 0 52 52">
          <rect x="2" y="2" width="48" height="48" rx="15" ry="15" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2.5"/>
          <rect x="2" y="2" width="48" height="48" rx="15" ry="15" fill="none"
            stroke="${n.color}" stroke-width="2.5"
            stroke-dasharray="${dash} ${perim}" stroke-dashoffset="47" stroke-linecap="round"
            style="transition:stroke-dasharray 1.4s cubic-bezier(.4,0,.2,1) .4s;filter:drop-shadow(0 0 3px ${n.color})"/>
        </svg>
      </div>
      <div class="gx-node-label">${n.label}</div>
      <div class="gx-node-pct" style="color:${n.color}">${pct}%</div>
    </div>`;
  }).join('')}`;
}

// Live countdown ticker
function startLiveCountdown(){
  if(window._countdownInterval) clearInterval(window._countdownInterval);
  window._countdownInterval=setInterval(()=>{
    const ms=Math.max(0,EXAM_DATE-new Date());
    const d=Math.ceil(ms/86400000);
    const dEl=document.getElementById('live-days');
    if(dEl) dEl.textContent=d;
  },1000);
}

          <div class="label" style="margin-bottom:.4rem">Diagnostic Score</div>

      </div>
      ${DOMAINS.map(d=>{const pct=scores[d]||0;const color=DOMAIN_COLOR[d];return `<div style="margin-bottom:.85rem">

          <span style="display:flex;align-items:center;gap:.5rem"><span class="badge ${DOMAIN_BADGE[d]}">${DOMAIN_SHORT[d]}</span><span style="font-size:.83rem">${d}</span></span>

      </div>`;}).join('')}

  <div class="glass-card gold-card" style="margin-bottom:1.25rem">
