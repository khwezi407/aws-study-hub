﻿<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Cloud Practitioner Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="questions.js"></script>
<script src="external-questions.js"></script>
<script src="flashcards.js"></script>
<script src="studyplan.js"></script>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* backgrounds */
  --bg-deep:#050816;
  --bg-mid:#080d20;
  --bg-card:rgba(15,20,45,0.75);
  --bg-card-solid:#0d1228;
  --bg-sidebar:rgba(5,8,22,0.97);

  /* accents */
  --gold:#FF9900;
  --gold2:#FFB020;
  --gold3:#FFD060;
  --blue:#3BA8FF;
  --blue2:#60BFFF;
  --purple:#8B5CF6;
  --purple2:#A78BFA;
  --green:#22C55E;
  --green2:#4ADE80;
  --red:#EF4444;
  --red2:#F87171;

  /* legacy aliases kept for JS compatibility */
  --bg:#050816;
  --bg2:#080d20;
  --bg3:#0d1228;
  --card:#0d1228;
  --card2:#111830;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.15);
  --accent:#FF9900;--accent2:#FFB020;--accent3:#FFD060;
  --ok:#22C55E;--ok2:#4ADE80;
  --err:#EF4444;--err2:#F87171;
  --flag:#8B5CF6;--flag2:#A78BFA;
  --info:#3BA8FF;--info2:#60BFFF;
  --purple:#8B5CF6;--purple2:#A78BFA;
  --text:#F0F6FF;--muted:rgba(240,246,255,0.5);--muted2:rgba(240,246,255,0.28);
  --cc:#3BA8FF;--sec:#FFB020;--tech:#22C55E;--bill:#FF9900;

  /* shape */
  --radius:12px;--radius-lg:18px;--radius-xl:24px;

  /* glow helpers */
  --glow-gold:0 0 24px rgba(255,153,0,0.35);
  --glow-blue:0 0 24px rgba(59,168,255,0.35);
  --glow-purple:0 0 24px rgba(139,92,246,0.35);
  --glow-green:0 0 24px rgba(34,197,94,0.35);

  /* sidebar */
  --sidebar-w:210px;
}

/* ── RESETS ─────────────────────────────── */
html{font-size:15px;scroll-behavior:smooth}
body{
  background:linear-gradient(160deg,var(--bg-deep) 0%,#0B1030 100%);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;line-height:1.6;overflow-x:hidden;
}
button{cursor:pointer;font:inherit;border:none;background:none}
input,select{font:inherit}

/* ── SPACE CANVAS ───────────────────────── */
#space-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* ── SIDEBAR ────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);
  min-height:100vh;
  background:var(--bg-sidebar);
  border-right:1px solid rgba(255,153,0,0.12);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;height:100vh;
  overflow-y:auto;overflow-x:hidden;
  z-index:50;
  backdrop-filter:blur(20px);
  transition:width .25s ease;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,153,0,0.2);border-radius:3px}

/* logo area */
.sidebar-logo{
  display:flex;align-items:center;gap:.7rem;
  padding:1.1rem .9rem .9rem;
  border-bottom:1px solid rgba(255,153,0,0.12);
  flex-shrink:0;
}
.aws-logo-wrap{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#FF9900,#e07000);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(255,153,0,0.5);
  flex-shrink:0;
}
.aws-logo-wrap svg{width:28px;height:18px}
.sidebar-brand{line-height:1.25}
.sidebar-brand-name{font-size:.82rem;font-weight:800;color:var(--text);display:block}
.sidebar-brand-sub{font-size:.6rem;color:var(--gold);font-weight:600;display:block}

/* nav sections */
.sidebar-section-label{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted2);padding:.7rem .9rem .2rem;font-weight:700;
}
.nav-btn{
  display:flex;align-items:center;gap:.6rem;
  padding:.55rem .9rem;border-radius:var(--radius);
  color:var(--muted);font-size:.8rem;font-weight:600;
  transition:all .18s;width:100%;position:relative;
  margin:1px 0;
}
.nav-btn .nav-icon{font-size:.95rem;width:1.1rem;text-align:center;flex-shrink:0}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.nav-btn.active{
  background:linear-gradient(90deg,rgba(255,153,0,0.2),rgba(255,153,0,0.06));
  color:var(--gold2);
  border-left:2px solid var(--gold);
  padding-left:calc(.9rem - 2px);
}
.nav-badge{
  font-size:.5rem;font-weight:800;padding:.1rem .35rem;
  border-radius:999px;background:var(--red);color:#fff;
  letter-spacing:.03em;margin-left:.2rem;
}
.nav-badge.new{background:linear-gradient(135deg,var(--purple),var(--blue))}

/* sidebar dream card */
.sidebar-dream-card{
  margin:.6rem .6rem .8rem;
  border-radius:var(--radius-lg);
  background:linear-gradient(160deg,rgba(255,153,0,0.18),rgba(139,92,246,0.15));
  border:1px solid rgba(255,153,0,0.2);
  padding:.85rem .75rem;
  text-align:center;
  flex-shrink:0;
  position:relative;overflow:hidden;
}
.sidebar-dream-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,153,0,0.4),transparent);
}
.sidebar-dream-img{
  width:70px;height:50px;object-fit:cover;border-radius:8px;
  margin:0 auto .5rem;display:block;
  box-shadow:0 0 16px rgba(255,153,0,0.3);
}
.sidebar-dream-text{font-size:.65rem;color:var(--gold2);font-weight:700;line-height:1.4}

/* sidebar xp area */
.sidebar-xp{padding:.5rem .6rem .8rem;flex-shrink:0}
.sidebar-profile{
  display:flex;align-items:center;gap:.55rem;
  padding:.55rem .65rem;border-radius:var(--radius);
  background:rgba(255,153,0,0.07);
  border:1px solid rgba(255,153,0,0.15);
  margin-bottom:.5rem;
}
.profile-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;flex-shrink:0;
  box-shadow:0 0 10px rgba(139,92,246,0.4);
  overflow:hidden;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}

/* ── MAIN WRAPPER ───────────────────────── */
.main-wrapper{
  margin-left:var(--sidebar-w);
  flex:1;display:flex;flex-direction:column;min-height:100vh;
}

/* ── TOPBAR ─────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:flex-end;
  padding:.6rem 1.5rem;
  background:rgba(5,8,22,0.8);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  position:sticky;top:0;z-index:40;gap:.75rem;
}
.topbar-user{
  display:flex;align-items:center;gap:.6rem;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:.35rem .75rem .35rem .4rem;
}
.topbar-avatar{
  width:32px;height:32px;border-radius:50%;
  overflow:hidden;border:2px solid rgba(255,153,0,0.4);
  flex-shrink:0;
}
.topbar-avatar img{width:100%;height:100%;object-fit:cover}
.topbar-name{font-size:.8rem;font-weight:700;color:var(--text)}
.topbar-level{font-size:.65rem;color:var(--gold);font-weight:600}
.topbar-xp-bar{
  width:60px;height:4px;background:rgba(255,255,255,0.1);
  border-radius:999px;overflow:hidden;margin-top:2px;
}
.topbar-xp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 6px rgba(255,153,0,0.5)}
.topbar-bell{
  position:relative;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:background .18s;
}
.topbar-bell:hover{background:rgba(255,255,255,0.1)}
.topbar-bell-badge{
  position:absolute;top:4px;right:4px;width:8px;height:8px;
  border-radius:50%;background:var(--red);border:1.5px solid var(--bg-deep);
}

/* ── MAIN CONTENT ───────────────────────── */
.main-content{
  flex:1;padding:1.1rem 1.4rem 2rem;
  max-width:1300px;width:100%;
}

/* ── BOTTOM NAV (mobile) ────────────────── */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(5,8,22,0.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  z-index:100;padding:.2rem 0 env(safe-area-inset-bottom,.2rem);
}

/* ── RESPONSIVE ─────────────────────────── */
@media(max-width:860px){
  .sidebar{display:none}
  .main-wrapper{margin-left:0}
  .bottom-nav{display:flex}
  .main-content{padding-bottom:5rem}
}
.bottom-nav .nav-btn{
  flex:1;flex-direction:column;justify-content:center;
  gap:2px;padding:.4rem .2rem;font-size:.6rem;border-radius:0;
  color:var(--muted);border-left:none;
}
.bottom-nav .nav-btn .nav-icon{font-size:1.2rem;width:auto}
.bottom-nav .nav-btn.active{color:var(--gold);background:transparent;border-left:none;padding-left:.2rem}

/* ═══════════════════════════════════════════
   HERO BANNER
═══════════════════════════════════════════ */
.hero-banner{
  position:relative;overflow:hidden;
  border-radius:var(--radius-xl);
  margin-bottom:1rem;
  min-height:220px;
  background:linear-gradient(120deg,#07122a 0%,#0d1535 40%,#15183a 60%,#0d1535 100%);
  border:1px solid rgba(59,168,255,0.2);
  box-shadow:0 0 60px rgba(59,168,255,0.1),0 0 120px rgba(255,153,0,0.06),inset 0 1px 0 rgba(255,255,255,0.05);
}
.hero-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  opacity:0.22;
  mix-blend-mode:luminosity;
}
.hero-astronaut-img{
  position:absolute;right:18%;top:0;bottom:0;
  height:100%;width:auto;max-width:380px;
  object-fit:cover;object-position:top center;
  mask-image:linear-gradient(to right,transparent 0%,black 15%,black 85%,transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0%,black 15%,black 85%,transparent 100%);
  pointer-events:none;
  animation:heroFloat 5s ease-in-out infinite;
}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* hero content */
.hero-content{
  position:relative;z-index:3;
  padding:1.6rem 1.8rem;
  max-width:52%;
}
.hero-eyebrow{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--blue2);font-weight:800;margin-bottom:.35rem;
}
.hero-title{
  font-size:1.7rem;font-weight:900;line-height:1.15;
  letter-spacing:-.025em;margin-bottom:.3rem;color:#fff;
}
.hero-title .gold{
  background:linear-gradient(90deg,var(--gold),var(--gold3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;display:block;
}
.hero-sub{font-size:.78rem;color:rgba(255,255,255,0.65);margin-bottom:.9rem}
.hero-pills{display:flex;gap:.5rem;flex-wrap:wrap}
.hero-pill{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.28rem .75rem;border-radius:999px;font-size:.7rem;font-weight:700;
  background:rgba(255,255,255,0.08);color:var(--text);
  border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
}
.hero-pill .pill-icon{font-size:.8rem}
.hero-pill.gold-pill{background:rgba(255,153,0,0.15);color:var(--gold2);border-color:rgba(255,153,0,0.3)}

/* target score ring (far right) */
.hero-target{
  position:absolute;right:1.5rem;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;
  z-index:4;
}
.hero-target-ring{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,153,0,0.15) 0%,rgba(255,153,0,0.05) 50%,transparent 70%);
  border:3px solid rgba(255,153,0,0.6);
  box-shadow:0 0 30px rgba(255,153,0,0.4),0 0 60px rgba(255,153,0,0.15),inset 0 0 20px rgba(255,153,0,0.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:ringPulse 2.5s ease-in-out infinite;
}
@keyframes ringPulse{0%,100%{box-shadow:0 0 30px rgba(255,153,0,0.4),0 0 60px rgba(255,153,0,0.15)}50%{box-shadow:0 0 50px rgba(255,153,0,0.6),0 0 100px rgba(255,153,0,0.25)}}
.hero-target-crown{font-size:1.3rem;line-height:1;margin-bottom:.1rem}
.hero-target-pct{font-size:1.6rem;font-weight:900;color:var(--gold);line-height:1}
.hero-target-label{font-size:.6rem;color:rgba(255,255,255,0.7);font-weight:600}
.hero-target-ribbon{
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  color:#0a0a0a;font-size:.62rem;font-weight:900;
  padding:.22rem .7rem;border-radius:999px;
  box-shadow:0 0 12px rgba(255,153,0,0.5);
  letter-spacing:.03em;
}

/* ═══════════════════════════════════════════
   STAT CARDS ROW
═══════════════════════════════════════════ */
.stat-cards-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.85rem;margin-bottom:1rem;
}
@media(max-width:1050px){.stat-cards-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stat-cards-row{grid-template-columns:1fr}}

.stat-card{
  background:var(--bg-card);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:1.1rem 1.2rem;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
  border:1px solid;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,currentColor,transparent);
  opacity:.25;
}
.stat-card:hover{transform:translateY(-4px)}
.stat-card.sc-streak{
  border-color:rgba(255,153,0,0.3);
  box-shadow:0 0 24px rgba(255,153,0,0.12);
}
.stat-card.sc-streak:hover{box-shadow:0 8px 32px rgba(255,153,0,0.25)}
.stat-card.sc-xp{
  border-color:rgba(255,176,32,0.3);
  box-shadow:0 0 24px rgba(255,176,32,0.1);
}
.stat-card.sc-xp:hover{box-shadow:0 8px 32px rgba(255,176,32,0.22)}
.stat-card.sc-readiness{
  border-color:rgba(34,197,94,0.3);
  box-shadow:0 0 24px rgba(34,197,94,0.12);
}
.stat-card.sc-readiness:hover{box-shadow:0 8px 32px rgba(34,197,94,0.25)}
.stat-card.sc-practice{
  border-color:rgba(139,92,246,0.3);
  box-shadow:0 0 24px rgba(139,92,246,0.1);
}
.stat-card.sc-practice:hover{box-shadow:0 8px 32px rgba(139,92,246,0.22)}

.sc-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.sc-icon-wrap{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  flex-shrink:0;
}
.sc-icon-wrap.gold-wrap{background:rgba(255,153,0,0.15);border:1px solid rgba(255,153,0,0.3)}
.sc-icon-wrap.amber-wrap{background:rgba(255,176,32,0.15);border:1px solid rgba(255,176,32,0.3)}
.sc-icon-wrap.green-wrap{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3)}
.sc-icon-wrap.purple-wrap{background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.3)}
.sc-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.sc-big{font-size:2.4rem;font-weight:900;line-height:1;letter-spacing:-.04em;margin-bottom:.15rem}
.sc-big.gold-text{color:var(--gold2)}
.sc-big.green-text{color:var(--green)}
.sc-big.purple-text{color:var(--purple2)}
.sc-sub{font-size:.72rem;color:var(--muted);font-weight:600}
.sc-sub.gold-sub{color:var(--gold)}
.sc-sub.green-sub{color:var(--green)}
.sc-fire{display:inline-block;animation:flamePulse 1.2s ease-in-out infinite}
.sc-progress-wrap{
  background:rgba(255,255,255,0.08);border-radius:999px;
  height:5px;overflow:hidden;margin-top:.6rem;
}
.sc-progress-fill{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.sc-progress-fill.gold-fill{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px rgba(255,153,0,0.5)}
.sc-progress-fill.green-fill{background:linear-gradient(90deg,var(--green),var(--green2));box-shadow:0 0 8px rgba(34,197,94,0.5)}
.sc-progress-fill.purple-fill{background:linear-gradient(90deg,var(--purple),var(--purple2));box-shadow:0 0 8px rgba(139,92,246,0.5)}
.sc-mini-chart{display:flex;align-items:flex-end;gap:3px;height:30px;margin-top:.5rem}
.sc-bar{border-radius:3px 3px 0 0;min-width:6px;transition:height .5s ease}
.sc-readiness-wrap{display:flex;align-items:center;gap:.8rem}
.sc-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.sc-ring-wrap svg{transform:rotate(-90deg)}
.sc-ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.1rem;font-weight:900}
.sc-trend{font-size:.7rem;color:var(--green);font-weight:700;display:flex;align-items:center;gap:.2rem}

/* ═══════════════════════════════════════════
   DOMAINS + GALAXY ROW
═══════════════════════════════════════════ */
.mid-row{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.85rem;margin-bottom:1rem;
}
@media(max-width:800px){.mid-row{grid-template-columns:1fr}}

.glass-card{
  background:var(--bg-card);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:1.1rem 1.25rem;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:transform .2s,box-shadow .2s;
}
.glass-card:hover{transform:translateY(-3px)}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
}
.glass-card.gold-card{
  border-color:rgba(255,153,0,0.2);
  box-shadow:0 0 24px rgba(255,153,0,0.08);
}
.glass-card.gold-card:hover{box-shadow:0 8px 40px rgba(255,153,0,0.18)}
.glass-card.blue-card{
  border-color:rgba(59,168,255,0.2);
  box-shadow:0 0 24px rgba(59,168,255,0.08);
}
.glass-card.blue-card:hover{box-shadow:0 8px 40px rgba(59,168,255,0.18)}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1rem;
}
.card-header-left{display:flex;align-items:center;gap:.5rem}
.card-header-icon{font-size:1.1rem}
.card-header-title{font-size:.9rem;font-weight:800;color:var(--text)}
.card-header-sub{font-size:.65rem;color:var(--muted);margin-top:1px}
.card-header-link{
  font-size:.7rem;color:var(--gold);font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:.25rem;
  padding:.3rem .6rem;border-radius:999px;
  border:1px solid rgba(255,153,0,0.25);
  background:rgba(255,153,0,0.08);
  transition:all .18s;white-space:nowrap;
}
.card-header-link:hover{background:rgba(255,153,0,0.15);box-shadow:0 0 12px rgba(255,153,0,0.2)}

/* domain rings */
.domain-rings-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;
}
@media(max-width:500px){.domain-rings-grid{grid-template-columns:repeat(2,1fr)}}
.domain-ring-item{
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;padding:.5rem .3rem .4rem;
  border-radius:var(--radius-lg);transition:background .18s;
}
.domain-ring-item:hover{background:rgba(255,255,255,0.04)}
.domain-ring-svg-wrap{position:relative;width:80px;height:80px;margin:0 auto .5rem}
.domain-ring-svg-wrap svg{transform:rotate(-90deg)}
.domain-ring-inner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.domain-ring-emoji{font-size:.95rem;line-height:1}
.domain-ring-pct{font-size:.85rem;font-weight:900;line-height:1}
.domain-ring-label{font-size:.58rem;color:var(--muted);font-weight:600;text-align:center;line-height:1.3}
.domain-ring-weight{font-size:.56rem;color:var(--muted2);text-align:center;margin-top:1px}

/* galaxy */
.galaxy-wrap{position:relative;height:200px}
.galaxy-bg-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;border-radius:12px;opacity:.35;
}
.galaxy-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.galaxy-center-btn{
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,153,0,0.3) 0%,rgba(20,30,80,0.9) 60%);
  border:2px solid rgba(255,153,0,0.6);
  box-shadow:0 0 40px rgba(255,153,0,0.4),0 0 80px rgba(59,168,255,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:900;color:rgba(255,153,0,0.95);
  animation:galaxyPulse2 2s ease-in-out infinite;cursor:pointer;
  letter-spacing:.03em;z-index:5;position:relative;
}
@keyframes galaxyPulse2{0%,100%{box-shadow:0 0 30px rgba(255,153,0,0.3),0 0 60px rgba(255,153,0,0.1)}50%{box-shadow:0 0 50px rgba(255,153,0,0.5),0 0 100px rgba(255,153,0,0.15)}}
.galaxy-orbit{
  position:absolute;top:50%;left:50%;
  border-radius:50%;border:1px solid;
  pointer-events:none;transform:translate(-50%,-50%);
}
.galaxy-node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;z-index:4;
}
.galaxy-node-icon{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  border:2px solid;transition:all .2s;
}
.galaxy-node:hover .galaxy-node-icon{transform:scale(1.25)}
.galaxy-node-label{font-size:.58rem;font-weight:700;color:var(--text);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,0.9)}

/* ═══════════════════════════════════════════
   BOTTOM ROW (3 cards)
═══════════════════════════════════════════ */
.bottom-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:.85rem;margin-bottom:1rem;
}
@media(max-width:900px){.bottom-row{grid-template-columns:1fr}}
@media(max-width:1100px) and (min-width:600px){.bottom-row{grid-template-columns:1fr 1fr}}

/* mission card */
.mission-card{
  background:var(--bg-card);backdrop-filter:blur(16px);
  border-radius:20px;padding:1.1rem 1.2rem;
  border:1px solid rgba(255,153,0,0.2);
  box-shadow:0 0 24px rgba(255,153,0,0.08);
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.mission-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(255,153,0,0.18)}
.mission-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,153,0,0.3),transparent)}
.mission-img{
  width:80px;height:60px;object-fit:cover;border-radius:10px;
  float:right;margin:0 0 .5rem .75rem;
  box-shadow:0 0 16px rgba(255,153,0,0.3);
}
.mission-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:800;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.mission-title{font-size:.88rem;font-weight:800;color:var(--text);margin-bottom:.3rem;line-height:1.3}
.mission-desc{font-size:.75rem;color:var(--muted);line-height:1.5;margin-bottom:.6rem}
.mission-time{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:.68rem;color:var(--muted);font-weight:600;
  background:rgba(255,255,255,0.06);border-radius:999px;
  padding:.2rem .55rem;border:1px solid rgba(255,255,255,0.08);
  margin-bottom:.75rem;
}

/* achievements card */
.achievements-card{
  background:var(--bg-card);backdrop-filter:blur(16px);
  border-radius:20px;padding:1.1rem 1.2rem;
  border:1px solid rgba(255,153,0,0.15);
  box-shadow:0 0 24px rgba(255,153,0,0.06);
  position:relative;overflow:hidden;
  transition:transform .2s;
}
.achievements-card:hover{transform:translateY(-3px)}
.achievements-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,153,0,0.2),transparent)}
.ach-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}
.ach-badge{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:68px;cursor:pointer;transition:transform .2s}
.ach-badge:hover{transform:translateY(-3px)}
.ach-icon{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  position:relative;
}
.ach-icon::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid;opacity:.4}
.ach-icon.gold{background:radial-gradient(circle,rgba(255,153,0,0.3),rgba(180,80,0,0.1));border:2px solid rgba(255,153,0,0.5);box-shadow:0 0 20px rgba(255,153,0,0.3)}
.ach-icon.gold::after{border-color:rgba(255,153,0,0.3)}
.ach-icon.purple{background:radial-gradient(circle,rgba(139,92,246,0.35),rgba(100,30,200,0.1));border:2px solid rgba(139,92,246,0.5);box-shadow:0 0 20px rgba(139,92,246,0.3)}
.ach-icon.purple::after{border-color:rgba(139,92,246,0.3)}
.ach-icon.blue{background:radial-gradient(circle,rgba(59,168,255,0.3),rgba(30,100,200,0.1));border:2px solid rgba(59,168,255,0.5);box-shadow:0 0 20px rgba(59,168,255,0.3)}
.ach-icon.blue::after{border-color:rgba(59,168,255,0.3)}
.ach-icon.green{background:radial-gradient(circle,rgba(34,197,94,0.3),rgba(20,120,60,0.1));border:2px solid rgba(34,197,94,0.5);box-shadow:0 0 20px rgba(34,197,94,0.3)}
.ach-icon.green::after{border-color:rgba(34,197,94,0.3)}
.ach-icon.locked{filter:grayscale(1);opacity:.3;background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.1)}
.ach-icon.locked::after{border-color:transparent}
.ach-label{font-size:.58rem;color:var(--muted);text-align:center;font-weight:600;line-height:1.2}

/* next challenge card */
.challenge-card{
  background:linear-gradient(135deg,#2d1b69 0%,#1e1b4b 50%,#0f0a2a 100%);
  backdrop-filter:blur(16px);border-radius:20px;padding:1.1rem 1.2rem;
  border:1px solid rgba(139,92,246,0.3);
  box-shadow:0 0 24px rgba(139,92,246,0.15);
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.challenge-card:hover{transform:translateY(-3px);box-shadow:0 8px 40px rgba(139,92,246,0.3)}
.challenge-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,0.4),transparent)}
.challenge-trophy-img{
  position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:100px;height:100px;object-fit:contain;
  opacity:.85;filter:drop-shadow(0 0 20px rgba(255,153,0,0.4));
  animation:trophyGlow 2.5s ease-in-out infinite;
}
@keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 15px rgba(255,153,0,0.3))}50%{filter:drop-shadow(0 0 30px rgba(255,153,0,0.6))}}
.challenge-content{position:relative;z-index:2;max-width:65%}
.challenge-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--purple2);font-weight:800;margin-bottom:.35rem;display:flex;align-items:center;gap:.35rem}
.challenge-title{font-size:.9rem;font-weight:800;color:var(--text);margin-bottom:.25rem}
.challenge-sub{font-size:.74rem;color:rgba(255,255,255,0.6);margin-bottom:.7rem;line-height:1.45}

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.55rem 1.2rem;border-radius:var(--radius);
  font-weight:700;font-size:.82rem;cursor:pointer;
  transition:all .18s;position:relative;overflow:hidden;border:none;
}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.08) 0%,transparent 50%);pointer-events:none}
.btn-primary{
  background:linear-gradient(135deg,var(--gold),#d97706);color:#0a0a0a;
  box-shadow:0 4px 16px rgba(255,153,0,0.4),0 1px 0 rgba(255,255,255,0.2) inset;
}
.btn-primary:hover{background:linear-gradient(135deg,var(--gold2),var(--gold));transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,153,0,0.55)}
.btn-purple{
  background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff;
  box-shadow:0 4px 16px rgba(139,92,246,0.4);
}
.btn-purple:hover{background:linear-gradient(135deg,var(--purple2),var(--purple));transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,92,246,0.55)}
.btn-secondary{
  background:rgba(255,255,255,0.07);color:var(--text);
  border:1px solid rgba(255,255,255,0.14);
}
.btn-secondary:hover{background:rgba(255,255,255,0.12);transform:translateY(-1px)}
.btn-sm{padding:.38rem .9rem;font-size:.76rem}
.btn-xs{padding:.25rem .6rem;font-size:.7rem}
.btn-danger{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.25)}
.btn-danger:hover{background:rgba(239,68,68,0.22)}

/* ═══════════════════════════════════════════
   PRACTICE / INNER PAGES (unchanged logic)
═══════════════════════════════════════════ */
.practice-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.sub-tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.1rem}
.sub-tab{padding:.35rem .82rem;border-radius:999px;font-size:.76rem;font-weight:700;color:var(--muted);border:1px solid var(--border);transition:all .18s;background:var(--card)}
.sub-tab:hover{color:var(--text);border-color:var(--border2)}
.sub-tab.active{background:linear-gradient(135deg,rgba(255,153,0,0.18),rgba(255,153,0,0.08));color:var(--gold);border-color:rgba(255,153,0,0.28);box-shadow:0 0 12px rgba(255,153,0,0.1)}
.domain-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.85rem}
.domain-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.15rem;position:relative;overflow:hidden;transition:all .2s cubic-bezier(.4,0,.2,1)}
.domain-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.domain-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem}
.domain-card-left{display:flex;align-items:center;gap:.6rem}
.domain-card-icon{font-size:1.5rem}
.domain-card-name{font-weight:800;font-size:.88rem;line-height:1.3}
.domain-pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.62rem;font-weight:800;letter-spacing:.04em;margin-top:.2rem}
.domain-card-pct{font-size:1.4rem;font-weight:900;line-height:1}
.domain-card-attempted{font-size:.72rem;color:var(--muted);margin-bottom:.6rem}
.domain-progress{background:rgba(255,255,255,0.07);border-radius:999px;height:5px;overflow:hidden;margin-bottom:.75rem}
.domain-progress-fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.domain-card-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:all .2s}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;position:relative;overflow:hidden}
.card-sm::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent)}
.card-accent{border-color:rgba(255,153,0,0.25);background:rgba(255,153,0,0.04)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.85rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.stat:hover{transform:translateY(-2px) scale(1.02)}
.stat-num{font-size:2rem;font-weight:900;line-height:1;letter-spacing:-.03em}
.stat-label{font-size:.68rem;color:var(--muted);margin-top:.25rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.badge{display:inline-block;padding:.15rem .58rem;border-radius:999px;font-size:.66rem;font-weight:800;letter-spacing:.04em}
.badge-cc{background:rgba(59,168,255,0.12);color:var(--cc);border:1px solid rgba(59,168,255,0.2)}
.badge-sec{background:rgba(255,153,0,0.12);color:var(--sec);border:1px solid rgba(255,153,0,0.2)}
.badge-tech{background:rgba(34,197,94,0.12);color:var(--tech);border:1px solid rgba(34,197,94,0.2)}
.badge-bill{background:rgba(255,153,0,0.12);color:var(--bill);border:1px solid rgba(255,153,0,0.2)}
.badge-unverified{background:rgba(167,139,250,0.08);color:var(--flag);font-size:.6rem;border:1px solid rgba(167,139,250,0.18)}
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.4rem}
.q-stem{font-size:1rem;line-height:1.75;margin-bottom:1.2rem;font-weight:500;color:var(--text)}
.options-list{display:flex;flex-direction:column;gap:.55rem}
.opt-btn{text-align:left;padding:.82rem 1.05rem;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--card2);color:var(--text);transition:all .18s;width:100%;line-height:1.55;position:relative;overflow:hidden;font-size:.88rem}
.opt-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent)}
.opt-btn:hover:not(:disabled){border-color:rgba(255,153,0,0.4);background:rgba(255,153,0,0.06);transform:translateX(4px);box-shadow:-3px 0 0 rgba(255,153,0,0.3)}
.opt-btn.selected{border-color:var(--gold);background:rgba(255,153,0,0.08);color:var(--gold2)}
.opt-btn.correct{border-color:var(--ok)!important;background:rgba(34,197,94,0.1)!important;color:var(--ok2)!important;box-shadow:0 0 16px rgba(34,197,94,0.15)!important}
.opt-btn.incorrect{border-color:var(--red)!important;background:rgba(239,68,68,0.1)!important;color:var(--red2)!important;animation:shake .4s ease}
.opt-btn.reveal-correct{border-color:var(--ok)!important;background:rgba(34,197,94,0.05)!important}
.opt-btn:disabled{cursor:default}
.opt-btn.animate-opt{animation:slideOpt .22s ease both}
.rationale-box{margin-top:1rem;padding:1rem 1.2rem;border-radius:var(--radius);background:var(--card);border:1px solid rgba(34,197,94,0.18);border-left:3px solid var(--ok);font-size:.88rem;line-height:1.7;animation:slideUp .3s ease}
.rationale-box.wrong{border-left-color:var(--red);border-color:rgba(239,68,68,0.18)}
.rationale-box h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.45rem}
.wrong-opts{margin-top:.7rem;display:flex;flex-direction:column;gap:.35rem}
.wrong-opt-item{font-size:.82rem;color:var(--muted);padding:.38rem .6rem;background:rgba(239,68,68,0.04);border-radius:6px}
.wrong-opt-item strong{color:var(--red2)}
.interview-tip{margin-top:.7rem;padding:.6rem .9rem;background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(59,168,255,0.04));border:1px solid rgba(139,92,246,0.16);border-radius:var(--radius);font-size:.8rem;line-height:1.6}
.interview-tip .tip-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--flag);font-weight:800;margin-bottom:.28rem;display:block}
.progress-wrap{background:rgba(255,255,255,0.06);border-radius:999px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px rgba(255,153,0,0.35)}
.progress-fill.ok{background:linear-gradient(90deg,var(--ok),var(--ok2));box-shadow:0 0 8px rgba(34,197,94,0.3)}
.progress-fill.err{background:linear-gradient(90deg,var(--red),var(--red2))}
.timer{font-size:1.2rem;font-weight:900;font-variant-numeric:tabular-nums;padding:.35rem .8rem;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);letter-spacing:.05em}
.timer.warning{color:var(--red);border-color:rgba(239,68,68,0.4);animation:pulse 1s infinite;box-shadow:0 0 16px rgba(239,68,68,0.15)}
.service-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.service-card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 40px rgba(0,0,0,0.5);border-color:var(--border2)}
.service-card:hover .service-story{max-height:200px;opacity:1}
.service-story{max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease}
.service-card.expanded .service-story{max-height:200px;opacity:1}
.service-emoji{font-size:1.8rem;display:block;margin-bottom:.4rem;transition:transform .2s}
.service-name{font-weight:800;font-size:.84rem;margin-bottom:.2rem}
.service-hook{font-size:.7rem;color:var(--muted);line-height:1.4}
.q-grid{display:flex;flex-wrap:wrap;gap:3px;max-height:120px;overflow-y:auto}
.q-dot{width:28px;height:28px;border-radius:7px;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted);border:1.5px solid var(--border);cursor:pointer;transition:all .12s}
.q-dot.answered{background:rgba(59,168,255,0.08);border-color:var(--info);color:var(--info)}
.q-dot.flagged{background:rgba(139,92,246,0.08);border-color:var(--flag);color:var(--flag)}
.q-dot.current{border-color:var(--gold);color:var(--gold);background:rgba(255,153,0,0.1);box-shadow:0 0 8px rgba(255,153,0,0.25)}
.q-dot:hover{transform:scale(1.12)}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;margin-bottom:.65rem;transition:transform .15s}
.review-item:hover{transform:translateX(3px)}
.review-item.rv-correct{border-left:3px solid var(--ok)}
.review-item.rv-wrong{border-left:3px solid var(--red)}
.review-item.rv-skipped{border-left:3px solid var(--muted2)}
.flashcard{perspective:1000px;cursor:pointer;user-select:none}
.flashcard-inner{position:relative;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;min-height:180px}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-lg);padding:1.4rem;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;min-height:180px}
.flashcard-front{background:linear-gradient(135deg,rgba(59,168,255,0.06),rgba(255,255,255,0.02));border-color:rgba(59,168,255,0.14)}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(255,255,255,0.02));border-color:rgba(34,197,94,0.22)}
.confusion-pair{background:var(--card);border-radius:var(--radius);padding:.7rem 1rem;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;transition:border-color .15s}

(function(){
  const c=document.getElementById('space-canvas');
  const ctx=c.getContext('2d');
  let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;initStars();}
  function initStars(){
    stars=[];
    for(let i=0;i<220;i++){
      stars.push({
        x:Math.random()*c.width, y:Math.random()*c.height,
        r:Math.random()*1.6+.2,
        a:Math.random()*.8+.1,
        twinkle:Math.random()*Math.PI*2,
        speed:Math.random()*.025+.004
      });
    }
  }
  window.addEventListener('resize',resize);resize();
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const g1=ctx.createRadialGradient(c.width*.15,c.height*.25,0,c.width*.15,c.height*.25,c.width*.4);
    g1.addColorStop(0,'rgba(59,168,255,0.05)');g1.addColorStop(1,'transparent');
    ctx.fillStyle=g1;ctx.fillRect(0,0,c.width,c.height);
    const g2=ctx.createRadialGradient(c.width*.85,c.height*.75,0,c.width*.85,c.height*.75,c.width*.35);
    g2.addColorStop(0,'rgba(255,153,0,0.05)');g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2;ctx.fillRect(0,0,c.width,c.height);
    const g3=ctx.createRadialGradient(c.width*.5,c.height*.5,0,c.width*.5,c.height*.5,c.width*.3);
    g3.addColorStop(0,'rgba(139,92,246,0.03)');g3.addColorStop(1,'transparent');
    ctx.fillStyle=g3;ctx.fillRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.twinkle+=s.speed;
      const a=s.a*(0.5+0.5*Math.sin(s.twinkle));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

ions and manages SSL/TLS certificates for CloudFront and Load Balancers — free with AWS services','ACM':'provisions and manages SSL/TLS certificates — free with AWS services','Artifact':'self-service portal for downloading compliance reports (SOC, ISO, PCI) and agreements','AWS Artifact':'self-service portal for downloading compliance reports (SOC, ISO, PCI)','IAM':'Identity and Access Management — users, groups, roles, policies. Controls who can access what','AWS IAM':'Identity and Access Management — users, groups, roles, policies','IAM Role':'temporary credentials for AWS services or cross-account access — no permanent keys','IAM User':'long-term identity with password and/or access keys','IAM Group':'collection of users — attach a policy once, all members inherit it','IAM Policy':'JSON document defining permissions','MFA':'Multi-Factor Authentication — second factor on top of password for extra security','Cognito':'user authentication for web/mobile apps — supports social providers via identity pools','Amazon Cognito':'user authentication for web/mobile apps — supports social providers via identity pools','Organizations':'groups multiple accounts into hierarchy with consolidated billing and SCP guardrails','AWS Organizations':'groups multiple accounts into hierarchy with consolidated billing and SCP guardrails','SCP':'Service Control Policy — organisation-level guardrail that overrides even AdministratorAccess','Control Tower':'automates landing zone setup — secure multi-account environment with built-in guardrails','AWS Control Tower':'automates landing zone setup — secure multi-account environment with built-in guardrails','CloudFormation':'Infrastructure as Code — define resources in JSON/YAML templates, CloudFormation provisions them as a stack','AWS CloudFormation':'Infrastructure as Code — define resources in JSON/YAML templates','Snowball':'physical device for offline data transfer — AWS ships it, you load data, ship it back. For 50-80TB','AWS Snowball':' function genRationale(q){
  if(q.rationale&&q.rationale.length>10) return q.rationale;
  const stemLc=q.stem.toLowerCase();
  const correctOpts=q.options.filter(o=>q.correct.some(c=>o.startsWith(c+'.')));
  for(const [pattern,answer] of EXAM_PATTERNS){if(stemLc.match(pattern)) return answer+'. This matches the key concept tested.';}
  const correctSvcs=[];
  for(const opt of correctOpts){const text=opt.replace(/^[A-E]\.\s*/,'');for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){correctSvcs.push({name:key,desc:SVC[key]});break;}}}
  if(correctSvcs.length>0) return correctSvcs.map(s=>`${s.name} is ${s.desc}`).join('. ')+'.';
  return `The correct answer is ${correctOpts.map(o=>o.replace(/^[A-E]\.\s*/,'')).join(', ')}. This best matches the question requirement.`;
}
function genWrongRationale(q){
  if(q.wrongRationale&&Object.keys(q.wrongRationale).length>0) return q.wrongRationale;
  const result={};
  q.options.filter(o=>!q.correct.some(c=>o.startsWith(c+'.'))).forEach(opt=>{
    const letter=opt.charAt(0);const text=opt.replace(/^[A-E]\.\s*/,'');
    let desc=null;for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){desc=`${key} is ${SVC[key]}`;break;}}
    result[letter]=desc?desc+'. It does not match what the question asks for.':text+' does not address the specific requirement.';
  });
  return result;
}
function getRationale(q){return genRationale(q);}
function getWrongRationale(q){return genWrongRationale(q);}

function recordAnswer(qid,chosen,correct){
  if(!progress[qid]) progress[qid]={interval:0,nextDue:0,correct:0,attempts:0};
  const p=progress[qid];p.attempts++;const now=Date.now();
  if(correct){p.correct++;const idx=Math.min((p.interval||0)+1,INTERVALS.length-1);p.interval=idx;p.nextDue=now+INTERVALS[idx]*86400000;addXP(10);}
  else{
    p.interval=0;p.nextDue=now+INTERVALS[0]*86400000;addXP(2);
    const q=getQ(qid);
    if(q&&chosen.length===1&&q.correct.length===1){

      if(!confusions[ck]) confusions[ck]={count:0,lastSeen:0,aLabel:cl,bLabel:rl};

    }
  }
  saveAll();
}

function ringHTML(pct,color,size=80,stroke=8){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const dash=(pct/100)*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"
      style="filter:drop-shadow(0 0 6px ${color});transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function startLiveCountdown(){

    if(dEl) dEl.textContent=d;
  },1000);
}

          <span style="font-weight:800;color:${pct>=80?'var(--ok)':pct>=60?'var(--gold)':'var(--red)'}">${pct}%</span>
        </div>
        <div class="progress-wrap" style="height:7px"><div class="progress-fill" style="width:${pct}%;height:7px;background:linear-gradient(90deg,${color},${color}99)"></div></div>
      </div>`;}).join('')}

  }

  <div class="glass-card gold-card" style="margin-bottom:1.25rem">
    <h2>Establish your baseline</h2>
    <p class="muted" style="margin-bottom:1rem;font-size:.88rem">40 questions across all 4 domains. Takes ~60 minutes. Unlocks your personalised study plan.</p>
    <div class="grid-4" style="margin-bottom:1rem">
      <div class="stat"><div class="stat-num">40</div><div class="stat-label">Questions</div></div>
      <div class="stat"><div class="stat-num">60</div><div class="stat-label">Min</div></div>
      <div class="stat"><div class="stat-num">4</div><div class="stat-label">Domains</div></div>
      <div class="stat"><div class="stat-num">1×</div><div class="stat-label">Per 7 days</div></div>
    </div>
    <button class="btn btn-primary" onclick="startDiagnostic()">Begin Diagnostic →</button>
  </div>`;
}
function startDiagnostic(){
  const counts={'Cloud Concepts':10,'Security and Compliance':12,'Cloud Technology and Services':14,'Billing, Pricing and Support':4};
  let qs=[];DOMAINS.forEach(d=>qs=qs.concat(shuffle(window.QUESTIONS.filter(q=>q.domain===d)).slice(0,counts[d])));
  runQuiz(shuffle(qs),'diagnostic',onDiagnosticComplete);
}
function onDiagnosticComplete(results){
  const scores={};DOMAINS.forEach(d=>scores[d]={correct:0,total:0});
  results.forEach(r=>{const q=getQ(r.qid);if(!q)return;scores[q.domain].total++;if(r.correct)scores[q.domain].correct++;});
  const dp={};DOMAINS.forEach(d=>dp[d]=scores[d].total?Math.round(scores[d].correct/scores[d].total*100):0);
  diagnostic={score:Math.round(results.filter(r=>r.correct).length/results.length*100),scores:dp,date:Date.now(),total:results.length};
  saveAll();navigate('diagnostic');
}

function renderPracticeExams(){
  const examSources={};
  window.QUESTIONS.forEach(q=>{if(q.source){const m=q.source.match(/exam-(\d+)/);if(m){const n=parseInt(m[1]);if(!examSources[n])examSources[n]={num:n,questions:[],attempted:0,correct:0};examSources[n].questions.push(q);const p=progress[q.id];if(p&&p.attempts>0){examSources[n].attempted++;examSources[n].correct+=p.correct;}}}});
  const exams=Object.values(examSources).sort((a,b)=>a.num-b.num);
  if(exams.length===0) return `<div class="card-sm"><p class="muted">No practice exams loaded.</p></div>`;
  return `<div class="card-sm" style="margin-bottom:1rem"><h2>Practice Exams 1–${exams.length}</h2><p class="muted" style="font-size:.85rem">${window.EXTERNAL_QUESTIONS?window.EXTERNAL_QUESTIONS.length:0} questions across ${exams.length} exams.</p></div>
  <div class="grid-2">
    ${exams.map(e=>{const acc=e.attempted>0?Math.round(e.correct/e.attempted*100):null;return `<div class="card-sm">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem"><span style="font-weight:800">Exam ${e.num}</span>${acc!==null?`<span style="font-weight:800;color:${acc>=80?'var(--ok)':acc>=60?'var(--gold)':'var(--red)'}">${acc}%</span>`:''}</div>
      <div class="muted" style="margin-bottom:.5rem">${e.questions.length} questions</div>
      <button class="btn btn-primary btn-sm" onclick="startPracticeExam(${e.num})">Start Exam ${e.num} →</button>
    </div>`;}).join('')}
  </div>`;
}
function startPracticeExam(num){
  const qs=shuffle(window.QUESTIONS.filter(q=>q.source&&q.source.includes(`exam-${num}`)));
  if(!qs.length){toast('No questions found.','err');return;}
  runQuiz(qs,'practice',onPracticeComplete);
}

function renderUniverse(){
  return `<div class="section-header"><h1>🌌 AWS Cloud Map</h1><span class="muted">Every service with a story — click any card to see the full memory hook</span></div>
  <div style="margin-bottom:1rem;padding:.75rem 1rem;background:rgba(255,153,0,0.08);border:1px solid rgba(255,153,0,0.2);border-radius:14px;font-size:.82rem;color:var(--gold)">
    💡 <strong>How to use this:</strong> Read the hook (bold phrase), then read the story. The hook is what you remember in the exam. The story is WHY it makes sense.
  </div>
  ${DOMAINS.map(d=>`<div class="glass-card animate-in" style="margin-bottom:1rem;border-color:${DOMAIN_COLOR[d]}25">
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem">
      <span style="font-size:1.3rem">${DOMAIN_EMOJI[d]}</span>
      <span class="badge ${DOMAIN_BADGE[d]}">${DOMAIN_SHORT[d]}</span>
      <span style="font-size:.9rem;font-weight:700">${d}</span>
      <span style="font-size:.7rem;color:var(--muted);margin-left:auto">${(SERVICE_CARDS[d]||[]).length} services</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.65rem">
      ${(SERVICE_CARDS[d]||[]).map(c=>`<div class="service-card" style="border-color:${DOMAIN_COLOR[d]}20" onclick="this.classList.toggle('expanded')" title="Click to see story">
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem">
          <span style="font-size:1.5rem">${c.emoji}</span>
          <span style="font-weight:800;font-size:.88rem">${c.name}</span>
        </div>
        <div style="font-size:.72rem;color:${DOMAIN_COLOR[d]};font-weight:700;margin-bottom:.35rem;line-height:1.4">${c.hook}</div>
        ${c.story?`<div class="service-story" style="font-size:.7rem;color:var(--muted);line-height:1.55;padding-top:.35rem;border-top:1px solid rgba(255,255,255,0.06);margin-top:.1rem">${c.story}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`).join('')}`;
}

les instead of access keys?',a:'IAM Roles provide temporary credentials that AWS rotates automatically. Access keys can be leaked in code, logs, or git repos. Best practice: always use roles for applications running on AWS.',cat:'Security'}];

let quizState=null;
function startPractice(mode,domain,count){
  let qs;
  if(mode==='due') qs=shuffle(dueItems()).slice(0,30);
  else if(mode==='domain'){const pool=window.QUESTIONS.filter(q=>q.domain===domain);qs=count===0?shuffle(pool):shuffle(pool).slice(0,count);}
  if(!qs||!qs.length){toast('No questions available.','err');return;}
  runQuiz(qs,'practice',onPracticeComplete);
}
function runQuiz(questions,mode,onComplete){
  quizState={questions,mode,idx:0,results:[],onComplete,startTime:Date.now()};
  document.getElementById('main-content').innerHTML=renderQuizQuestion();
  attachQuizListeners();
}
function renderQuizQuestion(){
  const{questions,idx}=quizState,q=questions[idx],isMulti=q.type==='multi';
  const pct=Math.round(idx/questions.length*100);
  return `<div style="margin-bottom:1rem">
    <div class="q-header">
      <div style="display:flex;align-items:center;gap:.4rem">
        <span class="badge ${DOMAIN_BADGE[q.domain]}">${DOMAIN_SHORT[q.domain]}</span>
        ${!q.verified?`<span class="badge badge-unverified">unverified</span>`:''}
      </div>
      <span class="muted" style="font-size:.85rem;font-weight:600">${idx+1} / ${questions.length}</span>
    </div>
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  ${isMulti?`<div class="card-sm card-accent" style="margin-bottom:.7rem;font-size:.83rem">✋ Select <strong>all correct answers</strong> then click Submit.</div>`:''}
  <div class="card animate-in" id="quiz-card">
    <div class="q-stem">${q.stem}</div>
    <div class="options-list" id="options-list">
      ${q.options.map((o,i)=>`<button class="opt-btn animate-opt" data-opt="${String.fromCharCode(65+i)}" style="animation-delay:${i*0.06}s" ${isMulti?'data-multi="1"':''}>${o}</button>`).join('')}
    </div>
    ${isMulti?`<button class="btn btn-primary" id="submit-multi" style="margin-top:.7rem;display:none" disabled>Submit Answer</button>`:''}
  </div>
  <div id="rationale-area"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:1rem" id="next-wrap"></div>`;
}
function attachQuizListeners(){
  const{questions,idx}=quizState,q=questions[idx],isMulti=q.type==='multi';
  const opts=document.querySelectorAll('.opt-btn'),submitBtn=document.getElementById('submit-multi');
  if(isMulti){
    opts.forEach(btn=>{btn.addEventListener('click',()=>{btn.classList.toggle('selected');const any=document.querySelectorAll('.opt-btn.selected').length>0;if(submitBtn){submitBtn.style.display='';submitBtn.disabled=!any;}});});
    if(submitBtn) submitBtn.addEventListener('click',()=>submitQuizAnswer(Array.from(document.querySelectorAll('.opt-btn.selected')).map(b=>b.dataset.opt)));
  } else {opts.forEach(btn=>{btn.addEventListener('click',()=>submitQuizAnswer([btn.dataset.opt]));});}
}
function submitQuizAnswer(chosen){
  const{questions,idx}=quizState,q=questions[idx];
  const isCorrect=arraysEqual(chosen.sort(),q.correct.slice().sort());
  recordAnswer(q.id,chosen,isCorrect);
  quizState.results.push({qid:q.id,correct:isCorrect,chosen});
  document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;const letter=b.dataset.opt;
    if(q.correct.includes(letter)) b.classList.add('reveal-correct');
    if(chosen.includes(letter)&&!q.correct.includes(letter)) b.classList.add('incorrect');
    if(chosen.includes(letter)&&q.correct.includes(letter)) b.classList.add('correct');
  });
  const submitBtn=document.getElementById('submit-multi');if(submitBtn) submitBtn.disabled=true;
  if(isCorrect){const card=document.getElementById('quiz-card');if(card){const r=card.getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top);showXPFloat(10,r.left+r.width/2-20,r.top-10);}}
  const area=document.getElementById('rationale-area');
  if(area){
    const rationale=getRationale(q),wrongRationale=getWrongRationale(q);
    const wrongOpts=q.options.filter(o=>!q.correct.some(c=>o.startsWith(c+'.'))).map(o=>{const letter=o.charAt(0);const exp=wrongRationale[letter]||'';return exp?`<div class="wrong-opt-item"><strong>${o}</strong><br>${exp}</div>`:''}).filter(Boolean).join('');
    const tip=getInterviewTip(q);
    area.innerHTML=`<div class="rationale-box ${isCorrect?'':'wrong'} animate-in">
      <h4 style="color:${isCorrect?'var(--ok)':'var(--red)'}">${isCorrect?'✅ Correct! +10 XP':'❌ Incorrect — +2 XP for trying'}</h4>
      <p>${rationale}</p>
      ${wrongOpts?`<div class="wrong-opts"><div class="label" style="margin:.5rem 0 .3rem">Why the other options are wrong</div>${wrongOpts}</div>`:''}
      ${tip?`<div class="interview-tip"><span class="tip-label">🎤 Interview Connection</span>${tip}</div>`:''}
    </div>`;
  }
  const nextWrap=document.getElementById('next-wrap');
  if(nextWrap){
    if(idx+1<questions.length){nextWrap.innerHTML=`<button class="btn btn-primary" id="btn-next">Next Question →</button>`;document.getElementById('btn-next').addEventListener('click',advanceQuiz);}
    else{nextWrap.innerHTML=`<button class="btn btn-primary" id="btn-finish">View Results →</button>`;document.getElementById('btn-finish').addEventListener('click',finishQuiz);}
  }
}
function getInterviewTip(q){
  const tags=(q.tags||[]).map(t=>t.toLowerCase()).join(' '),stem=q.stem.toLowerCase();
  if(stem.includes('cloudtrail')||tags.includes('cloudtrail')) return 'Interviewers love asking "how would you investigate who deleted that resource?" — answer: CloudTrail logs every API call.';
  if(stem.includes('shared responsibility')||tags.includes('shared responsibility')) return 'Key line: "AWS is responsible for the cloud; I am responsible for what I put IN the cloud."';
  if(stem.includes('iam role')||tags.includes('iam role')) return 'If asked about securing an EC2 app, always say you use an IAM Role — never hard-code access keys.';
  if(stem.includes('high availab')||tags.includes('high availability')) return '"How would you make this highly available?" — multiple AZs, Load Balancer, Auto Scaling, RDS Multi-AZ.';
  if(stem.includes('sqs')||stem.includes('sns')) return '"What is the difference between SQS and SNS?" SQS = one-to-one queue. SNS = one-to-many broadcast.';
  return null;
}

function attachTabListeners(tab){
  if(tab==='practice'||tab==='learn'){
    document.querySelectorAll('#practice-subtabs .sub-tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('#practice-subtabs .sub-tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const stab=btn.dataset.stab,content=document.getElementById('practice-content');
        if(stab==='by-domain') content.innerHTML=renderPracticeByDomain();
        else if(stab==='due') content.innerHTML=renderPracticeDue();
        else if(stab==='exams') content.innerHTML=renderPracticeExams();
        else if(stab==='visuals') content.innerHTML=renderUniverse();
        else if(stab==='keywords') content.innerHTML=renderExamKeywords();
        else if(stab==='terms') content.innerHTML=renderKeyTerms();
        else if(stab==='interview') content.innerHTML=renderInterviewPrep();
        else if(stab==='weakness') content.innerHTML=renderWeaknessDrill();
        else if(stab==='flashcards'){content.innerHTML=renderFlashcards();attachFlashcardListeners();}
      });
    });
  }
  if(tab==='home') startLiveCountdown();
}
function attachFlashcardListeners(){
  const container=document.getElementById('flashcard-container');if(!container) return;
  const pool=JSON.parse(container.dataset.pool);let idx=parseInt(container.dataset.idx)||0;
  const rebuild=()=>{
    const q=getQ(pool[idx]);
    container.innerHTML=renderFlashcardItem(q)+`
    <div style="display:flex;gap:.5rem;margin-top:1rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" id="fc-prev" ${idx===0?'disabled':''}>← Prev</button>
      <span class="muted" style="font-size:.85rem">${idx+1} / ${pool.length}</span>
      <button class="btn btn-secondary btn-sm" id="fc-next" ${idx===pool.length-1?'disabled':''}>Next →</button>
      <button class="btn btn-primary btn-sm" id="fc-flip">🔄 Flip Card</button>
    </div>`;
    attachFlashcardListeners();
  };
  document.getElementById('fc-flip')?.addEventListener('click',flipCard);
  document.getElementById('fc-next')?.addEventListener('click',()=>{if(idx<pool.length-1){idx++;rebuild();}});
  document.getElementById('fc-prev')?.addEventListener('click',()=>{if(idx>0){idx--;rebuild();}});
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function arraysEqual(a,b){if(a.length!==b.length) return false;for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;return true;}

  else if(streak.lastDate===new Date(Date.now()-86400000).toDateString()){streak.count++;streak.lastDate=today;}

})();

  const deck=window.FLASHCARD_DECKS[currentDeck];
  currentCard=Math.max(0,Math.min(deck.cards.length-1,currentCard+dir));
  cardFlipped=false;
  document.getElementById('wfc-container').innerHTML=renderWeekCard(deck,currentCard);
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function jumpWFC(idx){
  currentCard=idx;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function switchDeck(idx){
  currentDeck=idx;currentCard=0;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function shuffleDeck(){
  const deck=window.FLASHCARD_DECKS[currentDeck];
  deck.cards=shuffle(deck.cards);
  currentCard=0;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
  toast('Deck shuffled! 🔀');
}
let _autoFlashInterval=null;
function startAutoFlash(){
  if(_autoFlashInterval){clearInterval(_autoFlashInterval);_autoFlashInterval=null;toast('Auto-play stopped');return;}
  toast('Auto-play: 4s per side ▶');
  _autoFlashInterval=setInterval(()=>{
    if(!cardFlipped){toggleWFC();}
    else{
      const deck=window.FLASHCARD_DECKS[currentDeck];
      if(currentCard<deck.cards.length-1){currentCard++;cardFlipped=false;document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();}
      else{clearInterval(_autoFlashInterval);_autoFlashInterval=null;toast('Deck complete! 🎉','ok');}
    }
  },4000);
}

}

navigate('home');
updateTopbar();
