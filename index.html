.rec-blocks{padding:.5rem 1rem;display:flex;flex-direction:column;gap:.3rem;border-top:1px solid rgba(255,255,255,0.05)}
.rec-block{display:flex;align-items:flex-start;gap:.6rem;padding:.3rem 0}
.rec-block-break{opacity:.55}
.rec-block-min{
  font-size:.62rem;font-weight:900;color:var(--gold);
  background:rgba(233,169,47,0.1);border:1px solid rgba(233,169,47,0.2);
  padding:.12rem .4rem;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:1px;
}
.rec-block-min-break{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--muted)}
.rec-block-task{font-size:.8rem;color:var(--muted);line-height:1.6}

.rec-keywords{
  display:flex;flex-wrap:wrap;gap:.3rem;
  padding:.5rem 1rem .6rem;border-top:1px solid rgba(255,255,255,0.05);
}
.rec-kw{
  font-size:.62rem;font-weight:700;padding:.13rem .42rem;
  border-radius:5px;background:rgba(8,123,255,0.1);
  border:1px solid rgba(8,123,255,0.2);color:var(--blue2);
  transition:all .2s;
}
.rec-kw-clickable{
  cursor:pointer;
}
.rec-kw-clickable:hover{
  background:rgba(8,123,255,0.22);
  border-color:rgba(8,123,255,0.5);
  color:#fff;
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(8,123,255,0.3);
}
  color:#7bbfff;border:1px solid rgba(8,123,255,0.18);
}
.rec-day-goal{
  margin:.4rem 1rem .8rem;padding:.5rem .75rem;
  background:rgba(16,201,149,0.07);border:1px solid rgba(16,201,149,0.15);
  border-radius:var(--radius);font-size:.78rem;color:var(--ok2);line-height:1.5;
}
.progress-wrap{background:rgba(255,255,255,0.06);border-radius:999px;height:5px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px rgba(255,153,0,0.35)}
.progress-fill.ok{background:linear-gradient(90deg,var(--ok),var(--ok2));box-shadow:0 0 8px rgba(34,197,94,0.3)}
.progress-fill.err{background:linear-gradient(90deg,var(--red),var(--red2))}
.timer{font-size:1.2rem;font-weight:900;font-variant-numeric:tabular-nums;padding:.35rem .8rem;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);letter-spacing:.05em}
.timer.warning{color:var(--red);border-color:rgba(239,68,68,0.4);animation:pulse 1s infinite;box-shadow:0 0 16px rgba(239,68,68,0.15)}
.service-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.service-card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 40px rgba(0,0,0,0.5);border-color:var(--border2)}
.service-card:hover .service-story{max-height:200px;opacity:1}
.service-story{max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease}
.service-card.expanded .service-story{max-height:200px;opacity:1}
.service-emoji{font-size:1.8rem;display:block;margin-bottom:.4rem;transition:transform .2s}
.service-name{font-weight:800;font-size:.84rem;margin-bottom:.2rem}
.service-hook{font-size:.7rem;color:var(--muted);line-height:1.4}
.q-grid{display:flex;flex-wrap:wrap;gap:3px;max-height:120px;overflow-y:auto}
.q-dot{width:28px;height:28px;border-radius:7px;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted);border:1.5px solid var(--border);cursor:pointer;transition:all .12s}
.q-dot.answered{background:rgba(59,168,255,0.08);border-color:var(--info);color:var(--info)}
.q-dot.flagged{background:rgba(139,92,246,0.08);border-color:var(--flag);color:var(--flag)}
.q-dot.current{border-color:var(--gold);color:var(--gold);background:rgba(255,153,0,0.1);box-shadow:0 0 8px rgba(255,153,0,0.25)}
.q-dot:hover{transform:scale(1.12)}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;margin-bottom:.65rem;transition:transform .15s}
.review-item:hover{transform:translateX(3px)}
.review-item.rv-correct{border-left:3px solid var(--ok)}
.review-item.rv-wrong{border-left:3px solid var(--red)}
.review-item.rv-skipped{border-left:3px solid var(--muted2)}
.flashcard{perspective:1000px;cursor:pointer;user-select:none}
.flashcard-inner{position:relative;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;min-height:180px}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-lg);padding:1.4rem;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;min-height:180px}
.flashcard-front{background:linear-gradient(135deg,rgba(59,168,255,0.06),rgba(255,255,255,0.02));border-color:rgba(59,168,255,0.14)}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(255,255,255,0.02));border-color:rgba(34,197,94,0.22)}
.confusion-pair{background:var(--card);border-radius:var(--radius);padding:.7rem 1rem;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;transition:border-color .15s}
.confusion-pair:hover{border-color:var(--border2)}
.confusion-services{font-weight:700;font-size:.85rem}
.confusion-count{font-size:.7rem;color:var(--muted)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.compare-col{background:var(--card);border-radius:var(--radius);padding:.9rem;border:1px solid var(--border)}
.compare-col h3{font-size:.85rem;margin-bottom:.45rem}
.compare-col ul{padding-left:1.1rem;font-size:.82rem;color:var(--muted);line-height:1.9}
.kw-row{display:flex;align-items:flex-start;gap:.55rem;padding:.45rem .55rem;border-radius:7px;transition:background .15s}
.kw-row:hover{background:rgba(255,255,255,0.025)}
.kw-code{background:rgba(255,153,0,0.09);border:1px solid rgba(255,153,0,0.18);padding:.18rem .45rem;border-radius:5px;font-size:.68rem;color:var(--gold2);flex-shrink:0;font-family:monospace;max-width:195px;word-break:break-word}
.kw-answer{font-size:.82rem;font-weight:700;color:var(--ok2)}

/* ── TERMINOLOGY GYM v2 ── */
.gym-jump-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.25rem .65rem;border-radius:999px;
  font-size:.68rem;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--muted);
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.gym-cat{transition:border-color .2s,box-shadow .2s}
.gym-row{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.5rem .6rem;
  border-radius:8px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  transition:background .15s,transform .15s;
}
.gym-row:last-child{border-bottom:none}
.gym-row-clickable{cursor:pointer}
.gym-row-clickable:hover{
  background:rgba(255,255,255,0.04);
  transform:translateX(3px);
}
.gym-row-kw{flex:1;min-width:0}
.gym-kw-dots{display:flex;flex-wrap:wrap;gap:.3rem}
.gym-kw-chip{
  display:inline-block;
  font-size:.62rem;font-weight:700;
  padding:.12rem .4rem;border-radius:5px;
  background:rgba(255,153,0,0.08);
  border:1px solid rgba(255,153,0,0.16);
  color:var(--gold2);
  font-family:monospace;
  line-height:1.4;
}
.gym-row-arrow{
  color:rgba(255,255,255,0.2);font-size:.8rem;
  flex-shrink:0;padding-top:.1rem;
}
.gym-row-answer{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
}
.gym-learn-link{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--blue2);font-weight:800;
  padding:.1rem .35rem;border-radius:4px;
  background:rgba(8,123,255,0.1);
  border:1px solid rgba(8,123,255,0.2);
  opacity:.7;
  transition:opacity .15s;
}
.gym-row-clickable:hover .gym-learn-link{opacity:1}
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(5,8,22,0.97);backdrop-filter:blur(20px);color:var(--text);padding:.55rem 1.2rem;border-radius:999px;font-size:.82rem;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap;border:1px solid var(--border2);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.toast-ok{border-color:rgba(34,197,94,0.3)}
.toast.toast-err{border-color:rgba(239,68,68,0.3)}
.xp-float{position:fixed;font-size:.88rem;font-weight:900;color:var(--ok);pointer-events:none;z-index:999;animation:floatUp .9s ease forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(1.4)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotateZ(0deg);opacity:1}100%{transform:translateY(80px) rotateZ(360deg);opacity:0}}
.confetti-piece{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:999;animation:confettiFall .7s ease-out forwards}

/* ═══ PROFILE / ONBOARDING MODAL ══════════════════════════ */
.pmodal-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .25s ease;
}
.pmodal{
  background:linear-gradient(150deg,rgba(8,18,46,0.98),rgba(5,12,30,1));
  border:1px solid rgba(255,153,0,0.25);
  border-radius:24px;
  padding:2.2rem 2.4rem;
  width:min(480px,90vw);
  box-shadow:0 32px 80px rgba(0,0,0,0.8),0 0 60px rgba(255,153,0,0.08);
  animation:slideUp .32s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.pmodal-title{font-size:1.4rem;font-weight:900;margin-bottom:.35rem;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pmodal-sub{font-size:.82rem;color:var(--muted);margin-bottom:1.6rem;line-height:1.6}
.pmodal-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:.5rem}
.pmodal-input{
  width:100%;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;padding:.75rem 1rem;
  color:var(--text);font-size:.95rem;font-weight:700;
  outline:none;transition:border-color .2s;box-sizing:border-box;
}
.pmodal-input:focus{border-color:rgba(255,153,0,0.5);box-shadow:0 0 0 3px rgba(255,153,0,0.1)}
.avatar-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.6rem}
.avatar-opt{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;cursor:pointer;
  border:2px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.04);
  transition:all .18s;
}
.avatar-opt:hover{border-color:rgba(255,153,0,0.4);background:rgba(255,153,0,0.08);transform:scale(1.12)}
.avatar-opt.selected{border-color:var(--gold);background:rgba(255,153,0,0.14);box-shadow:0 0 14px rgba(255,153,0,0.3)}

/* ═══ RING ANIMATION ══════════════════════ */
@keyframes ringDraw{from{stroke-dasharray:0 999}to{stroke-dasharray:var(--dash) var(--circ)}}
.ring-animate circle.fill{animation:ringDraw 1s cubic-bezier(.4,0,.2,1) .2s both}

/* ═══ SHARED ANIMATIONS ═══════════════════ */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideOpt{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes galaxyPulse{0%,100%{box-shadow:0 0 30px rgba(255,153,0,0.3),0 0 60px rgba(255,153,0,0.1)}50%{box-shadow:0 0 50px rgba(255,153,0,0.5),0 0 100px rgba(255,153,0,0.15)}}
@keyframes trophySpin{0%{transform:translateY(-50%) rotate(0deg)}100%{transform:translateY(-50%) rotate(360deg)}}
@keyframes orbitSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes scoreIn{0%{opacity:0;transform:scale(.5) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes starTwinkle{0%,100%{opacity:0.3}50%{opacity:1}}
.animate-in{animation:slideUp .35s ease both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:700;margin-bottom:.7rem;letter-spacing:-.01em}
h3{font-size:.9rem;font-weight:600;margin-bottom:.45rem}
.label{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted);font-size:.82rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;flex-wrap:wrap;gap:.4rem}
/* mission item */
.mission-item{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.82rem}
.mission-item:last-child{border-bottom:none}
.mission-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;cursor:pointer;transition:all .2s}
.mission-check.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* challenge card */
.challenge-card-inner{background:linear-gradient(135deg,#2d1b69,#1e1b4b,#0f0a2a);border:1px solid rgba(139,92,246,0.3);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;position:relative;overflow:hidden}
.challenge-card-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,0.3),transparent)}
.challenge-glow{position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-size:4rem;opacity:.3;animation:trophySpin 6s linear infinite}

/* ═══════════════════════════════════════════
   LAYOUT TOGGLE — PREMIUM
═══════════════════════════════════════════ */
.layout-toggle{
  display:flex;align-items:center;gap:.25rem;
  background:rgba(5,10,28,0.85);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:.25rem;
  margin-bottom:1rem;
  width:fit-content;
  box-shadow:0 4px 20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
}
.layout-btn{
  padding:.35rem 1rem;border-radius:999px;
  font-size:.72rem;font-weight:800;color:var(--muted);
  transition:all .22s cubic-bezier(.4,0,.2,1);cursor:pointer;
  display:flex;align-items:center;gap:.35rem;
  border:none;background:none;letter-spacing:.01em;
}
.layout-btn.active{
  background:linear-gradient(135deg,rgba(233,169,47,0.3),rgba(233,169,47,0.12));
  color:var(--gold2);
  box-shadow:0 0 16px rgba(233,169,47,0.3),inset 0 1px 0 rgba(255,220,100,0.2);
  border:1px solid rgba(233,169,47,0.25);
}
.layout-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.07)}

/* ═══════════════════════════════════════════
   THEME TOGGLE
═══════════════════════════════════════════ */
.theme-toggle{
  display:flex;align-items:center;gap:.35rem;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;padding:.25rem;
  margin-bottom:0;width:fit-content;
}
.theme-btn{
  padding:.28rem .7rem;border-radius:999px;
  font-size:.68rem;font-weight:700;color:var(--muted);
  transition:all .18s;cursor:pointer;
  display:flex;align-items:center;gap:.3rem;
  border:none;background:none;
}
.theme-btn.active{
  background:rgba(255,255,255,0.1);
  color:var(--text);
  box-shadow:0 0 8px rgba(255,255,255,0.1);
}
.theme-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,0.06)}
/* Top controls bar holding both toggles */
.home-controls{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;
}

/* ═══════════════════════════════════════════
   COMMAND CENTER — PREMIUM AWS CONTROL ROOM
═══════════════════════════════════════════ */

/* Animated keyframes for CC */
@keyframes ccBeaconPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ccScanLine{0%{transform:translateY(-100%);opacity:0}10%{opacity:0.4}90%{opacity:0.4}100%{transform:translateY(500%);opacity:0}}
@keyframes ccNumberCount{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccGlassShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes ccRingGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(233,169,47,0.5))}50%{filter:drop-shadow(0 0 16px rgba(233,169,47,0.9))}}
@keyframes ccMetricFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ccParticleOrbit{from{transform:rotate(0deg) translateX(60px)}to{transform:rotate(360deg) translateX(60px)}}
@keyframes ccHeaderBeam{0%{opacity:0;transform:scaleX(0)}30%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
@keyframes ccGridPulse{0%,100%{opacity:0.03}50%{opacity:0.07}}
@keyframes ccCountdownTick{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ── CC WRAPPER (adds grid background overlay) ── */
.cc-wrapper{position:relative;padding-bottom:.5rem}
.cc-wrapper::before{
  content:'';position:absolute;top:0;left:-40px;right:-40px;bottom:0;
  background-image:
    linear-gradient(rgba(8,123,255,0.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(8,123,255,0.028) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;z-index:0;
  animation:ccGridPulse 6s ease-in-out infinite;
  border-radius:0;
}

/* ── CC HEADER ── */
.cc-header{
  position:relative;overflow:hidden;z-index:1;
  border-radius:var(--radius-xl);
  margin-bottom:.85rem;
  padding:0;
  background:linear-gradient(130deg,
    #03091c 0%,
    #050e2a 25%,
    #06142e 50%,
    #03091a 75%,
    #020710 100%);
  border:1px solid rgba(8,123,255,0.28);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.6),
    0 8px 60px rgba(0,0,0,0.7),
    0 0 80px rgba(8,123,255,0.1),
    0 0 160px rgba(233,169,47,0.05),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 0 60px rgba(8,123,255,0.04);
}
/* Top spectral line */
.cc-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;z-index:10;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(8,123,255,0.6) 20%,
    rgba(0,207,255,0.9) 40%,
    rgba(233,169,47,0.9) 60%,
    rgba(255,215,122,0.6) 80%,
    transparent 100%);
  box-shadow:0 0 20px rgba(8,123,255,0.4),0 0 40px rgba(233,169,47,0.2);
}
/* Scan line animation */
.cc-header::after{
  content:'';position:absolute;top:0;left:0;right:0;height:60px;
  background:linear-gradient(180deg,rgba(8,123,255,0.06) 0%,transparent 100%);
  pointer-events:none;z-index:1;
  animation:ccScanLine 8s ease-in-out infinite;
}
/* Grid content inside header */
.cc-header-inner{
  padding:1.4rem 1.75rem;position:relative;z-index:2;
}
.cc-header-grid{
  display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center;
}
@media(max-width:700px){.cc-header-grid{grid-template-columns:1fr}}
.cc-header-eyebrow{
  font-size:.56rem;text-transform:uppercase;letter-spacing:.22em;
  color:var(--blue2);font-weight:900;margin-bottom:.5rem;
  display:flex;align-items:center;gap:.5rem;
}
.cc-header-eyebrow::before{
  content:'';width:24px;height:1px;
  background:linear-gradient(90deg,transparent,var(--blue2));display:inline-block;
}
.cc-header-eyebrow::after{
  content:'';flex:1;max-width:80px;height:1px;
  background:linear-gradient(90deg,var(--blue2),transparent);display:inline-block;
}
.cc-beacon{
  width:6px;height:6px;border-radius:50%;background:var(--green2);
  box-shadow:0 0 10px var(--green2);
  animation:ccBeaconPulse 2s ease-in-out infinite;
  display:inline-block;flex-shrink:0;
}
.cc-header-title{
  font-size:1.75rem;font-weight:900;line-height:1.08;letter-spacing:-.03em;color:#fff;
  margin-bottom:.25rem;text-shadow:0 2px 20px rgba(8,123,255,0.3);
}
.cc-header-title .cc-gold{
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold2) 50%,var(--gold) 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:ccGlassShimmer 4s linear infinite;
  display:block;
}
.cc-header-sub{
  font-size:.78rem;color:rgba(255,255,255,0.45);margin-bottom:1.1rem;
  display:flex;align-items:center;gap:.6rem;
}
.cc-header-sub .cc-dot-sep{
  width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.25);
  display:inline-block;
}
.cc-header-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* RIGHT SIDE: countdown + ring cluster */
.cc-header-right{
  display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;
}
/* Premium countdown block */
.cc-countdown-compact{
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(145deg,rgba(233,169,47,0.1),rgba(180,100,0,0.08));
  border:1px solid rgba(233,169,47,0.3);
  border-radius:18px;padding:1rem 1.5rem;
  min-width:150px;position:relative;overflow:hidden;
  box-shadow:
    0 0 30px rgba(233,169,47,0.1),
    0 4px 24px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,220,100,0.15),
    inset 0 0 30px rgba(233,169,47,0.04);
}
.cc-countdown-compact::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(233,169,47,0.7),transparent);
}
.cc-countdown-compact-eyebrow{
  font-size:.5rem;text-transform:uppercase;letter-spacing:.18em;
  color:rgba(233,169,47,0.6);font-weight:800;margin-bottom:.4rem;
}
.cc-countdown-compact-days{
  font-size:2.8rem;font-weight:900;color:var(--gold);line-height:1;
  letter-spacing:-.05em;text-shadow:0 0 30px rgba(233,169,47,0.5);
  animation:ccCountdownTick 2s ease-in-out infinite;
}
.cc-countdown-compact-label{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--gold2);font-weight:800;margin-top:.2rem;
}
.cc-countdown-compact-date{
  font-size:.62rem;color:rgba(255,255,255,0.35);margin-top:.5rem;font-weight:600;
  background:rgba(0,0,0,0.3);border-radius:999px;padding:.15rem .5rem;
  border:1px solid rgba(255,255,255,0.08);
}
/* CC readiness ring */
.cc-target-ring{
  position:relative;width:96px;height:96px;flex-shrink:0;
}
.cc-target-ring svg{filter:drop-shadow(0 0 12px rgba(233,169,47,0.3))}
.cc-target-ring-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;text-align:center;
}

/* ── CC INTEL CARDS (metric row of 4) ── */
.cc-intel{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:.75rem;margin-bottom:.85rem;
  position:relative;z-index:1;
}
@media(max-width:950px){.cc-intel{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.cc-intel{grid-template-columns:1fr}}

.cc-intel-card{
  background:linear-gradient(150deg,
    rgba(8,16,40,0.98) 0%,
    rgba(5,10,26,0.99) 60%,
    rgba(3,7,18,1) 100%);
  border-radius:18px;padding:1rem 1.1rem;
  border:1px solid rgba(255,255,255,0.08);
  position:relative;overflow:hidden;
  transition:transform .22s cubic-bezier(.4,0,.2,1),box-shadow .22s;
  box-shadow:
    0 4px 30px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.05),
    inset 0 0 40px rgba(0,0,0,0.3);
}
.cc-intel-card:hover{
  transform:translateY(-5px);
  box-shadow:0 16px 50px rgba(0,0,0,0.6),0 0 30px var(--cc-card-glow,rgba(8,123,255,0.15)),inset 0 1px 0 rgba(255,255,255,0.08);
}
/* Top shimmer line per card, colored by accent */
.cc-intel-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cc-card-accent,rgba(8,123,255,0.5)),transparent);
}
/* Inner corner light */
.cc-intel-card::after{
  content:'';position:absolute;top:-30px;right:-30px;
  width:80px;height:80px;border-radius:50%;
  background:var(--cc-card-accent,rgba(8,123,255,0.08));
  filter:blur(20px);pointer-events:none;
}
/* Shimmer on hover */
.cc-intel-card-shine{
  position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.025),transparent);
  transition:left .5s;pointer-events:none;
}
.cc-intel-card:hover .cc-intel-card-shine{left:150%}

.cc-intel-icon-wrap{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:.7rem;
  position:relative;overflow:hidden;
  flex-shrink:0;
}
.cc-intel-icon-wrap img{width:28px;height:28px;object-fit:contain;position:relative;z-index:1}
.cc-intel-icon-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,0.1),transparent 60%);
  border-radius:inherit;
}
.cc-intel-value{
  font-size:2.2rem;font-weight:900;line-height:1;letter-spacing:-.05em;
  margin-bottom:.18rem;
  animation:ccNumberCount .4s ease both;
}
.cc-intel-label{
  font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);font-weight:800;
}
.cc-intel-sub{font-size:.68rem;color:var(--muted);margin-top:.25rem;font-weight:600}
.cc-intel-bar{
  background:rgba(255,255,255,0.06);border-radius:999px;
  height:4px;margin-top:.7rem;overflow:hidden;
  position:relative;
}
.cc-intel-bar-fill{
  height:100%;border-radius:999px;
  transition:width 1.4s cubic-bezier(.4,0,.2,1) .3s;
}

/* ── CC BODY GRID (chart + domains side by side) ── */
.cc-mid{
  display:grid;grid-template-columns:1.4fr 1fr;
  gap:.75rem;margin-bottom:.85rem;
  position:relative;z-index:1;
}
@media(max-width:750px){.cc-mid{grid-template-columns:1fr}}

/* Score history chart card */
.cc-chart-card{
  background:linear-gradient(150deg,rgba(5,12,30,0.99),rgba(3,8,20,1));
  backdrop-filter:blur(24px);
  border-radius:20px;padding:1.2rem 1.3rem;
  border:1px solid rgba(8,123,255,0.18);
  box-shadow:
    0 4px 40px rgba(0,0,0,0.6),
    0 0 40px rgba(8,123,255,0.06),
    inset 0 1px 0 rgba(8,123,255,0.1),
    inset 0 0 50px rgba(8,123,255,0.02);
  position:relative;overflow:hidden;
}
.cc-chart-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,207,255,0.6),rgba(8,123,255,0.5),transparent);
}
.cc-chart-title{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;
  color:var(--muted);font-weight:800;margin-bottom:.85rem;
  display:flex;align-items:center;gap:.5rem;justify-content:space-between;
}
.cc-chart-title-left{display:flex;align-items:center;gap:.5rem}
.cc-chart-badge{
  display:inline-flex;align-items:center;gap:.25rem;
  background:rgba(8,123,255,0.1);border:1px solid rgba(8,123,255,0.25);
  color:var(--blue2);font-size:.56rem;font-weight:800;
  padding:.18rem .55rem;border-radius:999px;
}
.cc-sparkline{width:100%;height:90px}

/* Domain breakdown card */
.cc-domains-card{
  background:linear-gradient(150deg,rgba(8,16,40,0.99),rgba(5,10,25,1));
  backdrop-filter:blur(24px);
  border-radius:20px;padding:1.2rem 1.3rem;
  border:1px solid rgba(233,169,47,0.18);
  box-shadow:
    0 4px 40px rgba(0,0,0,0.6),
    0 0 40px rgba(233,169,47,0.05),
    inset 0 1px 0 rgba(255,220,100,0.1),
    inset 0 0 50px rgba(233,169,47,0.02);
  position:relative;overflow:hidden;
}
.cc-domains-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,215,122,0.6),rgba(233,169,47,0.5),transparent);
}
.cc-domain-row{
  display:flex;align-items:center;gap:.7rem;
  margin-bottom:.7rem;cursor:pointer;
  padding:.35rem .4rem;border-radius:10px;
  transition:background .15s,transform .15s;
  position:relative;
}
.cc-domain-row:hover{background:rgba(255,255,255,0.04);transform:translateX(3px)}
.cc-domain-row:last-of-type{margin-bottom:0}
.cc-domain-icon-wrap{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
}
.cc-domain-icon-wrap img{width:20px;height:20px;object-fit:contain;position:relative;z-index:1}
.cc-domain-label{font-size:.74rem;font-weight:700;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-domain-track{
  background:rgba(255,255,255,0.07);border-radius:999px;
  height:6px;overflow:hidden;width:65px;flex-shrink:0;
  position:relative;
}
.cc-domain-fill{
  height:100%;border-radius:999px;
  transition:width 1.2s cubic-bezier(.4,0,.2,1) .4s;
  position:relative;
}
.cc-domain-fill::after{
  content:'';position:absolute;top:0;right:0;
  width:8px;height:100%;
  background:inherit;filter:blur(4px);
}
.cc-domain-pct{font-size:.74rem;font-weight:900;min-width:2.8rem;text-align:right;flex-shrink:0}

/* Mock stats mini panel inside domain card */
.cc-mock-mini{
  margin-top:.85rem;
  padding:.75rem .9rem;
  background:rgba(255,255,255,0.025);
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;gap:.7rem;
}
.cc-mock-mini-num{font-size:1.8rem;font-weight:900;color:var(--green);line-height:1;flex-shrink:0}
.cc-mock-mini-text{font-size:.7rem;color:var(--muted);line-height:1.5}
.cc-mock-mini-text strong{color:var(--green2)}

/* ── QUICK ACTION BUTTONS ── */
.cc-actions{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:.7rem;margin-bottom:.85rem;
  position:relative;z-index:1;
}
@media(max-width:700px){.cc-actions{grid-template-columns:repeat(2,1fr)}}

.cc-action-btn{
  background:linear-gradient(150deg,rgba(8,16,40,0.98),rgba(4,9,24,1));
  border-radius:18px;padding:1rem .85rem;
  border:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1);
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);
}
/* Bottom color stripe */
.cc-action-btn::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;
  background:var(--cc-color,rgba(233,169,47,0.5));
  transform:scaleX(0);transition:transform .25s;
  box-shadow:0 0 10px var(--cc-color,rgba(233,169,47,0.4));
}
/* Top corner glow */
.cc-action-btn::after{
  content:'';position:absolute;top:-20px;right:-20px;
  width:60px;height:60px;border-radius:50%;
  background:var(--cc-color,rgba(233,169,47,0.08));
  filter:blur(16px);pointer-events:none;
  opacity:0;transition:opacity .25s;
}
.cc-action-btn:hover{transform:translateY(-5px);border-color:rgba(255,255,255,0.14)}
.cc-action-btn:hover::before{transform:scaleX(1)}
.cc-action-btn:hover::after{opacity:1}
.cc-action-img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
.cc-action-label{font-size:.68rem;font-weight:800;color:var(--text)}
.cc-action-count{
  font-size:.62rem;font-weight:800;
  padding:.14rem .5rem;border-radius:999px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--muted);
}

/* ── EXAM COUNTDOWN STRIP ── */
.cc-countdown{
  background:linear-gradient(100deg,
    rgba(233,169,47,0.1) 0%,
    rgba(180,100,0,0.07) 40%,
    rgba(128,85,245,0.08) 100%);
  border:1px solid rgba(233,169,47,0.25);
  border-radius:var(--radius-lg);
  padding:.9rem 1.4rem;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:.6rem;
  margin-bottom:.85rem;
  box-shadow:
    0 0 30px rgba(233,169,47,0.07),
    inset 0 1px 0 rgba(255,220,100,0.1);
  position:relative;overflow:hidden;
}
.cc-countdown::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(233,169,47,0.6),transparent);
}
.cc-countdown-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.15em;color:var(--gold2);font-weight:900}
.cc-countdown-days{font-size:1.9rem;font-weight:900;color:var(--gold);letter-spacing:-.04em;line-height:1;text-shadow:0 0 20px rgba(233,169,47,0.4)}
.cc-countdown-sub{font-size:.64rem;color:var(--muted);margin-top:2px}
.cc-countdown-right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.cc-countdown-pill{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(5,10,28,0.8);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:.4rem .75rem;min-width:3.5rem;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05),0 0 10px rgba(0,0,0,0.3);
}
.cc-countdown-num{font-size:1.2rem;font-weight:900;line-height:1;color:var(--text);letter-spacing:-.02em}
.cc-countdown-unit{font-size:.5rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:2px;font-weight:700}

/* ── CC BRIEF pill (status indicator) ── */
.cc-brief-pill{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.7rem;font-weight:800;
  padding:.35rem .9rem;border-radius:999px;white-space:nowrap;
  backdrop-filter:blur(10px);
}
.cc-brief-pill.on-track{
  background:rgba(16,201,149,0.12);border:1px solid rgba(16,201,149,0.3);
  color:var(--green2);box-shadow:0 0 12px rgba(16,201,149,0.15);
}
.cc-brief-pill.needs-work{
  background:rgba(233,169,47,0.12);border:1px solid rgba(233,169,47,0.3);
  color:var(--gold2);box-shadow:0 0 12px rgba(233,169,47,0.15);
}
/* ═══════════════════════════════════════════
   PREMIUM 3D STAT CARD WAVES
═══════════════════════════════════════════ */
.stat-card{position:relative;overflow:hidden}
.stat-card .sc-wave{
  position:absolute;bottom:-2px;left:0;right:0;
  height:52px;pointer-events:none;opacity:.18;
}
.stat-card:hover .sc-wave{opacity:.32;transition:opacity .3s}
.sc-icon-wrap{
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  transition:transform .2s,box-shadow .2s;
}
.stat-card:hover .sc-icon-wrap{transform:translateY(-3px) scale(1.1);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.sc-icon-wrap.gold-wrap{
  background:linear-gradient(145deg,rgba(255,200,80,0.25),rgba(255,120,0,0.15));
  border:1px solid rgba(255,153,0,0.4);
  box-shadow:0 4px 16px rgba(255,153,0,0.3),inset 0 1px 0 rgba(255,220,100,0.3);
}
.sc-icon-wrap.amber-wrap{
  background:linear-gradient(145deg,rgba(255,220,100,0.25),rgba(200,120,0,0.15));
  border:1px solid rgba(255,176,32,0.4);
  box-shadow:0 4px 16px rgba(255,176,32,0.3),inset 0 1px 0 rgba(255,230,120,0.3);
}
.sc-icon-wrap.green-wrap{
  background:linear-gradient(145deg,rgba(80,255,160,0.2),rgba(0,150,80,0.15));
  border:1px solid rgba(34,197,94,0.4);
  box-shadow:0 4px 16px rgba(34,197,94,0.3),inset 0 1px 0 rgba(80,255,160,0.3);
}
.sc-icon-wrap.purple-wrap{
  background:linear-gradient(145deg,rgba(180,130,255,0.2),rgba(100,50,200,0.15));
  border:1px solid rgba(139,92,246,0.4);
  box-shadow:0 4px 16px rgba(139,92,246,0.3),inset 0 1px 0 rgba(200,170,255,0.3);
}
/* Inner glow shimmer on card hover */
.stat-card::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);
  transition:left .5s ease;pointer-events:none;
}
.stat-card:hover::after{left:150%}

/* ═══════════════════════════════════════════
   PREMIUM KEY TERMS CARDS
═══════════════════════════════════════════ */
.kt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:.85rem;margin-bottom:1.2rem;
}
@media(max-width:600px){.kt-grid{grid-template-columns:1fr}}
.kt-card{
  background:linear-gradient(145deg,rgba(15,22,50,0.9),rgba(8,13,30,0.95));
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;padding:1rem;
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}
.kt-card:hover{transform:translateY(-4px) scale(1.01)}
.kt-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
}
.kt-card::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);
  transition:left .5s;pointer-events:none;
}
.kt-card:hover::after{left:150%}
.kt-card-top{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.kt-emoji{
  width:42px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);
  transition:transform .2s;
}
.kt-card:hover .kt-emoji{transform:scale(1.15) rotate(-5deg)}
.kt-term{font-size:.88rem;font-weight:800;color:var(--text);line-height:1.2}
.kt-def{font-size:.78rem;color:rgba(255,255,255,0.65);line-height:1.6;margin-bottom:.6rem}
.kt-hook{
  font-size:.72rem;font-weight:700;
  padding:.35rem .65rem;border-radius:8px;
  background:rgba(255,255,255,0.05);
  border-left:3px solid;
  line-height:1.5;
}
.kt-hook-label{font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:2px}

/* ═══════════════════════════════════════════
   PREMIUM FLASHCARDS (opacity swap — works in all browsers)
═══════════════════════════════════════════ */
.flashcard-3d{
  cursor:pointer;
  user-select:none;
  margin-bottom:1rem;
  position:relative;
  min-height:340px;
}
.flashcard-3d-inner{
  position:relative;
  min-height:340px;
  height:340px;
  border-radius:24px;
}
.flashcard-3d:hover .flashcard-3d-inner{
  box-shadow:0 32px 80px rgba(0,0,0,0.6),0 0 60px rgba(59,168,255,0.12);
}
.fc3-face{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border-radius:24px;
  padding:1.8rem 2rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.07);
  overflow-y:auto;overflow-x:hidden;
  transition:opacity .45s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1);
}
.fc3-face::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  pointer-events:none;
}
/* Shimmer overlay on hover */
.fc3-face::after{
  content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);
  transition:left .6s ease;pointer-events:none;
}
.flashcard-3d:hover .fc3-face::after{left:150%}
.fc3-front{
  background:linear-gradient(145deg,#0c1a40,#071226,#040d1e);
  border:1px solid rgba(59,168,255,0.22);
  box-shadow:0 24px 70px rgba(0,0,0,0.55),0 0 40px rgba(59,168,255,0.06) inset;
  opacity:1;
  transform:scale(1);
  z-index:2;
  pointer-events:auto;
}
.fc3-front::before{
  background:linear-gradient(90deg,transparent,rgba(59,168,255,0.4),rgba(0,207,255,0.3),transparent);
}
/* Bottom glow */
.fc3-front .fc3-bottom-glow{
  position:absolute;bottom:0;left:0;right:0;height:80px;
  background:radial-gradient(ellipse at 50% 100%,rgba(59,168,255,0.14),transparent);
  border-radius:0 0 24px 24px;pointer-events:none;
}
.fc3-back{
  background:linear-gradient(145deg,#061a10,#030f09,#020c06);
  border:1px solid rgba(16,201,149,0.28);
  box-shadow:0 24px 70px rgba(0,0,0,0.55),0 0 40px rgba(16,201,149,0.06) inset;
  opacity:0;
  transform:scale(0.96);
  z-index:1;
  pointer-events:none;
}
.fc3-back::before{
  background:linear-gradient(90deg,transparent,rgba(16,201,149,0.4),rgba(52,237,182,0.25),transparent);
}
.fc3-back::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:80px;
  background:radial-gradient(ellipse at 50% 100%,rgba(16,201,149,0.14),transparent);
  pointer-events:none;border-radius:0 0 24px 24px;
}
/* FLIPPED STATE */
.flashcard-3d.flipped .fc3-front{
  opacity:0;
  transform:scale(0.96);
  z-index:1;
  pointer-events:none;
}
.flashcard-3d.flipped .fc3-back{
  opacity:1;

  z-index:2;
  pointer-events:auto;
}
.flashcard-3d.flipped .flashcard-3d-inner{

}
.fc3-domain{

<script>
// Capture hash FIRST before any navigation mutates it
const _bootHash = (location.hash||'').replace('#','').trim();

// ═══════════════════════════════════════════════════════════════
//  SPACE CANVAS — deep nebula, waves + stars
// ═══════════════════════════════════════════════════════════════
(function(){
  const c=document.getElementById('space-canvas');
  const ctx=c.getContext('2d');
  let stars=[],wave1t=0,wave2t=0,wave3t=0;

  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;initStars();}

  function initStars(){
    stars=[];
    // Deep background stars (small, dim)
    for(let i=0;i<180;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*.9+.1,a:Math.random()*.4+.05,twinkle:Math.random()*Math.PI*2,speed:Math.random()*.012+.003,layer:0});
    }
    // Mid stars
    for(let i=0;i<60;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.4,a:Math.random()*.6+.1,twinkle:Math.random()*Math.PI*2,speed:Math.random()*.02+.006,layer:1});
    }
    // Foreground bright stars
    for(let i=0;i<15;i++){
      stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+1,a:Math.random()*.9+.3,twinkle:Math.random()*Math.PI*2,speed:Math.random()*.03+.01,layer:2});
    }
  }

  window.addEventListener('resize',resize);resize();

  function drawWave(y,amp,freq,speed,t,r,g,b,alpha){
    ctx.beginPath();
    ctx.moveTo(0,c.height);
    for(let x=0;x<=c.width;x+=4){
      const y1=y+Math.sin((x*freq)+t)*amp+Math.sin((x*freq*.7)+t*1.3)*amp*.4;
      ctx.lineTo(x,y1);
    }
    ctx.lineTo(c.width,c.height);
    ctx.closePath();
    const grad=ctx.createLinearGradient(0,y-amp,0,c.height);
    grad.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grad;
    ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);

    // Layered nebula glows
    const n1=ctx.createRadialGradient(c.width*.12,c.height*.2,0,c.width*.12,c.height*.2,c.width*.38);
    n1.addColorStop(0,'rgba(8,123,255,0.07)');n1.addColorStop(.5,'rgba(8,123,255,0.03)');n1.addColorStop(1,'transparent');
    ctx.fillStyle=n1;ctx.fillRect(0,0,c.width,c.height);

    const n2=ctx.createRadialGradient(c.width*.88,c.height*.72,0,c.width*.88,c.height*.72,c.width*.32);
    n2.addColorStop(0,'rgba(233,169,47,0.06)');n2.addColorStop(.6,'rgba(233,169,47,0.02)');n2.addColorStop(1,'transparent');
    ctx.fillStyle=n2;ctx.fillRect(0,0,c.width,c.height);

    const n3=ctx.createRadialGradient(c.width*.5,c.height*.5,0,c.width*.5,c.height*.5,c.width*.28);
    n3.addColorStop(0,'rgba(128,85,245,0.04)');n3.addColorStop(1,'transparent');
    ctx.fillStyle=n3;ctx.fillRect(0,0,c.width,c.height);

    const n4=ctx.createRadialGradient(c.width*.7,c.height*.15,0,c.width*.7,c.height*.15,c.width*.25);
    n4.addColorStop(0,'rgba(0,207,255,0.04)');n4.addColorStop(1,'transparent');
    ctx.fillStyle=n4;ctx.fillRect(0,0,c.width,c.height);

    // Animated depth waves — 3 layers, different speeds
    wave1t+=0.004;
    wave2t+=0.007;
    wave3t+=0.0025;
    // Deep wave (blue, slowest)
    drawWave(c.height*.72,c.height*.04,0.008,1,wave3t,8,80,180,0.06);
    // Mid wave (blue-purple)
    drawWave(c.height*.8,c.height*.035,0.011,1,wave2t,0,100,220,0.055);
    // Foreground wave (gold tint)
    drawWave(c.height*.88,c.height*.025,0.014,1,wave1t,180,120,30,0.04);

    // Stars
    stars.forEach(s=>{
      s.twinkle+=s.speed;
      const a=s.a*(0.5+0.5*Math.sin(s.twinkle));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      if(s.layer===2){
        // Bright stars get a subtle glow
        const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
        sg.addColorStop(0,`rgba(200,220,255,${a})`);
        sg.addColorStop(1,'transparent');
        ctx.fillStyle=sg;
        ctx.arc(s.x,s.y,s.r*4,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      }
      ctx.fillStyle=`rgba(241,245,255,${a})`;ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

function genRationale(q){
  if(q.rationale&&q.rationale.length>10) return q.rationale;
  const stemLc=q.stem.toLowerCase();
  const correctOpts=q.options.filter(o=>q.correct.some(c=>o.startsWith(c+'.')));
  for(const [pattern,answer] of EXAM_PATTERNS){if(stemLc.match(pattern)) return answer+'. This matches the key concept tested.';}
  const correctSvcs=[];
  for(const opt of correctOpts){const text=opt.replace(/^[A-E]\.\s*/,'');for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){correctSvcs.push({name:key,desc:SVC[key]});break;}}}
  if(correctSvcs.length>0) return correctSvcs.map(s=>`${s.name} is ${s.desc}`).join('. ')+'.';
  return `The correct answer is ${correctOpts.map(o=>o.replace(/^[A-E]\.\s*/,'')).join(', ')}. This best matches the question requirement.`;
}
function genWrongRationale(q){
  if(q.wrongRationale&&Object.keys(q.wrongRationale).length>0) return q.wrongRationale;
  const result={};
  q.options.filter(o=>!q.correct.some(c=>o.startsWith(c+'.'))).forEach(opt=>{
    const letter=opt.charAt(0);const text=opt.replace(/^[A-E]\.\s*/,'');
    let desc=null;for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){desc=`${key} is ${SVC[key]}`;break;}}
    result[letter]=desc?desc+'. It does not match what the question asks for.':text+' does not address the specific requirement.';
  });
  return result;
}
function getRationale(q){return genRationale(q);}
function getWrongRationale(q){return genWrongRationale(q);}

function getQ(id){return window.QUESTIONS.find(q=>q.id===id);}
function domainAccuracy(domain){
  const qs=window.QUESTIONS.filter(q=>q.domain===domain);
  let c=0,t=0;qs.forEach(q=>{const p=progress[q.id];if(p&&p.attempts>0){t+=p.attempts;c+=p.correct;}});
  return t===0?null:Math.round(c/t*100);
}
function overallAccuracy(){let c=0,t=0;Object.values(progress).forEach(p=>{if(p.attempts>0){t+=p.attempts;c+=p.correct;}});return t===0?null:Math.round(c/t*100);}
function dueItems(){
  const now=Date.now();
  return window.QUESTIONS.filter(q=>{const p=progress[q.id];if(!p)return true;if(p.interval===INTERVALS.length-1&&p.correct>0)return false;return now>=p.nextDue;});
}
function recordAnswer(qid,chosen,correct){
  if(!progress[qid]) progress[qid]={interval:0,nextDue:0,correct:0,attempts:0};
  const p=progress[qid];p.attempts++;const now=Date.now();
  if(correct){p.correct++;const idx=Math.min((p.interval||0)+1,INTERVALS.length-1);p.interval=idx;p.nextDue=now+INTERVALS[idx]*86400000;addXP(10);}
  else{
    p.interval=0;p.nextDue=now+INTERVALS[0]*86400000;addXP(2);
    const q=getQ(qid);
    if(q&&chosen.length===1&&q.correct.length===1){
      const cl=q.options.find(o=>o.startsWith(chosen[0]+'.'))?.replace(/^[A-D]\.\s*/,'')||chosen[0];
      const rl=q.options.find(o=>o.startsWith(q.correct[0]+'.'))?.replace(/^[A-D]\.\s*/,'')||q.correct[0];
      const ck=`${cl}|${rl}`;
      if(!confusions[ck]) confusions[ck]={count:0,lastSeen:0,aLabel:cl,bLabel:rl};
      confusions[ck].count++;confusions[ck].lastSeen=now;
    }
  }
  save('clf_progress',progress); // immediate save of the most critical data
  saveAll();
}

let currentTab='home';

function navigate(tab){
  currentTab=tab;
  // Persist current page in URL hash so reload returns here
  try{ location.hash = tab; }catch(e){}
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const el=document.getElementById('main-content');
  el.style.opacity='0';el.style.transform='translateY(8px)';
  setTimeout(()=>{
    if(tab==='home') el.innerHTML=renderHome();
    else if(tab==='diagnostic'||tab==='interview prep') el.innerHTML=renderDiagnosticMenu();
    else if(tab==='learn') el.innerHTML=renderLearnHub();
    else if(tab==='practice') el.innerHTML=renderPracticeMenu();
    else if(tab==='mock') el.innerHTML=renderMockMenu();
    else if(tab==='progress') el.innerHTML=renderProgress();
    else if(tab==='achievements') el.innerHTML=renderAchievements();
    else if(tab==='flashcards'){el.innerHTML=renderPracticeMenu();setTimeout(()=>switchPracticeTab('flashcards'),50);}
    else if(tab==='terminology') el.innerHTML=renderTerminologyGym();
    else if(tab==='universe'||tab==='architecture lab') el.innerHTML=renderUniverse();
    else if(tab==='games') el.innerHTML=renderGamesArena();
    else if(tab==='settings') el.innerHTML=renderSettings();
    else if(tab==='roadmap') el.innerHTML=renderStudyRoadmap();
    else if(tab==='recommendation') el.innerHTML=renderRecommendation();
    else if(tab==='weekly-flashcards') el.innerHTML=renderWeeklyFlashcards();
    else el.innerHTML=renderHome();
    el.style.opacity='1';el.style.transform='translateY(0)';el.style.transition='opacity .22s,transform .22s';
    attachTabListeners(tab==='flashcards'||tab==='terminology'?'practice':tab);
  },75);
}
// Deep-link navigation with anchor scrolling
function navigateTo(tab, anchor){
  navigate(tab);
  if(anchor){
    setTimeout(()=>{
      const target=document.getElementById(anchor);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    },150);
  }
}
function switchPracticeTab(stab){
  document.querySelectorAll('#practice-subtabs .sub-tab').forEach(b=>b.classList.toggle('active',b.dataset.stab===stab));
  const content=document.getElementById('practice-content');
  if(!content) return;
  if(stab==='flashcards'){content.innerHTML=renderFlashcards();attachFlashcardListeners();}
  else if(stab==='terms') content.innerHTML=renderKeyTerms();
}

document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab) navigate(b.dataset.tab);}));

// ═══════════════════════════════════════════════════════════════
//  SVG RING HELPER
// ═══════════════════════════════════════════════════════════════
function ringHTML(pct,color,size=80,stroke=8){
  const r=(size-stroke)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const dash=(pct/100)*circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"
      style="filter:drop-shadow(0 0 6px ${color});transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function renderHome(){
  const days=daysLeft(),due=dueItems().length,overall=overallAccuracy();
  const mockCount=history.filter(h=>h.mode==='mock').length;
  const totalAttempted=Object.values(progress).filter(p=>p.attempts>0).length;
  const domainsPracticed=DOMAINS.filter(d=>domainAccuracy(d)!==null).length;
  let score=0;
  if(totalAttempted>0){
    if(mockCount===0) score=Math.min(100,Math.round((overall||0)*.7+(domainsPracticed/4)*30));
    else{const mocks=history.filter(h=>h.mode==='mock');const avg=Math.round(mocks.slice(-3).reduce((s,m)=>s+m.score,0)/Math.min(mocks.length,3));score=Math.min(100,Math.round((overall||0)*.25+avg*.5+(domainsPracticed/4)*25));}
  }
  const toggleHTML=`
  <div class="home-controls">
    <div class="layout-toggle">
      <button class="layout-btn${homeLayout==='classic'?' active':''}" onclick="switchHomeLayout('classic')">◉ Classic</button>
      <button class="layout-btn${homeLayout==='command'?' active':''}" onclick="switchHomeLayout('command')">⬡ Command</button>
    </div>
    <div class="theme-toggle">
      <button class="theme-btn${appTheme==='default'?' active':''}" onclick="switchTheme('default')" title="Space Blue">🌌</button>
      <button class="theme-btn${appTheme==='green'?' active':''}" onclick="switchTheme('green')" title="Midnight Green">🟢</button>
      <button class="theme-btn${appTheme==='purple'?' active':''}" onclick="switchTheme('purple')" title="Deep Purple">🟣</button>
    </div>
  </div>`;
  if(homeLayout==='command') return toggleHTML+renderHomeCommandCenter(days,due,overall,mockCount,totalAttempted,domainsPracticed,score);
  return toggleHTML+renderHomeClassic(days,due,overall,mockCount,totalAttempted,domainsPracticed,score);
}

function renderHomeCommandCenter(days,due,overall,mockCount,totalAttempted,domainsPracticed,score){
  const scoreColor=score>=90?'#22C55E':score>=70?'#FF9900':'#EF4444';
  const scoreColorRgb=score>=90?'34,197,94':score>=70?'255,153,0':'239,68,68';
  const mockScores=history.filter(h=>h.mode==='mock');
  const mockBest=mockScores.length>0?Math.max(...mockScores.map(m=>m.score)):null;
  const mockAvg=mockScores.length>0?Math.round(mockScores.slice(-5).reduce((s,m)=>s+m.score,0)/Math.min(mockScores.length,5)):0;
  const totalQs=window.QUESTIONS.length;
  const dueCount=dueItems().length;
  const today=new Date().toDateString();
  if(missions.date!==today){missions={date:today,done:[]};save('clf_missions',missions);}
  const xpInLevel=xp%200;
  const level=Math.floor(xp/200)+1;

  // Score history data — last 7 mock scores or simulated ramp
  const sparkData=mockScores.length>=2
    ? mockScores.slice(-7).map(m=>m.score)
    : [0,0,0,0,score?Math.round(score*.4):0,score?Math.round(score*.7):0,score];
  const sparkMax=Math.max(...sparkData,10);
  const sparkMin=Math.min(...sparkData.filter(v=>v>0),0);
  const sparkH=70,sparkW=240;

  // Build smooth SVG path (using cubic bezier segments)
  function smoothPath(pts,w,h){
    const xs=pts.map((_,i)=>i/(pts.length-1)*w);
    const ys=pts.map(v=>h-((v-sparkMin)/(sparkMax-sparkMin||1))*h);
    if(pts.length<2) return '';
    let d=`M${xs[0]},${ys[0]}`;
    for(let i=0;i<xs.length-1;i++){
      const cpx=(xs[i]+xs[i+1])/2;
      d+=` C${cpx},${ys[i]} ${cpx},${ys[i+1]} ${xs[i+1]},${ys[i+1]}`;
    }
    return d;
  }
  const linePath=smoothPath(sparkData,sparkW,sparkH);
  const areaPath=linePath.replace(`M${0},${sparkH-((sparkData[0]-sparkMin)/(sparkMax-sparkMin||1))*sparkH}`,`M0,${sparkH}`)
    +` L${sparkW},${sparkH} Z`;
  // compute point coordinates for dots
  const sparkXs=sparkData.map((_,i)=>i/(sparkData.length-1)*sparkW);
  const sparkYs=sparkData.map(v=>sparkH-((v-sparkMin)/(sparkMax-sparkMin||1))*sparkH);

  const isOnTrack=score>=70;

  return `
  <div class="cc-wrapper">

            Cloud Operations
            <span class="cc-gold">Command Centre</span>
          </div>
          <div class="cc-header-sub">
            <span>Welcome back, ${displayName()}</span>
            <span class="cc-dot-sep"></span>
            <span>${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</span>
            <span class="cc-dot-sep"></span>
            <span class="cc-brief-pill ${isOnTrack?'on-track':'needs-work'}">${isOnTrack?'● On Track':'● Needs Work'}</span>
          </div>
          <div class="cc-header-actions">
            <button class="btn btn-primary" onclick="navigate('mock')" style="font-size:.82rem;padding:.6rem 1.4rem;box-shadow:0 4px 24px rgba(233,169,47,0.5),0 0 40px rgba(233,169,47,0.2)">▶ Start Mock Exam</button>

            <button class="btn btn-secondary btn-sm" onclick="startPractice('domain','${DOMAINS[Math.floor(Math.random()*DOMAINS.length)]}',10)" style="border-color:rgba(16,201,149,0.3);color:var(--green2)">⚡ Quick Practice</button>
          </div>
        </div>
        <!-- Right: countdown + readiness ring -->
        <div class="cc-header-right">
          <div class="cc-countdown-compact">
            <div class="cc-countdown-compact-eyebrow">Exam Countdown</div>
            <div class="cc-countdown-compact-days" id="live-days">${days}</div>
            <div class="cc-countdown-compact-label">Days Remaining</div>
            <div class="cc-countdown-compact-date">14 December 2026</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:.45rem">
            <div class="cc-target-ring">
              <svg viewBox="0 0 96 96" width="96" height="96">
                <defs>
                  <linearGradient id="trGrad2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${scoreColor}"/>
                    <stop offset="100%" stop-color="${scoreColor}99"/>
                  </linearGradient>
                  <filter id="ringGlow2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                <!-- Outer track -->
                <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="7"/>
                <!-- Background rings (decorative) -->
                <circle cx="48" cy="48" r="35" fill="none" stroke="rgba(${scoreColorRgb},0.06)" stroke-width="1"/>

                  stroke-dasharray="${Math.round((score/100)*264)} 264"
                  stroke-dashoffset="66" stroke-linecap="round"
                  filter="url(#ringGlow2)"
                  style="transition:stroke-dasharray 1.6s cubic-bezier(.4,0,.2,1) .3s"/>

                <circle cx="48" cy="48" r="35" fill="rgba(${scoreColorRgb},0.06)"/>

                <div style="font-size:1.3rem;font-weight:900;color:${scoreColor};line-height:1;text-shadow:0 0 20px ${scoreColor}80">${score}%</div>

  </div>

  <!-- ═══ INTEL CARDS (4 metrics) ════════════════════════════= -->

      <div class="cc-intel-icon-wrap" style="background:linear-gradient(145deg,rgba(180,130,255,0.2),rgba(100,50,200,0.15));border:1px solid rgba(139,92,246,0.4);box-shadow:0 4px 16px rgba(139,92,246,0.3),inset 0 1px 0 rgba(200,170,255,0.3)">

    <!-- Questions Done -->
    <div class="cc-intel-card" style="--cc-card-accent:rgba(8,123,255,0.5);--cc-card-glow:rgba(8,123,255,0.12)">
      <div class="cc-intel-card-shine"></div>
      <div class="cc-intel-icon-wrap" style="background:linear-gradient(145deg,rgba(8,123,255,0.2),rgba(0,100,200,0.15));border:1px solid rgba(8,123,255,0.4);box-shadow:0 4px 16px rgba(8,123,255,0.3),inset 0 1px 0 rgba(80,180,255,0.3)">

          </defs>
          <!-- Y-axis labels -->
          ${[100,75,50,25,0].map((v,i)=>{
            const gy=16+((100-v)/100)*sparkH;
            return `<text x="1" y="${gy+3}" font-size="7" fill="rgba(255,255,255,0.22)" font-weight="700" text-anchor="start">${v}</text>
                    <line x1="28" y1="${gy}" x2="${sparkW+28}" y2="${gy}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
          }).join('')}
          <!-- 70% pass line -->
          ${(()=>{const py=16+((100-70)/100)*sparkH;return `<line x1="28" y1="${py}" x2="${sparkW+28}" y2="${py}" stroke="rgba(16,201,149,0.35)" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="${sparkW+16}" y="${py-2}" font-size="7" fill="rgba(16,201,149,0.6)" font-weight="700">Pass</text>`;})()}
          <!-- Area + line (offset by 28px for y-axis labels) -->
          <g transform="translate(28,16)">
            <path d="${linePath} L${sparkW},${sparkH} L0,${sparkH} Z" fill="url(#sgArea)"/>
            <path d="${linePath}" fill="none" stroke="${scoreColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#sgGlow)" opacity=".95"/>
            ${sparkYs.map((y,i)=>`
              <circle cx="${sparkXs[i]}" cy="${y}" r="4" fill="${scoreColor}" stroke="rgba(3,8,20,0.9)" stroke-width="2" filter="url(#dotGlow)" opacity=".95"/>
              <text x="${sparkXs[i]}" y="${y-9}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)" font-weight="800">${sparkData[i]}%</text>

          </g>
        </svg>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:.45rem">
        <span style="font-size:.58rem;color:var(--muted)">← Oldest sessions</span>
        <span style="font-size:.58rem;color:var(--muted)">Most recent →</span>

    <!-- Domain Breakdown -->
    <div class="cc-domains-card">
      <div class="cc-chart-title">

      ${DOMAINS.map(d=>{

      <!-- Mock exams summary -->
      <div class="cc-mock-mini">

  <!-- ═══ QUICK ACTIONS ════════════════════════════════════════ -->

//  GALAXY — animated orbital AWS service hub
// ═══════════════════════════════════════════════════════════════
function renderGalaxy(){
  const nodes=[
    {id:'security',img:'aws_learning_galaxy_individual_icons/03-cloud-security.png',label:'Security',  color:'#10C995', domain:'Security and Compliance',       bx:83, by:30, delay:.12},
    {id:'compute', img:'aws_learning_galaxy_individual_icons/01-microchip.png',    label:'Compute',   color:'#087BFF', domain:'Cloud Technology and Services', bx:50, by:12, delay:.05},
    {id:'storage', img:'aws_learning_galaxy_individual_icons/02-cloud-server.png', label:'Storage',   color:'#E9A92F', domain:'Cloud Technology and Services', bx:83, by:65, delay:.19},
    {id:'database',img:'aws_learning_galaxy_individual_icons/06-database.png',     label:'Databases', color:'#B08AFF', domain:'Cloud Technology and Services', bx:50, by:83, delay:.26},
    {id:'network', img:'aws_learning_galaxy_individual_icons/07-network.png',      label:'Networking',color:'#F472B6', domain:'Cloud Concepts',                bx:17, by:65, delay:.33},
    {id:'billing', img:'aws_learning_galaxy_individual_icons/09-analytics.png',    label:'Billing',   color:'#FB923C', domain:'Billing, Pricing and Support',  bx:17, by:30, delay:.40}
  ];

  const gxProgress=galaxyProgress;
  const nodePct=n=>{const d=domainAccuracy(n.domain);return d||gxProgress[n.id]||0;};

  const lines=nodes.map(n=>{
    const pct=nodePct(n);
    const len=Math.sqrt(Math.pow(n.bx-50,2)+Math.pow(n.by-50,2));
    const total=len*2.2;
    const drawn=Math.round(total*(pct/100));
    return `<line x1="50%" y1="50%" x2="${n.bx}%" y2="${n.by}%"
      stroke="${n.color}" stroke-width="0.9" opacity="0.3"
      stroke-dasharray="${drawn} ${Math.round(total)}"
      style="transition:stroke-dasharray 1.4s ease .3s"/>`;
  }).join('');

  const particles=[
    {x:30,y:25,s:3,dur:4.2,d:0,c:'#3BA8FF'},{x:70,y:20,s:2,dur:3.8,d:1.1,c:'#FF9900'},
    {x:85,y:55,s:2.5,dur:5,d:.7,c:'#22C55E'},{x:15,y:60,s:2,dur:4.5,d:2,c:'#A78BFA'},
    {x:55,y:76,s:3,dur:3.5,d:1.5,c:'#F472B6'},{x:40,y:15,s:2,dur:4.8,d:.3,c:'#FB923C'},
  ];

  return `
  <div class="gx-ring r1"></div>
  <div class="gx-ring r2"></div>
  <div class="gx-ring r3"></div>

  <svg class="gx-lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>

  ${particles.map(p=>`<div class="gx-particle" style="left:${p.x}%;top:${p.y}%;width:${p.s}px;height:${p.s}px;background:${p.c};box-shadow:0 0 ${p.s*3}px ${p.c};animation-duration:${p.dur}s;animation-delay:${p.d}s"></div>`).join('')}

  <div class="gx-center" onclick="navigate('universe')" title="Explore AWS Universe">
    <div class="gx-center-logo">aws</div>
    <span class="gx-center-arc"></span>
    <div class="gx-center-label">Cloud Hub</div>
  </div>

  ${nodes.map(n=>{

// Live countdown ticker
function startLiveCountdown(){
  if(window._countdownInterval) clearInterval(window._countdownInterval);
  window._countdownInterval=setInterval(()=>{
    const ms=Math.max(0,EXAM_DATE-new Date());
    const d=Math.ceil(ms/86400000);
    const dEl=document.getElementById('live-days');
    if(dEl) dEl.textContent=d;
  },1000);
}

function startDiagnostic(){
  const counts={'Cloud Concepts':10,'Security and Compliance':12,'Cloud Technology and Services':14,'Billing, Pricing and Support':4};
  let qs=[];DOMAINS.forEach(d=>qs=qs.concat(shuffle(window.QUESTIONS.filter(q=>q.domain===d)).slice(0,counts[d])));
  runQuiz(shuffle(qs),'diagnostic',onDiagnosticComplete);
}
function onDiagnosticComplete(results){
  const scores={};DOMAINS.forEach(d=>scores[d]={correct:0,total:0});
  results.forEach(r=>{const q=getQ(r.qid);if(!q)return;scores[q.domain].total++;if(r.correct)scores[q.domain].correct++;});
  const dp={};DOMAINS.forEach(d=>dp[d]=scores[d].total?Math.round(scores[d].correct/scores[d].total*100):0);
  diagnostic={score:Math.round(results.filter(r=>r.correct).length/results.length*100),scores:dp,date:Date.now(),total:results.length};
  saveAll();navigate('diagnostic');
}

  return `<div class="practice-header"><h1>🎯 Practice</h1></div>
  <div class="sub-tabs" id="practice-subtabs">
    <button class="sub-tab active" data-stab="by-domain">By Domain</button>

    <button class="sub-tab" data-stab="visuals">🗺️ Cloud Map</button>
    <button class="sub-tab" data-stab="keywords">🔑 Exam Keywords</button>
    <button class="sub-tab" data-stab="terms">📖 Key Terms</button>
    <button class="sub-tab" data-stab="interview">🎤 Interview Prep</button>
    <button class="sub-tab" data-stab="due">Due Items</button>
    <button class="sub-tab" data-stab="weakness">🔁 Weakness Drill</button>
    <button class="sub-tab" data-stab="flashcards">🃏 Flashcards</button>
  </div>
  <div id="practice-content">${renderPracticeByDomain()}</div>`;
}
function renderPracticeByDomain(){
  return `<div class="domain-cards-grid">
    ${DOMAINS.map(d=>{
      const acc=domainAccuracy(d);const color=DOMAIN_COLOR[d];
      const count=window.QUESTIONS.filter(q=>q.domain===d).length;
      const attempted=window.QUESTIONS.filter(q=>q.domain===d&&progress[q.id]&&progress[q.id].attempts>0).length;
      const pct=Math.round(attempted/count*100)||0;
      return `<div class="domain-card" style="border-color:${color}30">
        <div class="domain-card-top">
          <div class="domain-card-left">
            <span class="domain-card-icon">${DOMAIN_EMOJI[d]}</span>
            <div>
              <div class="domain-card-name">${d}</div>
              <span class="domain-pill" style="background:${color}22;color:${color};border:1px solid ${color}44">${Math.round(DOMAIN_WEIGHT[d]*100)}% of exam</span>
            </div>
          </div>
          <div class="domain-card-pct" style="color:${acc===null?'var(--muted)':acc>=70?'var(--ok)':acc>=50?'var(--gold)':'var(--red)'}">${acc===null?'0%':acc+'%'}</div>
        </div>
        <div class="domain-card-attempted">${attempted}/${count} attempted</div>
        <div class="domain-progress">
          <div class="domain-progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${color},${color}99);box-shadow:0 0 8px ${color}60"></div>
        </div>
        <div class="domain-card-btns">
          <button class="btn btn-primary btn-sm" onclick="startPractice('domain','${d}',10)">10 Qs</button>
          <button class="btn btn-secondary btn-sm" onclick="startPractice('domain','${d}',20)">20 Qs</button>
          <button class="btn btn-secondary btn-sm" onclick="startPractice('domain','${d}',0)">All</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function renderPracticeExams(){
  const examSources={};
  window.QUESTIONS.forEach(q=>{if(q.source){const m=q.source.match(/exam-(\d+)/);if(m){const n=parseInt(m[1]);if(!examSources[n])examSources[n]={num:n,questions:[],attempted:0,correct:0};examSources[n].questions.push(q);const p=progress[q.id];if(p&&p.attempts>0){examSources[n].attempted++;examSources[n].correct+=p.correct;}}}});
  const exams=Object.values(examSources).sort((a,b)=>a.num-b.num);
  if(exams.length===0) return `<div class="card-sm"><p class="muted">No practice exams loaded.</p></div>`;
  return `<div class="card-sm" style="margin-bottom:1rem"><h2>Practice Exams 1–${exams.length}</h2><p class="muted" style="font-size:.85rem">${window.EXTERNAL_QUESTIONS?window.EXTERNAL_QUESTIONS.length:0} questions across ${exams.length} exams.</p></div>
  <div class="grid-2">
    ${exams.map(e=>{const acc=e.attempted>0?Math.round(e.correct/e.attempted*100):null;return `<div class="card-sm">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem"><span style="font-weight:800">Exam ${e.num}</span>${acc!==null?`<span style="font-weight:800;color:${acc>=80?'var(--ok)':acc>=60?'var(--gold)':'var(--red)'}">${acc}%</span>`:''}</div>
      <div class="muted" style="margin-bottom:.5rem">${e.questions.length} questions</div>
      <button class="btn btn-primary btn-sm" onclick="startPracticeExam(${e.num})">Start Exam ${e.num} →</button>
    </div>`;}).join('')}
  </div>`;
}
function startPracticeExam(num){
  const qs=shuffle(window.QUESTIONS.filter(q=>q.source&&q.source.includes(`exam-${num}`)));
  if(!qs.length){toast('No questions found.','err');return;}
  runQuiz(qs,'practice',onPracticeComplete);
}

const INTERVIEW_QA=[{q:'Walk me through the AWS Shared Responsibility Model.',a:'AWS is responsible for security OF the cloud — the physical hardware, data centres, hypervisor, and global network. I am responsible for security IN the cloud — my data, encryption, IAM policies, OS patches, and network configurations.',cat:'Foundational'},{q:'What is the difference between a Security Group and a Network ACL?',a:'Security Groups are stateful firewalls at the instance level — if I allow inbound traffic, the response is automatically allowed out. They support allow rules only. NACLs are stateless subnet firewalls — I must explicitly allow both inbound and outbound. They support allow AND deny rules.',cat:'Security'},{q:'When would you use S3 vs EBS vs EFS?',a:'S3 for objects — static files, backups, data lakes. EBS for block storage attached to a single EC2. EFS when multiple EC2 instances need to share the same file system simultaneously.',cat:'Storage'},{q:'What is the difference between SQS and SNS?',a:'SQS is a message queue — one message gets processed by one consumer. SNS is a pub/sub notification service — one message fans out to many subscribers simultaneously.',cat:'Messaging'},{q:'Explain EC2 pricing models.',a:'On-Demand: pay per second, no commitment. Reserved: 1 or 3-year commitment, up to 72% off. Spot: spare capacity at up to 90% off, can be interrupted. Savings Plans: commit to $/hour of compute, up to 66% off.',cat:'Billing'},{q:'How would you design a highly available architecture?',a:'Deploy across at least two Availability Zones. Use an Application Load Balancer. Put EC2 in an Auto Scaling Group. Use RDS Multi-AZ. Store static assets in S3 with CloudFront.',cat:'Architecture'},{q:'What is the difference between CloudTrail and CloudWatch?',a:'CloudTrail is an audit log — records every API call: who made it, from where, at what time. CloudWatch is a monitoring service — collects metrics, stores logs, triggers alarms.',cat:'Monitoring'},{q:'Why use IAM Roles instead of access keys?',a:'IAM Roles provide temporary credentials that AWS rotates automatically. Access keys can be leaked in code, logs, or git repos. Best practice: always use roles for applications running on AWS.',cat:'Security'}];
function renderInterviewPrep(){
  const cats=[...new Set(INTERVIEW_QA.map(q=>q.cat))];
  return `<div class="glass-card gold-card" style="margin-bottom:1rem">
    <h2>🎤 Interview Prep — Real Questions, Real Answers</h2>

  ${INTERVIEW_QA.map((item)=>`<div class="card animate-in" style="margin-bottom:.65rem;cursor:pointer" onclick="this.querySelector('.ia').style.display=this.querySelector('.ia').style.display==='none'||!this.querySelector('.ia').style.display?'block':'none'">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem">

      <p style="font-weight:700;font-size:.9rem;line-height:1.5">Q: ${item.q}</p></div>

}

function renderPracticeDue(){
  const due=dueItems();
  if(!due.length) return `<div class="card-sm"><p style="color:var(--ok);font-weight:700">✅ Nothing due right now — you're ahead! Come back tomorrow.</p></div>`;
  return `<div class="card-sm card-accent" style="margin-bottom:1rem">
    <div class="label" style="color:var(--gold)">Spaced Repetition Queue</div>
    <p style="margin-top:.4rem;color:var(--muted);font-size:.85rem">${due.length} item${due.length!==1?'s':''} due for review.</p>
