    <p class="muted" style="margin-bottom:1rem;font-size:.88rem">40 questions across all 4 domains. Takes ~60 minutes. Unlocks your personalised study plan.</p>
    <div class="grid-4" style="margin-bottom:1rem">
      <div class="stat"><div class="stat-num">40</div><div class="stat-label">Questions</div></div>
      <div class="stat"><div class="stat-num">60</div><div class="stat-label">Min</div></div>
      <div class="stat"><div class="stat-num">4</div><div class="stat-label">Domains</div></div>
      <div class="stat"><div class="stat-num">1×</div><div class="stat-label">Per 7 days</div></div>
    </div>
    <button class="btn btn-primary" onclick="startDiagnostic()">Begin Diagnostic →</button>
  </div>`;
}
function startDiagnostic(){
  const counts={'Cloud Concepts':10,'Security and Compliance':12,'Cloud Technology and Services':14,'Billing, Pricing and Support':4};
  let qs=[];DOMAINS.forEach(d=>qs=qs.concat(shuffle(window.QUESTIONS.filter(q=>q.domain===d)).slice(0,counts[d])));
  runQuiz(shuffle(qs),'diagnostic',onDiagnosticComplete);
}
function onDiagnosticComplete(results){
  const scores={};DOMAINS.forEach(d=>scores[d]={correct:0,total:0});
  results.forEach(r=>{const q=getQ(r.qid);if(!q)return;scores[q.domain].total++;if(r.correct)scores[q.domain].correct++;});
  const dp={};DOMAINS.forEach(d=>dp[d]=scores[d].total?Math.round(scores[d].correct/scores[d].total*100):0);
  diagnostic={score:Math.round(results.filter(r=>r.correct).length/results.length*100),scores:dp,date:Date.now(),total:results.length};
  saveAll();navigate('diagnostic');
}

function renderPracticeByDomain(){
  return `<div class="domain-cards-grid">

      const count=window.QUESTIONS.filter(q=>q.domain===d).length;
      const attempted=window.QUESTIONS.filter(q=>q.domain===d&&progress[q.id]&&progress[q.id].attempts>0).length;
      const pct=Math.round(attempted/count*100)||0;
      return `<div class="domain-card" style="border-color:${color}30">

            </div>
          </div>
          <div class="domain-card-pct" style="color:${acc===null?'var(--muted)':acc>=70?'var(--ok)':acc>=50?'var(--gold)':'var(--red)'}">${acc===null?'0%':acc+'%'}</div>

        <div class="domain-progress">

          <button class="btn btn-secondary btn-sm" onclick="startPractice('domain','${d}',0)">All</button>
        </div>

}
function renderPracticeExams(){
  const examSources={};
  window.QUESTIONS.forEach(q=>{if(q.source){const m=q.source.match(/exam-(\d+)/);if(m){const n=parseInt(m[1]);if(!examSources[n])examSources[n]={num:n,questions:[],attempted:0,correct:0};examSources[n].questions.push(q);const p=progress[q.id];if(p&&p.attempts>0){examSources[n].attempted++;examSources[n].correct+=p.correct;}}}});
  const exams=Object.values(examSources).sort((a,b)=>a.num-b.num);
  if(exams.length===0) return `<div class="card-sm"><p class="muted">No practice exams loaded.</p></div>`;
  return `<div class="card-sm" style="margin-bottom:1rem"><h2>Practice Exams 1–${exams.length}</h2><p class="muted" style="font-size:.85rem">${window.EXTERNAL_QUESTIONS?window.EXTERNAL_QUESTIONS.length:0} questions across ${exams.length} exams.</p></div>
  <div class="grid-2">
    ${exams.map(e=>{const acc=e.attempted>0?Math.round(e.correct/e.attempted*100):null;return `<div class="card-sm">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem"><span style="font-weight:800">Exam ${e.num}</span>${acc!==null?`<span style="font-weight:800;color:${acc>=80?'var(--ok)':acc>=60?'var(--gold)':'var(--red)'}">${acc}%</span>`:''}</div>
      <div class="muted" style="margin-bottom:.5rem">${e.questions.length} questions</div>
      <button class="btn btn-primary btn-sm" onclick="startPracticeExam(${e.num})">Start Exam ${e.num} →</button>
    </div>`;}).join('')}
  </div>`;
}
function startPracticeExam(num){
  const qs=shuffle(window.QUESTIONS.filter(q=>q.source&&q.source.includes(`exam-${num}`)));
  if(!qs.length){toast('No questions found.','err');return;}
  runQuiz(qs,'practice',onPracticeComplete);
}

les instead of access keys?',a:'IAM Roles provide temporary credentials that AWS rotates automatically. Access keys can be leaked in code, logs, or git repos. Best practice: always use roles for applications running on AWS.',cat:'Security'}];

function flipCard3d(){const el=document.getElementById('flashcard');if(el) el.classList.toggle('flipped');}

function fcNav(dir){
  const c=document.getElementById('flashcard-container');
  if(!c) return;
  const pool=JSON.parse(c.dataset.pool);
  let idx=parseInt(c.dataset.idx)+dir;
  if(idx<0||idx>=pool.length) return;
  c.dataset.idx=idx;
  const q=getQ(pool[idx]);
  const fc=document.getElementById('flashcard');
  if(fc) fc.outerHTML=renderFlashcardItem(q,idx,pool.length);
  document.getElementById('fc-counter').textContent=`${idx+1} / ${pool.length}`;
  document.getElementById('fc-prev').disabled=idx===0;
  document.getElementById('fc-next').disabled=idx===pool.length-1;
  document.querySelectorAll('.fc3-dot').forEach((d,i)=>{d.classList.toggle('active',i===idx);if(i<idx) d.classList.add('seen');});
}

function fcJump(idx){
  const c=document.getElementById('flashcard-container');
  if(!c) return;
  c.dataset.idx=idx;
  const pool=JSON.parse(c.dataset.pool);
  const q=getQ(pool[idx]);
  const fc=document.getElementById('flashcard');
  if(fc) fc.outerHTML=renderFlashcardItem(q,idx,pool.length);
  document.getElementById('fc-counter').textContent=`${idx+1} / ${pool.length}`;
  document.getElementById('fc-prev').disabled=idx===0;
  document.getElementById('fc-next').disabled=idx===pool.length-1;
  document.querySelectorAll('.fc3-dot').forEach((d,i)=>{d.classList.toggle('active',i===idx);if(i<idx) d.classList.add('seen');});
}

let quizState=null;
function startPractice(mode,domain,count){
  let qs;
  if(mode==='due') qs=shuffle(dueItems()).slice(0,30);
  else if(mode==='domain'){const pool=window.QUESTIONS.filter(q=>q.domain===domain);qs=count===0?shuffle(pool):shuffle(pool).slice(0,count);}
  if(!qs||!qs.length){toast('No questions available.','err');return;}
  runQuiz(qs,'practice',onPracticeComplete);
}
function runQuiz(questions,mode,onComplete){
  quizState={questions,mode,idx:0,results:[],onComplete,startTime:Date.now()};
  document.getElementById('main-content').innerHTML=renderQuizQuestion();
  attachQuizListeners();
}
function renderQuizQuestion(){
  const{questions,idx}=quizState,q=questions[idx],isMulti=q.type==='multi';
  const pct=Math.round(idx/questions.length*100);
  return `<div style="margin-bottom:1rem">
    <div class="q-header">
      <div style="display:flex;align-items:center;gap:.4rem">
        <span class="badge ${DOMAIN_BADGE[q.domain]}">${DOMAIN_SHORT[q.domain]}</span>
        ${!q.verified?`<span class="badge badge-unverified">unverified</span>`:''}
      </div>
      <span class="muted" style="font-size:.85rem;font-weight:600">${idx+1} / ${questions.length}</span>
    </div>
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  ${isMulti?`<div class="card-sm card-accent" style="margin-bottom:.7rem;font-size:.83rem">✋ Select <strong>all correct answers</strong> then click Submit.</div>`:''}
  <div class="card animate-in" id="quiz-card">
    <div class="q-stem">${q.stem}</div>
    <div class="options-list" id="options-list">
      ${q.options.map((o,i)=>`<button class="opt-btn animate-opt" data-opt="${String.fromCharCode(65+i)}" style="animation-delay:${i*0.06}s" ${isMulti?'data-multi="1"':''}>${o}</button>`).join('')}
    </div>
    ${isMulti?`<button class="btn btn-primary" id="submit-multi" style="margin-top:.7rem;display:none" disabled>Submit Answer</button>`:''}
  </div>
  <div id="rationale-area"></div>
  <div style="display:flex;justify-content:flex-end;margin-top:1rem" id="next-wrap"></div>`;
}
function attachQuizListeners(){
  const{questions,idx}=quizState,q=questions[idx],isMulti=q.type==='multi';
  const opts=document.querySelectorAll('.opt-btn'),submitBtn=document.getElementById('submit-multi');
  if(isMulti){
    opts.forEach(btn=>{btn.addEventListener('click',()=>{btn.classList.toggle('selected');const any=document.querySelectorAll('.opt-btn.selected').length>0;if(submitBtn){submitBtn.style.display='';submitBtn.disabled=!any;}});});
    if(submitBtn) submitBtn.addEventListener('click',()=>submitQuizAnswer(Array.from(document.querySelectorAll('.opt-btn.selected')).map(b=>b.dataset.opt)));
  } else {opts.forEach(btn=>{btn.addEventListener('click',()=>submitQuizAnswer([btn.dataset.opt]));});}
}
function submitQuizAnswer(chosen){
  const{questions,idx}=quizState,q=questions[idx];
  const isCorrect=arraysEqual(chosen.sort(),q.correct.slice().sort());
  recordAnswer(q.id,chosen,isCorrect);
  quizState.results.push({qid:q.id,correct:isCorrect,chosen});
  document.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=true;const letter=b.dataset.opt;
    if(q.correct.includes(letter)) b.classList.add('reveal-correct');
    if(chosen.includes(letter)&&!q.correct.includes(letter)) b.classList.add('incorrect');
    if(chosen.includes(letter)&&q.correct.includes(letter)) b.classList.add('correct');
  });
  const submitBtn=document.getElementById('submit-multi');if(submitBtn) submitBtn.disabled=true;
  if(isCorrect){const card=document.getElementById('quiz-card');if(card){const r=card.getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top);showXPFloat(10,r.left+r.width/2-20,r.top-10);}}
  const area=document.getElementById('rationale-area');
  if(area){
    const rationale=getRationale(q),wrongRationale=getWrongRationale(q);
    const tip=getInterviewTip(q);

    // ── Keyword chips from q.tags ──────────────────────────────
    const tagChips=(q.tags||[]).map(t=>`<span class="exp-tag">${t}</span>`).join('');

    // ── Correct option(s) with service definition lookup ──────
    const correctOptItems=q.options.filter(o=>q.correct.some(c=>o.startsWith(c+'.'))).map(o=>{
      const text=o.replace(/^[A-E]\.\s*/,'');
      let svcDef=null;
      for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){svcDef=SVC[key];break;}}
      return `<div class="exp-correct-item">
        <span class="exp-correct-letter">${o.charAt(0)}</span>
        <div>
          <div class="exp-correct-text">${text}</div>
          ${svcDef?`<div class="exp-svc-def">📖 ${svcDef}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // ── Wrong options with service definition + why wrong ─────
    const wrongOptItems=q.options.filter(o=>!q.correct.some(c=>o.startsWith(c+'.'))).map(o=>{
      const letter=o.charAt(0);const text=o.replace(/^[A-E]\.\s*/,'');
      const exp=wrongRationale[letter]||'';
      let svcDef=null;
      for(const key of Object.keys(SVC).sort((a,b)=>b.length-a.length)){if(text.includes(key)){svcDef=SVC[key];break;}}
      return `<div class="exp-wrong-item">
        <span class="exp-wrong-letter">${letter}</span>
        <div>
          <div class="exp-wrong-text">${text}</div>
          ${svcDef?`<div class="exp-svc-def">📖 ${svcDef}</div>`:''}
          ${exp?`<div class="exp-why-wrong">✗ ${exp}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // ── Feynman challenge (after correct) ─────────────────────
    const feynmanPrompt=isCorrect?`<div class="exp-feynman">
      <span class="exp-feynman-label">🧠 Feynman Check</span>
      Close your eyes. Can you explain <em>why</em> this answer is correct in one plain sentence — as if teaching someone who has never heard of AWS?
    </div>`:'';

    // ── Mental model fix (after wrong) ────────────────────────
    const mentalModelFix=!isCorrect?(()=>{
      const correctText=q.options.find(o=>q.correct.some(c=>o.startsWith(c+'.'))).replace(/^[A-E]\.\s*/,'');
      const chosenText=q.options.find(o=>o.startsWith(chosen[0]+'.'))||'';
      return `<div class="exp-mental-fix">
        <span class="exp-feynman-label">🔁 Mental Model Fix</span>
        You chose <strong>${chosenText.replace(/^[A-E]\.\s*/,'')}</strong> — the correct answer is <strong>${correctText}</strong>. Re-read the rationale, then say the correct answer out loud before clicking Next.
      </div>`;
    })():'';

    area.innerHTML=`<div class="exp-box ${isCorrect?'exp-correct':'exp-wrong'} animate-in">

      <!-- ── STATUS HEADER ── -->
      <div class="exp-status-row">
        <span class="exp-status-badge ${isCorrect?'exp-badge-ok':'exp-badge-err'}">${isCorrect?'✅ Correct +10 XP':'❌ Incorrect +2 XP'}</span>
        ${tagChips?`<div class="exp-tags">${tagChips}</div>`:''}
      </div>

      <!-- ── CORRECT ANSWER SECTION ── -->
      <div class="exp-section">
        <div class="exp-section-label exp-label-ok">✓ Correct Answer${q.correct.length>1?'s':''}</div>
        ${correctOptItems}
      </div>

      <!-- ── WHY IT'S CORRECT ── -->
      <div class="exp-section">
        <div class="exp-section-label">💡 Why this is correct</div>
        <div class="exp-rationale-text">${rationale}</div>
      </div>

      ${feynmanPrompt}${mentalModelFix}

      <!-- ── OTHER OPTIONS ── -->
      ${wrongOptItems?`<div class="exp-section exp-section-collapsible" id="exp-wrong-toggle" onclick="this.classList.toggle('open')">
        <div class="exp-section-label exp-label-err" style="cursor:pointer">✗ Other Options — tap to expand ▾</div>
        <div class="exp-wrong-list">${wrongOptItems}</div>
      </div>`:''}

      ${tip?`<div class="exp-interview">
        <span class="exp-feynman-label">🎤 Say it in an interview</span>
        ${tip}
      </div>`:''}

    </div>`;
  }
  const nextWrap=document.getElementById('next-wrap');
  if(nextWrap){
    if(idx+1<questions.length){nextWrap.innerHTML=`<button class="btn btn-primary" id="btn-next">Next Question →</button>`;document.getElementById('btn-next').addEventListener('click',advanceQuiz);}

function getInterviewTip(q){
  const tags=(q.tags||[]).map(t=>t.toLowerCase()).join(' '),stem=q.stem.toLowerCase();
  if(stem.includes('cloudtrail')||tags.includes('cloudtrail')) return 'Interviewers love asking "how would you investigate who deleted that resource?" — answer: CloudTrail logs every API call.';
  if(stem.includes('shared responsibility')||tags.includes('shared responsibility')) return 'Key line: "AWS is responsible for the cloud; I am responsible for what I put IN the cloud."';
  if(stem.includes('iam role')||tags.includes('iam role')) return 'If asked about securing an EC2 app, always say you use an IAM Role — never hard-code access keys.';
  if(stem.includes('high availab')||tags.includes('high availability')) return '"How would you make this highly available?" — multiple AZs, Load Balancer, Auto Scaling, RDS Multi-AZ.';
  if(stem.includes('sqs')||stem.includes('sns')) return '"What is the difference between SQS and SNS?" SQS = one-to-one queue. SNS = one-to-many broadcast.';
  return null;
}

        else if(stab==='keywords') content.innerHTML=renderExamKeywords();
        else if(stab==='terms') content.innerHTML=renderKeyTerms();
        else if(stab==='interview') content.innerHTML=renderInterviewPrep();
        else if(stab==='weakness') content.innerHTML=renderWeaknessDrill();
        else if(stab==='flashcards'){content.innerHTML=renderFlashcards();attachFlashcardListeners();}
      });

  }

}
function attachFlashcardListeners(){
  const container=document.getElementById('flashcard-container');if(!container) return;
  const pool=JSON.parse(container.dataset.pool);let idx=parseInt(container.dataset.idx)||0;
  const rebuild=()=>{
    const q=getQ(pool[idx]);
    container.innerHTML=renderFlashcardItem(q)+`
    <div style="display:flex;gap:.5rem;margin-top:1rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" id="fc-prev" ${idx===0?'disabled':''}>← Prev</button>
      <span class="muted" style="font-size:.85rem">${idx+1} / ${pool.length}</span>
      <button class="btn btn-secondary btn-sm" id="fc-next" ${idx===pool.length-1?'disabled':''}>Next →</button>
      <button class="btn btn-primary btn-sm" id="fc-flip">🔄 Flip Card</button>
    </div>`;
    attachFlashcardListeners();
  };
  document.getElementById('fc-flip')?.addEventListener('click',flipCard);
  document.getElementById('fc-next')?.addEventListener('click',()=>{if(idx<pool.length-1){idx++;rebuild();}});
  document.getElementById('fc-prev')?.addEventListener('click',()=>{if(idx>0){idx--;rebuild();}});
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function arraysEqual(a,b){if(a.length!==b.length) return false;for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;return true;}

(function(){
  const today=new Date().toDateString();
  if(streak.lastDate===today){/* same day */}
  else if(streak.lastDate===new Date(Date.now()-86400000).toDateString()){streak.count++;streak.lastDate=today;}
  else{streak.count=1;streak.lastDate=today;}
  saveAll();
})();

function getTodayPlan(){
  if(!window.STUDY_PLAN) return null;
  const today=new Date().toISOString().split('T')[0];
  return window.STUDY_PLAN.days.find(d=>d.date===today)||null;
}
function getCurrentPhase(){
  if(!window.STUDY_PLAN) return null;
  const today=new Date().toISOString().split('T')[0];
  return window.STUDY_PLAN.phases.find(p=>today>=p.startDate&&today<=p.endDate)||null;
}
function getDaysUntil(dateStr){
  return Math.max(0,Math.ceil((new Date(dateStr)-new Date())/(1000*60*60*24)));
}

      <div class="card-header-left"><span class="card-header-icon">💡</span><div class="card-header-title">Exam Day Tips — Read These the Night Before</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.5rem">
      ${plan.examDayTips.map((tip,i)=>`
      <div style="display:flex;align-items:flex-start;gap:.5rem;padding:.5rem .6rem;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06)">
        <span style="color:var(--gold);font-weight:900;font-size:.8rem;flex-shrink:0">${i+1}.</span>
        <span style="font-size:.78rem;color:var(--text);line-height:1.5">${tip}</span>
      </div>`).join('')}
    </div>
  </div>

  <!-- PHASES -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;margin-bottom:1rem">
    ${plan.phases.map(p=>{
      const isActive=today>=p.startDate&&today<=p.endDate;
      const isPast=today>p.endDate;
      return `<div class="glass-card" style="border-color:${p.color}${isActive?'60':'25'};${isActive?`box-shadow:0 0 24px ${p.color}30`:''}">
        ${isActive?`<div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:${p.color};margin-bottom:.4rem">● YOU ARE HERE</div>`:''}
        <div style="font-size:1.5rem;margin-bottom:.3rem">${p.emoji}</div>
        <div style="font-size:.85rem;font-weight:800;color:var(--text);margin-bottom:.2rem">${p.label}</div>
        <div style="font-size:.7rem;color:${p.color};font-weight:700;margin-bottom:.4rem">${p.dateRange}</div>
        <div style="font-size:.75rem;color:var(--muted);line-height:1.5;margin-bottom:.5rem">${p.description}</div>
        <div style="font-size:.7rem;color:var(--text);background:rgba(255,255,255,0.04);border-radius:8px;padding:.4rem .6rem;border-left:2px solid ${p.color}">💡 ${p.tip}</div>
      </div>`;
    }).join('')}
  </div>

  <!-- 9-DAY INTENSIVE PLAN -->
  <div class="glass-card gold-card animate-in" style="margin-bottom:1rem">
    <div class="card-header">
      <div class="card-header-left"><span class="card-header-icon">🔥</span><div><div class="card-header-title">9-Day Intensive Plan — Nov 26 to Dec 4</div><div class="card-header-sub">Your golden window. Full focus every day.</div></div></div>
    </div>
    ${plan.days.map(d=>{
      const isToday=d.date===today;
      const isPast=today>d.date;
      return `
      <div style="border:1px solid ${isToday?d.color+'60':'rgba(255,255,255,0.07)'};border-radius:14px;padding:.85rem 1rem;margin-bottom:.6rem;background:${isToday?`rgba(255,153,0,0.06)`:'rgba(255,255,255,0.02)'};${isToday?`box-shadow:0 0 16px ${d.color}20`:''}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${isToday?'.75rem':'.3rem'};flex-wrap:wrap;gap:.4rem">
          <div style="display:flex;align-items:center;gap:.5rem">
            <span style="font-size:1.1rem">${d.emoji}</span>
            <span style="font-weight:800;font-size:.88rem;color:${isToday?d.color:'var(--text)'}">${d.label}</span>
            <span style="padding:.12rem .5rem;border-radius:999px;font-size:.62rem;font-weight:800;background:${d.color}20;color:${d.color};border:1px solid ${d.color}40">${d.theme}</span>
            ${isToday?`<span style="padding:.12rem .5rem;border-radius:999px;font-size:.62rem;font-weight:800;background:rgba(255,153,0,0.2);color:var(--gold);border:1px solid rgba(255,153,0,0.4)">● TODAY</span>`:''}
            ${isPast&&!isToday?`<span style="font-size:.7rem;color:var(--muted)">✓ Past</span>`:''}
          </div>
          <div style="font-size:.72rem;color:var(--muted)">${d.focus}</div>
        </div>
        ${isToday?`
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.6rem">
          ${[d.morning,d.afternoon,d.evening].map((s,i)=>`
          <div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:.6rem;border:1px solid rgba(255,255,255,0.07)">
            <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:${['#FFB020','#3BA8FF','#8B5CF6'][i]};font-weight:800;margin-bottom:.3rem">${['🌅','☀️','🌙'][i]} ${s.duration}</div>
            <div style="font-size:.75rem;font-weight:700;margin-bottom:.3rem">${s.title}</div>
            ${s.tasks.map(t=>`<div style="font-size:.68rem;color:var(--muted);padding:.1rem 0;border-bottom:1px solid rgba(255,255,255,0.04)">• ${t}</div>`).join('')}
          </div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
          <span style="font-size:.75rem;font-weight:800;color:var(--gold)">🎯 ${d.target}</span>
          <button class="btn btn-primary btn-sm" onclick="navigate('weekly-flashcards');window._startDeck=${d.weekFlashcards-1}">Start Week ${d.weekFlashcards} Flashcards →</button>
          <button class="btn btn-secondary btn-sm" onclick="startPractice('domain','${['Cloud Concepts','Security and Compliance','Cloud Technology and Services','Cloud Technology and Services','Cloud Technology and Services','Cloud Technology and Services','Billing, Pricing and Support','Cloud Technology and Services','Cloud Technology and Services','Security and Compliance'][d.day-1]}',20)">Practice Questions →</button>
        </div>`:`
        <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
          <span style="font-size:.75rem;color:var(--muted)">🎯 ${d.target}</span>
          ${!isPast?`<button class="btn btn-secondary btn-sm" onclick="navigate('weekly-flashcards');window._startDeck=${d.weekFlashcards-1}">Week ${d.weekFlashcards} Flashcards</button>`:''}
        </div>`}
      </div>`;
    }).join('')}
  </div>

  <!-- LIGHT REVIEW DEC 5-13 -->
  <div class="glass-card blue-card animate-in" style="margin-bottom:1rem">
    <div class="card-header">
      <div class="card-header-left"><span class="card-header-icon">📖</span><div><div class="card-header-title">Light Review — Dec 5 to Dec 13</div><div class="card-header-sub">Medical Missionary. 15-25 min/day max. Maintenance only.</div></div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem">
      ${plan.lightReview.map(r=>{
        const isToday=r.date===today;
        const isPast=today>r.date;
        return `<div style="padding:.6rem .75rem;border-radius:12px;background:${isToday?'rgba(59,168,255,0.1)':'rgba(255,255,255,0.03)'};border:1px solid ${isToday?'rgba(59,168,255,0.4)':'rgba(255,255,255,0.07)'};${isToday?'box-shadow:0 0 12px rgba(59,168,255,0.2)':''}">
          <div style="font-size:.7rem;font-weight:800;color:${isToday?'var(--blue)':'var(--muted)'};margin-bottom:.25rem">${r.label}${isToday?' ● TODAY':''}</div>
          <div style="font-size:.75rem;font-weight:700;color:var(--text);margin-bottom:.2rem">${r.task}</div>
          <div style="font-size:.65rem;color:var(--muted)">${r.focus}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  WEEKLY FLASHCARDS — RENDER FUNCTIONS
// ═══════════════════════════════════════════════════════════════
let currentDeck=0;
let currentCard=0;
let cardFlipped=false;

function renderWeeklyFlashcards(){
  if(!window.FLASHCARD_DECKS||!window.FLASHCARD_DECKS.length){
    return `<div class="section-header"><h1>🃏 Week Flashcards</h1></div><div class="glass-card"><p class="muted">Flashcard decks not loaded. Make sure flashcards.js is in the folder.</p></div>`;
  }
  if(window._startDeck!==undefined){currentDeck=window._startDeck;window._startDeck=undefined;}
  currentCard=0;cardFlipped=false;
  const deck=window.FLASHCARD_DECKS[currentDeck];
  return `
  <div class="section-header">
    <h1>🃏 Week-by-Week Flashcards</h1>
    <span style="font-size:.8rem;color:var(--muted)">${window.FLASHCARD_DECKS.reduce((s,d)=>s+d.cards.length,0)} total cards across all weeks</span>
  </div>

  <!-- DECK SELECTOR -->
  <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem">
    ${window.FLASHCARD_DECKS.map((d,i)=>`
    <button class="wfc-tab${i===currentDeck?' active':''}" onclick="switchDeck(${i})" style="${i===currentDeck?`border-color:${d.color}60;color:${d.color};background:${d.color}18;box-shadow:0 0 14px ${d.color}25`:''}">
      <span class="wfc-tab-icon">${d.emoji}</span>W${d.week}
    </button>`).join('')}
  </div>

  <!-- CURRENT DECK INFO -->
  <div class="glass-card" style="border-color:${deck.color}30;margin-bottom:1rem">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div style="display:flex;align-items:center;gap:.6rem">
        <span style="font-size:1.5rem">${deck.emoji}</span>
        <div>
          <div style="font-weight:800;font-size:.95rem">${deck.title}</div>
          <div style="font-size:.72rem;color:var(--muted)">${deck.cards.length} cards</div>
        </div>
      </div>
      <div style="display:flex;gap:.4rem">
        <button class="btn btn-secondary btn-sm" onclick="shuffleDeck()">🔀 Shuffle</button>
        <button class="btn btn-primary btn-sm" onclick="startAutoFlash()">▶ Auto-Play</button>
      </div>
    </div>
    <div class="sc-progress-wrap" style="margin-top:.7rem;height:5px">
      <div class="sc-progress-fill" style="background:${deck.color};box-shadow:0 0 8px ${deck.color}50;width:${((currentCard+1)/deck.cards.length*100).toFixed(0)}%;height:5px;border-radius:999px;transition:width .4s"></div>
    </div>
    <div style="font-size:.68rem;color:var(--muted);margin-top:.3rem">Card ${currentCard+1} of ${deck.cards.length}</div>
  </div>

  <!-- FLASHCARD -->
  <div id="wfc-container">
    ${renderWeekCard(deck,currentCard)}
  </div>

  <!-- NAVIGATION -->
  <div style="display:flex;align-items:center;justify-content:center;gap:.75rem;margin-top:1rem;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" id="wfc-prev" onclick="wfcNav(-1)" ${currentCard===0?'disabled':''}>← Prev</button>
    <span style="font-size:.85rem;color:var(--muted);font-weight:600">${currentCard+1} / ${deck.cards.length}</span>
    <button class="btn btn-secondary btn-sm" id="wfc-next" onclick="wfcNav(1)" ${currentCard===deck.cards.length-1?'disabled':''}>Next →</button>
    <button class="btn btn-primary btn-sm" onclick="toggleWFC()">🔄 Flip</button>
  </div>

  <!-- ALL CARDS OVERVIEW -->
  <div style="margin-top:1.5rem">
    <div style="font-size:.8rem;font-weight:700;margin-bottom:.6rem;color:var(--muted)">All cards in this deck — click to jump</div>
    <div style="display:flex;flex-wrap:wrap;gap:.35rem">
      ${deck.cards.map((c,i)=>`
      <button onclick="jumpWFC(${i})" style="padding:.25rem .55rem;border-radius:8px;font-size:.65rem;font-weight:700;cursor:pointer;background:${i===currentCard?deck.color+'30':'rgba(255,255,255,0.04)'};border:1px solid ${i===currentCard?deck.color+'60':'rgba(255,255,255,0.08)'};color:${i===currentCard?deck.color:'var(--muted)'}">
        ${i+1}
      </button>`).join('')}
    </div>
  </div>`;
}

function renderWeekCard(deck,idx){
  const card=deck.cards[idx];
  return `
  <div class="flashcard-3d" id="wfc-card" onclick="toggleWFC()" style="min-height:230px">
    <div class="flashcard-3d-inner" id="wfc-inner" style="min-height:230px;border-radius:22px">
      <div class="fc3-face fc3-front" style="border-color:${deck.color}35;min-height:230px">
        <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,${deck.color},transparent);border-radius:22px 22px 0 0"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;height:60px;background:radial-gradient(ellipse at 50% 100%,${deck.color}18,transparent);border-radius:0 0 22px 22px;pointer-events:none"></div>
        <div style="font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:${deck.color};margin-bottom:.75rem;padding:.2rem .7rem;border-radius:999px;background:${deck.color}15;border:1px solid ${deck.color}30">${deck.emoji} ${deck.title} · Card ${idx+1}</div>
        <div style="font-size:1.02rem;font-weight:700;line-height:1.65;color:var(--text);margin-bottom:.8rem;max-width:90%">${card.q}</div>
        <div class="fc3-hint">👆 Tap card to reveal answer</div>
      </div>
      <div class="fc3-face fc3-back" style="border-color:${deck.color}25;min-height:230px">
        <div style="position:absolute;bottom:0;left:0;right:0;height:60px;background:radial-gradient(ellipse at 50% 100%,${deck.color}12,transparent);border-radius:0 0 22px 22px;pointer-events:none"></div>
        <div class="fc3-answer-label" style="color:${deck.color}">✅ Answer</div>
        <div style="font-size:.92rem;font-weight:700;line-height:1.75;color:var(--text);margin-bottom:.75rem;max-width:92%;white-space:pre-line">${card.a}</div>
        ${card.tip?`<div style="padding:.55rem .85rem;background:rgba(255,153,0,0.08);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;font-size:.78rem;line-height:1.6;width:100%;text-align:left">
          <span style="font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:800;display:block;margin-bottom:.2rem">⚡ Exam Tip</span>
          ${card.tip}
        </div>`:''}
      </div>
    </div>
  </div>`;
}

function toggleWFC(){
  cardFlipped=!cardFlipped;
  const inner=document.getElementById('wfc-inner');
  const card=document.getElementById('wfc-card');
  if(card) card.classList.toggle('flipped',cardFlipped);
}
function wfcNav(dir){
  const deck=window.FLASHCARD_DECKS[currentDeck];
  currentCard=Math.max(0,Math.min(deck.cards.length-1,currentCard+dir));
  cardFlipped=false;
  document.getElementById('wfc-container').innerHTML=renderWeekCard(deck,currentCard);
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function jumpWFC(idx){
  currentCard=idx;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function switchDeck(idx){
  currentDeck=idx;currentCard=0;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
}
function shuffleDeck(){
  const deck=window.FLASHCARD_DECKS[currentDeck];
  deck.cards=shuffle(deck.cards);
  currentCard=0;cardFlipped=false;
  document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();
  toast('Deck shuffled! 🔀');
}
let _autoFlashInterval=null;
function startAutoFlash(){
  if(_autoFlashInterval){clearInterval(_autoFlashInterval);_autoFlashInterval=null;toast('Auto-play stopped');return;}
  toast('Auto-play: 4s per side ▶');
  _autoFlashInterval=setInterval(()=>{
    if(!cardFlipped){toggleWFC();}
    else{
      const deck=window.FLASHCARD_DECKS[currentDeck];
      if(currentCard<deck.cards.length-1){currentCard++;cardFlipped=false;document.getElementById('main-content').innerHTML=renderWeeklyFlashcards();}
      else{clearInterval(_autoFlashInterval);_autoFlashInterval=null;toast('Deck complete! 🎉','ok');}
    }
  },4000);
}

navigate('home');function renderTerminologyGym(){
  return `<div class="section-header"><h1>🏋️ Terminology Gym</h1><span class="muted">Exam keywords mapped to answers — from your Praesignis curriculum</span></div>` + renderExamKeywords().split('</div>').slice(1).join('</div>');
}

applyTheme(appTheme);
navigate('home');
updateTopbar();

// Safety net: save state whenever the tab is hidden or closed (critical on mobile)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') saveAll();});
window.addEventListener('beforeunload',()=>saveAll());
window.addEventListener('pagehide',()=>saveAll());
</script>
</body>
